<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brazil 1930-1988: Final Study</title>
<meta name="description" content="Study games and notes for the HIST 1475 final: Brazil 1930-1988, democracy and dictatorship.">
<meta name="theme-color" content="#f5f6fa">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brazil 1930-88">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface2: #eef0f6;
  --text: #171a26;
  --muted: #5f667d;
  --faint: #8a90a3;
  --border: #e0e3ec;
  --accent: #0a8a52;
  --accent-ink: #ffffff;
  --accent-soft: #e2f5ec;
  --gold: #f5c518;
  --navy: #1d3a8a;
  --good: #15a34a;
  --good-soft: #dcf7e6;
  --bad: #e11d48;
  --bad-soft: #fde4ea;
  --warn: #c27803;
  --warn-soft: #fdf1d8;
  --film: #7c3aed;
  --film-soft: #efe7fe;
  --shadow: 0 1px 2px rgba(15, 20, 40, .05), 0 6px 20px rgba(15, 20, 40, .06);
  --radius: 14px;
  --r-oligarchic: #9a8468;
  --r-democracy: #16a34a;
  --r-populist_democracy: #0d9488;
  --r-dictatorship: #dc2626;
  --r-transition: #e69500;
  --r-other: #64748b;
  --c-event: #2563eb;
  --c-person: #c2410c;
  --c-term: #0d9488;
  --c-reading: #7c3aed;
  --c-era: #64748b;
  --c-theme: #be185d;
  --c-prompt: #4d7c0f;
  --c-flashcard: #475569;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0f1218;
  --surface: #171b24;
  --surface2: #202533;
  --text: #e8eaf1;
  --muted: #a1a8bd;
  --faint: #7b8297;
  --border: #2a3040;
  --accent: #22c47b;
  --accent-ink: #06200f;
  --accent-soft: #123526;
  --navy: #7ea2ff;
  --good: #34d399;
  --good-soft: #0f3326;
  --bad: #fb7185;
  --bad-soft: #3d1621;
  --warn: #fbbf24;
  --warn-soft: #3a2c0c;
  --film: #b794f6;
  --film-soft: #2a1f45;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  --c-event: #6ea8ff;
  --c-person: #fb923c;
  --c-term: #2dd4bf;
  --c-reading: #b794f6;
  --c-era: #94a3b8;
  --c-theme: #f472b6;
  --c-prompt: #a3e635;
  --c-flashcard: #94a3b8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
kbd {
  display: inline-block; min-width: 1.5em; padding: 0 .35em; border-radius: 5px;
  border: 1px solid var(--border); border-bottom-width: 2px; background: var(--surface2);
  font: 600 .72em/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); text-align: center;
}
.skip { position: absolute; left: -999px; }
.skip:focus { left: 8px; top: 8px; z-index: 100; background: var(--surface); padding: 6px 10px; border-radius: 8px; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }

/* header */
.top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 18px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); font-size: 17px; white-space: nowrap; }
.brand b { color: var(--accent); }
.search-wrap { flex: 1; position: relative; max-width: 460px; margin-left: auto; }
.search-ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); }
#q {
  width: 100%; padding: 8px 12px 8px 34px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 15px;
}
.hud { display: flex; align-items: center; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border); font-weight: 650; font-size: 14px; white-space: nowrap;
}
.pill svg { flex: none; }
.pill.bump { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.18); } }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); cursor: pointer;
}
@media (hover: hover) { .icon-btn:hover { background: var(--surface2); } }
.tabs {
  display: flex; gap: 4px; padding: 8px 14px; overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--border); background: var(--bg);
}
.tabs::-webkit-scrollbar { display: none; }
.tabs a {
  flex: none; padding: 6px 12px; border-radius: 999px; text-decoration: none; color: var(--muted);
  font-weight: 600; font-size: 14px; white-space: nowrap;
}
@media (hover: hover) { .tabs a:hover { background: var(--surface2); color: var(--text); } }
.tabs a.on { background: var(--accent); color: var(--accent-ink); }
main { max-width: 1060px; margin: 0 auto; padding: 22px 18px 50px; outline: none; }
.foot { text-align: center; color: var(--faint); font-size: 13px; padding: 0 16px 30px; }
.banner {
  max-width: 1060px; margin: 14px auto 0; padding: 10px 14px; border-radius: 12px;
  background: var(--bad-soft); color: var(--bad); font-weight: 600; font-size: 14px; border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
}
@media (max-width: 1100px) { .banner { margin: 14px 18px 0; } }

/* generic */
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.01em; }
h2 { font-size: 20px; margin: 26px 0 12px; letter-spacing: -.01em; }
h3 { font-size: 17px; margin: 0 0 6px; }
p { margin: 0 0 10px; }
.sub { color: var(--muted); margin: 0 0 18px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.grow { flex: 1; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 12px; }
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px;
}
.card.flat { box-shadow: none; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
.kicker.warn { color: var(--warn); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); font-weight: 650; cursor: pointer; text-decoration: none; color: var(--text);
  transition: transform .08s ease, background .15s ease;
}
@media (hover: hover) { .btn:hover { background: var(--surface2); } }
.btn:active { transform: translateY(1px) scale(.99); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
@media (hover: hover) { .btn.primary:hover { filter: brightness(1.06); } }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 14px; border-radius: 8px; }
.btn kbd { background: transparent; border-color: currentColor; color: inherit; opacity: .7; }
.btn[disabled] { opacity: .5; cursor: default; }
select, input[type="text"], input[type="number"], textarea {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px;
}
textarea { width: 100%; resize: vertical; min-height: 64px; line-height: 1.45; }
label.field { display: block; font-weight: 650; font-size: 14px; margin-bottom: 4px; }
.seg { display: inline-flex; background: var(--surface2); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg a, .seg button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  font-weight: 650; font-size: 14px; color: var(--muted); text-decoration: none;
}
.seg .on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.badge {
  display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: var(--surface2); color: var(--muted); vertical-align: middle; white-space: nowrap;
}
.badge-imp1 { background: var(--gold); color: #3b2f00; }
.badge-imp2 { background: var(--surface2); color: var(--muted); }
.badge-imp3 { background: transparent; border: 1px dashed var(--border); color: var(--faint); }
.badge-outside { background: transparent; border: 1px solid var(--border); color: var(--faint); font-weight: 600; }
.badge-pack { background: var(--warn-soft); color: var(--warn); }
.badge-film { background: var(--film-soft); color: var(--film); }
.badge-verified { background: var(--good-soft); color: var(--good); }
.badge-regime { color: #fff; }
.srcs { margin-top: 10px; font-size: 12px; color: var(--faint); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.angle {
  margin-top: 10px; padding: 10px 12px; border-left: 4px solid var(--accent); background: var(--accent-soft);
  border-radius: 0 10px 10px 0; font-size: 15px;
}
.angle b { color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  --cc: var(--c-flashcard);
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--cc) 40%, transparent);
  background: color-mix(in srgb, var(--cc) 10%, var(--surface)); color: var(--text);
  text-align: left;
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--cc); flex: none; }
@media (hover: hover) { .chip:hover { background: color-mix(in srgb, var(--cc) 20%, var(--surface)); } }
.chip-event { --cc: var(--c-event); } .chip-person { --cc: var(--c-person); } .chip-term { --cc: var(--c-term); }
.chip-reading { --cc: var(--c-reading); } .chip-era { --cc: var(--c-era); } .chip-theme { --cc: var(--c-theme); }
.chip-prompt { --cc: var(--c-prompt); } .chip-flashcard { --cc: var(--c-flashcard); }
.chip-missing { cursor: default; opacity: .6; }
.chip.hit { box-shadow: 0 0 0 2px var(--good); }
.chip .x { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 0 0 0 4px; font-size: 15px; line-height: 1; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.notice { padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--text); font-size: 14px; border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }

/* home */
.hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
.countdown { display: flex; flex-direction: column; justify-content: center;
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--navy))); color: #fff; border: 0; }
.countdown .big { font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.countdown .kicker { color: rgba(255,255,255,.8); }
.countdown p { color: rgba(255,255,255,.92); margin: 8px 0 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: center; text-align: center; }
.stat .n { font-size: 26px; font-weight: 800; }
.stat .l { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.ring { display: inline-flex; flex-direction: column; align-items: center; }
.ring-bg { stroke: var(--surface2); }
.ring-fg { stroke: var(--accent); transition: stroke-dashoffset .8s ease; }
.ring-txt { font-weight: 800; font-size: 17px; fill: var(--text); }
.ring-label { font-size: 13px; font-weight: 650; margin-top: 4px; }
.ring-sub { font-size: 12px; color: var(--faint); }
.rings { display: flex; flex-wrap: wrap; gap: 18px; justify-content: space-around; }
.plan { list-style: none; padding: 0; margin: 0; counter-reset: step; }
.plan li {
  display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border);
}
.plan li:last-child { border-bottom: 0; }
.plan .num {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface2); font-weight: 800; font-size: 14px; color: var(--muted);
}
.plan li.done .num { background: var(--good); color: #fff; }
.plan li.done .t { text-decoration: line-through; color: var(--muted); }
.plan .t { font-weight: 700; }
.plan .d { font-size: 13px; color: var(--muted); }
.plan .mins { font-size: 12px; color: var(--faint); font-weight: 700; white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(190px, 100%), 1fr)); gap: 12px; }
.tile {
  display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--border); text-decoration: none; color: var(--text);
  box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s ease;
}
@media (hover: hover) { .tile:hover { transform: translateY(-2px); border-color: var(--accent); } }
.tile .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.tile b { font-size: 16px; }
.tile span { font-size: 13px; color: var(--muted); }

/* games shared */
.game { max-width: 760px; margin: 0 auto; }
.game-hud { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-weight: 700; color: var(--muted); font-size: 14px; }
.progress { flex: 1; height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
.combo { display: inline-flex; align-items: center; gap: 3px; }
.combo.hot { color: #f97316; }
.combo.hot svg { animation: flick .6s ease-in-out infinite alternate; }
@keyframes flick { to { transform: scale(1.15) rotate(-6deg); } }
.q-card { margin-bottom: 14px; }
.q-prompt { font-size: 19px; line-height: 1.5; }
.q-prompt .role { font-weight: 700; color: var(--accent); display: block; margin-bottom: 4px; font-size: 15px; }
.options { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 12px; text-align: left;
  border: 2px solid var(--border); background: var(--surface); cursor: pointer; font-size: 16px; font-weight: 600;
  transition: border-color .12s ease, background .12s ease, transform .08s ease;
}
@media (hover: hover) { .opt:hover:not([disabled]) { border-color: var(--accent); } }
.opt:active:not([disabled]) { transform: scale(.99); }
.opt[disabled] { cursor: default; }
.opt.correct { border-color: var(--good); background: var(--good-soft); animation: pop .35s ease; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.dim { opacity: .55; }
@keyframes pop { 50% { transform: scale(1.025); } }
.shake { animation: shake .4s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.explain { margin-top: 14px; }
.verdict { font-weight: 800; font-size: 18px; margin-bottom: 6px; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }
.result { text-align: center; padding: 26px 18px; }
.result .score { font-size: 54px; font-weight: 800; line-height: 1.05; }
.result .score small { font-size: 22px; color: var(--muted); }
.perfect { display: inline-block; margin: 8px 0; padding: 4px 14px; border-radius: 999px; background: var(--gold); color: #3b2f00; font-weight: 800; }
.xpfloat {
  position: fixed; z-index: 90; pointer-events: none; font-weight: 800; color: var(--accent);
  transform: translate(-50%, 0); animation: rise 1s ease-out forwards; text-shadow: 0 1px 0 var(--surface);
}
@keyframes rise { to { transform: translate(-50%, -46px); opacity: 0; } }
.hint { font-size: 13px; color: var(--faint); margin-top: 12px; text-align: center; }

/* flashcards */
.fc-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.fc-top select { font-size: 14px; padding: 6px 8px; }
.counts { display: flex; gap: 8px; font-size: 13px; font-weight: 700; }
.counts span { padding: 2px 9px; border-radius: 99px; background: var(--surface2); }
.counts .new { color: var(--c-event); }
.counts .due { color: var(--warn); }
.counts .learned { color: var(--good); }
.flip { perspective: 1400px; cursor: pointer; margin-bottom: 14px; }
.flip-inner { display: grid; transition: transform .5s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
.flip.on .flip-inner { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  min-height: 250px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  padding: 26px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
}
.face.back { transform: rotateY(180deg); text-align: left; align-items: stretch; }
.face .front-text { font-size: 26px; font-weight: 750; line-height: 1.3; }
.face .back-text { font-size: 18px; line-height: 1.55; }
.face .tags { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.box-dots { display: inline-flex; gap: 3px; }
.box-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--surface2); display: inline-block; }
.box-dots i.on { background: var(--accent); }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grade .btn { flex-direction: column; gap: 2px; padding: 12px; }
.grade .btn small { font-weight: 500; font-size: 12px; color: var(--muted); }
.grade .again { border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.grade .good { border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.grade .easy { border-color: color-mix(in srgb, var(--c-event) 45%, transparent); }

/* timeline */
.tl-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.tl-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.tl-inner { position: relative; }
.tl-band {
  position: absolute; top: 8px; height: 38px; border-radius: 8px; color: #fff; font-size: 12px; font-weight: 700;
  padding: 3px 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; border: 2px solid transparent; line-height: 1.25;
}
.tl-band small { display: block; font-weight: 600; opacity: .85; }
.tl-band.sel { border-color: var(--text); }
.tl-tick { position: absolute; top: 52px; bottom: 0; border-left: 1px dashed var(--border); }
.tl-tick span { position: absolute; top: 0; left: 4px; font-size: 11px; color: var(--faint); font-weight: 700; }
.tl-tick.major { border-left-style: solid; }
.tl-ev {
  position: absolute; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 0;
  border: 0; background: transparent; cursor: pointer; white-space: nowrap; font-size: 12.5px; color: var(--text);
  transform: translateX(-6px);
}
.tl-ev .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c-event); flex: none; }
.tl-ev.imp1 .dot { background: var(--c-event); }
.tl-ev.imp1 .lab { font-weight: 750; }
.tl-ev .lab { max-width: 190px; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--surface) 80%, transparent); border-radius: 4px; padding: 0 3px; }
.tl-ev.sel .lab { background: var(--c-event); color: #fff; }
@media (hover: hover) { .tl-ev:hover .lab { background: var(--c-event); color: #fff; } }
.tl-ev.sel .dot { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c-event) 30%, transparent); }
.tl-detail { margin-top: 14px; }
.order-list { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }

/* essay */
.essay-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
select {

}

/* search */

/* modal */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 18px; }

  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 95;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 650; font-size: 14px;
  transition: opacity .2s ease, transform .2s ease; pointer-events: none; max-width: 90vw;

/* cram */

/* ---------- shared touch and layout basics ---------- */
:root { --top-h: 57px; --bn-h: 60px; --runner-h: 0px; --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }

  letter-spacing: .04em; text-transform: uppercase; opacity: 0; pointer-events: none; background: var(--surface); transition: opacity .1s;

/* plan runner */
#runner { position: sticky; top: calc(var(--top-h) + var(--sat)); z-index: 25; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }

.vt-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

/* desktop-only and mobile-only blocks */

  .m-only { display: none !important; }
}

@media (max-width: 720px) {

  .top { padding: calc(6px + var(--sat)) calc(12px + var(--sar)) 6px calc(12px + var(--sal)); gap: 8px; min-height: calc(var(--top-h) + var(--sat)); }

  .pill { padding: 6px 10px; min-height: 36px; }
  .bottomnav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    height: calc(var(--bn-h) + var(--sab)); padding: 0 var(--sar) var(--sab) var(--sal);
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);

  }

  main { padding: 14px calc(14px + var(--sar)) calc(var(--bn-h) + var(--sab) + 28px) calc(14px + var(--sal)); }
  .banner { margin: 10px 14px 0; }
  #toast { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%) translateY(-20px); }
  .runner-in { padding: 8px 14px; }
  h1 { font-size: 24px; }
  h2 { font-size: 18px; margin: 22px 0 10px; }
  .sub { font-size: 15px; }
  .card { padding: 14px; }

  /* touch targets */

  .btn.sm { min-height: 44px; padding: 8px 14px; }

  .picker-filter { min-height: 44px; }
  .chip { padding: 6px 12px; font-size: 14px; }

  select, input[type="text"], input[type="search"], textarea { padding: 10px 12px; }
  .wide-m { width: 100%; }

  /* home */
  .hero { grid-template-columns: 1fr; gap: 12px; }
  .countdown { padding: 18px; }
  .countdown .big { font-size: 50px; }

  .plan li { gap: 10px; padding: 10px 0; }

  .play-a { margin-top: auto; padding-top: 12px; }

  .q-prompt { font-size: 17px; }

  /* timeline */

  /* bottom sheet */

window.CONTENT = {"meta":{"generated":"2026-11-16","exam":"HIST 1475 final, in-class handwritten essay, Thu 19 Nov 2026: two questions, answer one; covers Weeks 9-12 (Vargas era to the transition and 1988).","notes":"1982 governor elections: McCann says voters chose from an open slate 'for the first time since 1960'; direct governor elections were also held in 11 states in 1965 (general), so the content says 'first open slate since 1960, per McCann'. | Edition note: Vargas's letter text is the 2nd-ed. Brazil Reader (pp. 380-82, Levine translation); the course pack is the 1st ed. (pp. 222-24). Quote pages refer to the 2nd ed.; check wording against the course pack. The slide 31 translation differs slightly ('To hatred, I respond with forgiveness'). | Ulysses Guimar\u00e3es quote: the health essay gives 'We hate dictatorship. Hate and disgust.'; Lecture 13 slide 12 gives 'We have hatred for dictatorships. Hatred and disgust.' Either is acceptable; cite which. | Economic miracle figures differ by source: slides give average growth about 10%/yr and inflation about 20%/yr (1968-73); Teixeira gives 11% average growth and inflation falling to 16% by 1973 (an official figure later shown to be manipulated; unions calculated 22.5% for 1973). | Lula's term: Lecture 13 slide 2 says 2003-2011, slide 25 says 2003-2010 (he served 1 Jan 2003 to 31 Dec 2010). | Two-party system: McCann says the regime outlawed all parties but two 'in the late 1960s'; the standard date (general) is AI-2 in October 1965, with ARENA and MDB formed in 1966. | UnB invasion: slide says 1965; troops also entered the university in 1964 and 1968 (general). | Items resting only on general knowledge (not class materials): see validator report. Less-than-certain items: Castelo Branco birth year (1897; some sources give 1900) and Costa e Silva birth year (1899; some sources give 1902); March of the 100,000 date (26 June 1968); Volta Redonda dates (CSN created 1941, production 1946); 'C\u00e1lice' composed 1973 with Gilberto Gil; the film's press-photo scene and Eunice's detention details; Oliveira Vianna's views (no course-pack text on disk). | Course-pack-only readings (Vianna; Ordinary People) are summarized from general knowledge and the Activity 4 prompt only, with no quotes. Use your own course-pack notes for specifics. | The Week 9 Thursday deck ('Populism and Citizenship') was not available; Vargas-era populism content comes from the Week 9 Tuesday deck key points and readings. | Slide OCR notes: L9 slide 15 shows Correio da Manh\u00e3 (1 Oct 1937) reporting a seized 'Komintern' coup plan (the Cohen Plan, later shown forged: general). L9 slide 30 shows the \u00daltima Hora headline 'Matou-se Vargas!'. L9/L13 slide 32/24 is Carlos Heitor Cony's column 'O fim que n\u00e3o acaba' (Jornal do Commercio, 31 Mar 1995) on FHC announcing the end of the Vargas era. W10pt2 slide 12 shows the AI-5 text dated 13 Dec 1968 quoting AI-1 (9 Apr 1964) on assuring an 'aut\u00eantica ordem democr\u00e1tica'. L13 slide 10 shows the banner 'Constituinte sem povo n\u00e3o cria nada de novo'. W11/L13 'Pelo congelamento dos pre\u00e7os' banner (cost-of-living protest)."},"eras":[{"id":"first_republic","label":"First Republic (Old Republic)","start":1889,"end":1930,"regime":"oligarchic","summary":"After the 1889 coup ended the monarchy, coffee and cattle elites of S\u00e3o Paulo and Minas Gerais traded the presidency between them (caf\u00e9 com leite). Governments bought surplus coffee to prop up prices (valorization, from 1906).","democracy_angle":"A republic in name, but a narrow oligarchy controlled elections and most Brazilians had no real political voice.","sources":["slides/HIST1474_Lecture9_F26.md#4","slides/HIST1474_Lecture9_F26.md#6","slides/HIST1474_Lecture9_F26.md#7","slides/HIST1474_Lecture9_F26.md#10"]},{"id":"vargas_revolution","label":"Vargas: 1930 Revolution and Constitutional Interlude","start":1930,"end":1937,"regime":"transition","summary":"The Great Depression wrecked the coffee economy and the 1930 Revolution brought Get\u00falio Vargas to power. A 1932 S\u00e3o Paulo revolt pushed him to accept the 1934 Constitution, but repression of the left grew after 1935.","democracy_angle":"Old oligarchic rule ended and social rights entered the 1934 Constitution, but democracy stayed fragile and was cut short in 1937.","sources":["slides/HIST1474_Lecture9_F26.md#4","slides/HIST1474_Lecture9_F26.md#13","slides/HIST1474_Lecture9_F26.md#14","slides/HIST1474_Lecture9_F26.md#15","readings/w12_teixeira_health_care_human_right.txt"]},{"id":"estado_novo","label":"Estado Novo dictatorship","start":1937,"end":1945,"regime":"dictatorship","summary":"Vargas cancelled the 1938 election and ruled by decree under the 10 November 1937 constitution. The regime built a centralized, corporatist state, drove industrialization (Volta Redonda) and codified labor rights.","democracy_angle":"Workers gained social rights from above while losing political rights: no elections, censorship, and state-controlled unions.","sources":["slides/HIST1474_Lecture9_F26.md#16","slides/HIST1474_Lecture9_F26.md#17","slides/HIST1474_Lecture9_F26.md#18","slides/HIST1474_Lecture9_F26.md#19","slides/HIST1474_Lecture9_F26.md#22"]},{"id":"populist_republic","label":"Populist Republic (1946 democracy)","start":1945,"end":1964,"regime":"populist_democracy","summary":"After Vargas was overthrown in 1945, Brazil held competitive elections. Vargas returned by popular vote (1950), Kubitschek promised Fifty Years in Five, and Goulart's term ended in the 1964 coup amid inflation and Cold War polarization.","democracy_angle":"Brazil's first mass electoral democracy expanded participation, but it was limited (illiterates could not vote) and was ended by the military with significant civilian support.","sources":["slides/HIST1474_Lecture9_F26.md#14","slides/HIST1474_Lecture9_F26.md#27","slides/HIST1474_WEEK10_FALL2026.md#2","slides/HIST1474_WEEK10_FALL2026.md#11","slides/HIST1474_WEEK10_FALL2026.md#13","slides/HIST1474_WEEK10_FALL2026.md#33","slides/HIST1474_WEEK10_FALL2026.md#34","slides/HIST1474_WEEK10_FALL2026.md#35","readings/w11_teixeira_living_with_inflation.txt p.158","general"]},{"id":"military_early","label":"Military regime: coup and authoritarian legalism","start":1964,"end":1968,"regime":"dictatorship","summary":"The armed forces deposed Goulart in 1964. Under Castelo Branco ('the Legalist') the regime ruled through Institutional Acts, purged politicians, created a two-party system, and imposed wage restraint.","democracy_angle":"The regime claimed to defend democracy while dismantling it by 'legal' decree.","sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#3","slides/HIST1474_WEEK10pt2_FALL2026.md#7","slides/HIST1474_WEEK10pt2_FALL2026.md#8","slides/HIST1474_WEEK10pt2_FALL2026.md#10","slides/HIST1474_WEEK10pt2_FALL2026.md#11","slides/HIST1474_WEEK10pt2_FALL2026.md#12","readings/w12_mccann_pavao_pavaozinho.txt p.192","readings/w12_mccann_pavao_pavaozinho.txt p.193"]},{"id":"lead_years","label":"Anos de Chumbo (Years of Lead) and the Economic Miracle","start":1968,"end":1974,"regime":"dictatorship","summary":"After the 1968 student protests the regime issued AI-5, closed Congress and escalated censorship, torture and disappearances under Costa e Silva and M\u00e9dici. At the same time the economy grew about 10 percent a year (the 'miracle').","democracy_angle":"The harshest repression coincided with the fastest growth, which bought the regime middle-class support.","sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#8","slides/HIST1474_WEEK10pt2_FALL2026.md#14","slides/HIST1474_WEEK10pt2_FALL2026.md#17","slides/HIST1474_WEEK10pt2_FALL2026.md#27","readings/w11_teixeira_living_with_inflation.txt p.160"]},{"id":"abertura","label":"Distens\u00e3o and Abertura: managed opening","start":1974,"end":1985,"regime":"transition","summary":"Geisel began a slow, top-down loosening (distens\u00e3o), and Figueiredo continued the opening (abertura): amnesty in 1979, new parties, open governor elections in 1982. Oil shocks, debt default and inflation fed strikes and the Diretas J\u00e1 movement.","democracy_angle":"The military tried to control the pace of democratization, but workers, social movements and voters pushed it further than planned.","sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#24","slides/HIST1474_WEEK11_FALL2026.md#26","slides/HIST1474_WEEK11_FALL2026.md#27","slides/Hist1475_Lecture13_F26.md#3","slides/Hist1475_Lecture13_F26.md#5","slides/Hist1475_Lecture13_F26.md#6","slides/Hist1475_Lecture13_F26.md#7","slides/Hist1475_Lecture13_F26.md#8","readings/w11_teixeira_living_with_inflation.txt p.166","readings/w12_mccann_pavao_pavaozinho.txt p.193"]},{"id":"new_republic","label":"New Republic and the 1988 Constitution","start":1985,"end":2026,"regime":"democracy","summary":"Civilian rule returned with the indirect election of Tancredo Neves in 1985; Jos\u00e9 Sarney governed through hyperinflation and the writing of the 1988 'Citizen Constitution.' Later governments (Collor, FHC, Lula, Dilma, Bolsonaro, Lula again) operated within this democracy to the present.","democracy_angle":"Democracy and social rights were written into law, but inflation, inequality and racial and regional exclusion limited how far citizenship reached in practice.","sources":["slides/Hist1475_Lecture13_F26.md#2","slides/Hist1475_Lecture13_F26.md#9","slides/Hist1475_Lecture13_F26.md#10","slides/Hist1475_Lecture13_F26.md#12","slides/Hist1475_Lecture13_F26.md#14","readings/w12_teixeira_health_care_human_right.txt"]}],"events":[{"id":"great_depression","year":1929,"title":"Great Depression hits Brazil","detail":"The 1929 crash collapsed coffee prices and exports, ruining the economic base of the caf\u00e9 com leite oligarchy.","era":"first_republic","democracy_angle":"The crisis discredited oligarchic liberalism and opened space for a strong-state, 'people versus elite' politics.","importance":2,"sources":["slides/HIST1474_Lecture9_F26.md#4","slides/HIST1474_Lecture9_F26.md#14"]},{"id":"revolution_1930","year":1930,"title":"Revolution of 1930","detail":"After losing the 1930 election, Get\u00falio Vargas of Rio Grande do Sul took power through an armed revolt backed by dissident elites and young officers, ending the caf\u00e9 com leite rotation.","era":"vargas_revolution","democracy_angle":"It ended oligarchic rule but by force, not by vote, setting a pattern of change from above.","importance":1,"sources":["slides/HIST1474_Lecture9_F26.md#4","slides/HIST1474_Lecture9_F26.md#13","slides/HIST1474_Lecture9_F26.md#14","general"]},{"id":"constitutionalist_revolt_1932","year":1932,"title":"Constitutionalist Revolt (S\u00e3o Paulo)","detail":"S\u00e3o Paulo elites rose against Vargas's provisional government demanding a constitution. They lost militarily, but Vargas then called a constituent assembly.","era":"vargas_revolution","democracy_angle":"Shows that 'constitutionalism' in this period was also a regional elite cause, not only a popular one.","importance":2,"sources":["slides/HIST1474_Lecture9_F26.md#14","general"]},{"id":"constitution_1934","year":1934,"title":"1934 Constitution","detail":"A new constitution included social and labor rights for the first time; the assembly then chose Vargas as president.","era":"vargas_revolution","democracy_angle":"Social rights appeared on paper, but the constitution did not guarantee universal suffrage and limited how rights could be exercised (Teixeira).","importance":2,"sources":["slides/HIST1474_Lecture9_F26.md#14","readings/w12_teixeira_health_care_human_right.txt","general"]},{"id":"cohen_plan","year":1937,"title":"'Communist plot' scare (Cohen Plan)","detail":"On 1 October 1937 newspapers such as Correio da Manh\u00e3 reported that the Army General Staff had seized Komintern instructions for a communist coup. The document (the 'Cohen Plan') was later shown to be a forgery.","era":"estado_novo","democracy_angle":"A fabricated threat was used to justify suspending democracy, a tactic the 1964 regime would echo with its anticommunism.","importance":3,"sources":["slides/HIST1474_Lecture9_F26.md#15","general"]},{"id":"estado_novo_coup","year":1937,"title":"Estado Novo self-coup","detail":"Vargas thwarted the scheduled 1938 presidential election and on 10 November 1937 proclaimed a new constitution, ruling as dictator until 1945.","era":"estado_novo","democracy_angle":"Ended electoral politics for eight years; a carnival song mocked that whoever the candidates were, 'Geg\u00ea' would stay.","importance":1,"sources":["slides/HIST1474_Lecture9_F26.md#14","slides/HIST1474_Lecture9_F26.md#16","slides/HIST1474_Lecture9_F26.md#17"],"date":"1937-11-10"},{"id":"volta_redonda","year":1941,"title":"Volta Redonda steel mill (CSN)","detail":"The state-owned National Steel Company was created in 1941 and began producing at Volta Redonda in 1946, financed with US help during the Second World War. Posters celebrated national self-sufficiency in steel.","era":"estado_novo","democracy_angle":"Symbol of state-led development under dictatorship: Loewenstein noted authoritarian governments are better at advertising progress, not necessarily at producing it.","importance":1,"sources":["slides/HIST1474_Lecture9_F26.md#19","slides/HIST1474_Lecture9_F26.md#20","slides/HIST1474_WEEK10_FALL2026.md#5","general"]},{"id":"clt_1943","year":1943,"title":"Consolidation of Labor Laws (CLT)","detail":"Vargas gathered labor legislation (minimum wage from 1940, eight-hour day, paid vacations, labor courts, state-recognized unions) into a single labor code announced on May Day 1943.","era":"estado_novo","democracy_angle":"Urban formal workers gained real rights, but through state-controlled unions; rural, domestic and informal workers were left out.","importance":1,"sources":["slides/HIST1474_Lecture9_F26.md#4","slides/HIST1474_Lecture9_F26.md#22","readings/w12_teixeira_health_care_human_right.txt","general"],"date":"1943-05-01"},{"id":"vargas_ousted_1945","year":1945,"title":"Vargas overthrown","detail":"Despite the 'We Want Get\u00falio' (queremismo) protests, the military removed Vargas in October 1945 and elections were held under a new democratic order (1946 Constitution).","era":"estado_novo","democracy_angle":"The dictatorship ended through a military intervention, not a popular movement, which made the army a political arbiter.","importance":2,"sources":["slides/HIST1474_Lecture9_F26.md#14","slides/HIST1474_Lecture9_F26.md#23","general"]},{"id":"vargas_elected_1950","year":1950,"title":"Vargas wins the 1950 election","detail":"Vargas returned to the presidency by popular vote, taking office in 1951, campaigning on nationalism and workers' welfare amid rising prices ('Ai, Geg\u00ea', 1950).","era":"populist_republic","democracy_angle":"The ex-dictator's democratic comeback shows how his social reforms had built a mass base: populism worked through elections.","importance":2,"sources":["slides/HIST1474_Lecture9_F26.md#14","slides/HIST1474_Lecture9_F26.md#26","slides/HIST1474_Lecture9_F26.md#27","readings/w09_vargas_suicide_letter.txt p.380"]},{"id":"maracanazo","year":1950,"title":"Maracanazo: World Cup final loss","detail":"On 16 July 1950 Brazil lost the World Cup final 2-1 to Uruguay before more than 199,000 spectators at the new Maracan\u00e3 stadium in Rio. The press blamed the players' lack of 'grit' and Mayor Mendes de Morais.","era":"populist_republic","democracy_angle":"Shows mass urban public culture and national identity in the democratic era, and how the press turned a football loss into political blame.","importance":2,"sources":["readings/w10_rio_reader_world_cup_defeat.txt p.218","readings/w10_rio_reader_world_cup_defeat.txt p.220","readings/w10_rio_reader_world_cup_defeat.txt p.221"],"date":"1950-07-16"},{"id":"petrobras_1953","year":1953,"title":"Creation of Petrobras","detail":"After the 'O petr\u00f3leo \u00e9 nosso!' (The oil is ours!) campaign against Standard Oil and foreign contracts, Vargas created the state oil company with a monopoly on oil.","era":"populist_republic","democracy_angle":"Economic nationalism mobilized a broad public campaign, a democratic movement for state control of resources.","importance":1,"sources":["slides/HIST1474_Lecture9_F26.md#28","slides/HIST1474_Lecture9_F26.md#29","slides/HIST1474_WEEK10_FALL2026.md#6","readings/w09_vargas_suicide_letter.txt p.381"]},{"id":"vargas_suicide","year":1954,"title":"Vargas's suicide and testament letter","detail":"Facing a campaign led by journalist Carlos Lacerda and pressure from military officers to resign, Vargas shot himself in the presidential palace on 24 August 1954. His letter blamed foreign and domestic enemies of the people and set off mass grief.","era":"populist_republic","democracy_angle":"His death turned him into a martyr of the poor and delayed a military takeover for a decade, while showing how fragile civilian rule was.","importance":1,"sources":["slides/HIST1474_Lecture9_F26.md#30","slides/HIST1474_Lecture9_F26.md#31","readings/w09_vargas_suicide_letter.txt p.380","readings/w09_vargas_suicide_letter.txt p.382"],"date":"1954-08-24"},{"id":"targets_plan_1956","year":1956,"title":"Kubitschek's Targets Plan (Plano de Metas)","detail":"On taking office in February 1956, JK launched 30 targets in five sectors (energy, transportation, food, basic industries, education), plus Bras\u00edlia as the 'synthesis goal,' to deliver Fifty Years in Five.","era":"populist_republic","democracy_angle":"JK used development as a substitute for immediate broad political inclusion, hoping a new middle class would stabilize democracy (Wolfe).","importance":1,"sources":["slides/HIST1474_WEEK10_FALL2026.md#11","slides/HIST1474_WEEK10_FALL2026.md#13","readings/w10_wolfe_autos_progress_ch5.txt p.116","readings/w10_wolfe_autos_progress_ch5.txt p.117","readings/w10_wolfe_autos_progress_ch5.txt p.114"]},{"id":"auto_industry","year":1957,"title":"Building a national auto industry","detail":"Through GEIA, JK offered incentives and tariffs to make foreign firms build vehicles in Brazil with 90 percent local content by 1960. Ford and GM made trucks, Willys and Volkswagen (S\u00e3o Bernardo do Campo, 1957) made cars; sector jobs rose from 15,000 (1957) to about 128,000 (1961).","era":"populist_republic","democracy_angle":"Created a well-paid autoworker 'labor elite' in S\u00e3o Paulo's ABC suburbs, the same workers who later led the 1978-80 strikes against the dictatorship.","importance":2,"sources":["slides/HIST1474_WEEK10_FALL2026.md#15","readings/w10_wolfe_autos_progress_ch5.txt p.117","readings/w10_wolfe_autos_progress_ch5.txt p.121","readings/w10_wolfe_autos_progress_ch5.txt p.141"]},{"id":"world_cup_1958","year":1958,"title":"Brazil wins the 1958 World Cup","detail":"Seventeen-year-old Pel\u00e9 scored in all three knockout games as Brazil won its first World Cup, eight years after the Maracanazo.","era":"populist_republic","democracy_angle":"Fed the optimism of JK's democratic developmentalism and a confident, mixed-race national image.","importance":2,"sources":["slides/HIST1474_WEEK10_FALL2026.md#29","readings/w10_rio_reader_world_cup_defeat.txt p.219"]},{"id":"cuban_revolution","year":1959,"title":"Cuban Revolution","detail":"Fidel Castro's revolution in Cuba sharpened Cold War fears across Latin America that reform movements could turn communist.","era":"populist_republic","democracy_angle":"Helped make any leftist reform look like a security threat, the logic later used to justify the 1964 coup.","importance":3,"sources":["slides/HIST1474_WEEK10_FALL2026.md#32","slides/HIST1474_WEEK10pt2_FALL2026.md#4","slides/HIST1474_WEEK10pt2_FALL2026.md#5"]},{"id":"brasilia_inauguration","year":1960,"title":"Bras\u00edlia inaugurated","detail":"JK opened the new interior capital on 21 April 1960, built by L\u00facio Costa (plan) and Oscar Niemeyer (buildings), with caravans of Brazilian-made vehicles arriving from all regions.","era":"populist_republic","democracy_angle":"Planned to make modern, equal citizens (superquadras assigned by family size, not income), but the workers who built it ended up in satellite cities outside the plan.","importance":1,"sources":["slides/HIST1474_WEEK10_FALL2026.md#18","slides/HIST1474_WEEK10_FALL2026.md#24","slides/HIST1474_WEEK10_FALL2026.md#25","slides/HIST1474_WEEK10_FALL2026.md#28","readings/w10_wolfe_autos_progress_ch5.txt p.135","readings/w10_wolfe_autos_progress_ch5.txt p.137","general"]},{"id":"goulart_presidency","year":1961,"title":"Quadros resigns; Goulart takes office","detail":"J\u00e2nio Quadros resigned in 1961 after a few months, and Vice President Jo\u00e3o Goulart, Vargas's political heir, took office over military resistance. Inflation approached 100 percent a year by March 1964.","era":"populist_republic","democracy_angle":"Polarization over reforms and inflation weakened civilian support for democracy, opening the way to the coup.","importance":2,"sources":["slides/HIST1474_WEEK10_FALL2026.md#33","slides/HIST1474_WEEK10_FALL2026.md#34","readings/w11_teixeira_living_with_inflation.txt p.158","general"]},{"id":"coup_1964","year":1964,"title":"Military coup of 1964","detail":"On 31 March-1 April 1964 the armed forces overthrew Goulart, backed by industrialists, much of the middle class, conservative women's groups like CAMDE and the US. The regime called it the 'Revolution of 31 March.'","era":"military_early","democracy_angle":"Began 21 years of military rule that was justified as saving democracy from communism and inflation.","importance":1,"sources":["slides/HIST1474_WEEK10_FALL2026.md#35","slides/HIST1474_WEEK10pt2_FALL2026.md#7","slides/Hist1475_Lecture13_F26.md#2","readings/w11_teixeira_living_with_inflation.txt p.158","general"],"date":"1964-03-31"},{"id":"ai1_1964","year":1964,"title":"Institutional Act No. 1","detail":"Issued 9 April 1964, it gave the new regime power to purge Congress and the civil service and revoke politicians' mandates (as happened to Rubens Paiva). Its preamble claimed the 'Revolution' would assure an 'authentic democratic order.'","era":"military_early","democracy_angle":"The first example of authoritarian legalism: a decree that suspended rights in the name of democracy.","importance":2,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#10","slides/HIST1474_WEEK10pt2_FALL2026.md#12","readings/w11_film_ainda_estou_aqui.md","general"],"date":"1964-04-09"},{"id":"paeg_wage_formula","year":1964,"title":"PAEG and the wage formula","detail":"Planning Minister Roberto Campos's program (1964-67) cut deficits, created inflation-indexed bonds and set wages by a government formula. Underestimated inflation meant Rio's real minimum wage fell 38 percent from 1964 to 1970.","era":"military_early","democracy_angle":"Replaced collective bargaining and strikes with technocratic arithmetic, shifting the cost of stabilization onto workers.","importance":2,"sources":["readings/w11_teixeira_living_with_inflation.txt p.159","readings/w11_teixeira_living_with_inflation.txt p.160"]},{"id":"ai2_two_parties","year":1965,"title":"Two-party system (AI-2)","detail":"After Institutional Act No. 2 (1965) abolished the old parties, only the pro-regime ARENA and the tolerated opposition MDB were allowed, mocked as 'the party of yes and the party of yes, sir.'","era":"military_early","democracy_angle":"Kept a fa\u00e7ade of elections and a Congress while removing real choice.","importance":2,"sources":["readings/w12_mccann_pavao_pavaozinho.txt p.192","readings/w12_mccann_pavao_pavaozinho.txt p.193","general"]},{"id":"figueiredo_report","year":1967,"title":"Figueiredo Report on crimes against Indigenous peoples","detail":"A government investigation documented murders and massacres, enslaved labor, land grabs and theft from Indigenous peoples by officials. An Indian Statute followed in 1973 promising land demarcation.","era":"military_early","democracy_angle":"Exposed that the state itself committed atrocities against Indigenous peoples, whose rights were only firmly recognized in 1988.","importance":2,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#19","slides/HIST1474_WEEK10pt2_FALL2026.md#20","slides/HIST1474_WEEK11_FALL2026.md#19","slides/HIST1474_WEEK11_FALL2026.md#20","readings/w11_nascimento_myth_racial_democracy.txt p.447"]},{"id":"constitution_1967","year":1967,"title":"1967 Constitution","detail":"The regime wrote its own constitution, including broad state-of-siege powers, to give its purges and curbs on civil rights a legal form.","era":"military_early","democracy_angle":"Shows the regime's legalistic bent: it rewrote the rules rather than govern openly without them.","importance":2,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#11","readings/w12_teixeira_health_care_human_right.txt"]},{"id":"march_100000","year":1968,"title":"March of the One Hundred Thousand","detail":"In June 1968 students, artists, clergy and middle-class citizens marched in Rio against police violence and the dictatorship, part of a global 1968 (Paris, Prague, Mexico City). Troops had already invaded the University of Bras\u00edlia in 1965.","era":"lead_years","democracy_angle":"The high point of open, legal protest, answered within months by AI-5.","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#13","slides/HIST1474_WEEK10pt2_FALL2026.md#15","slides/HIST1474_WEEK10pt2_FALL2026.md#16","slides/HIST1474_WEEK11_FALL2026.md#8","general"],"date":"1968-06-26"},{"id":"ai5","year":1968,"title":"Institutional Act No. 5 (AI-5)","detail":"Issued on 13 December 1968 under Costa e Silva, it put Congress in recess, let the president rule by decree, suspended habeas corpus for political crimes and expanded censorship.","era":"lead_years","democracy_angle":"The decisive break: it ended what remained of legal opposition and opened the anos de chumbo of torture and disappearance.","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#8","slides/HIST1474_WEEK10pt2_FALL2026.md#12","readings/w11_nascimento_myth_racial_democracy.txt p.445","general"],"date":"1968-12-13"},{"id":"apesar_de_voce_1970","year":1970,"title":"Chico Buarque, 'Apesar de voc\u00ea'","detail":"A samba addressed to an unnamed 'you' who 'gives the orders' and 'invented sin' but forgot forgiveness, with the refrain 'in spite of you, tomorrow will be another day.' It slipped past censors before being banned.","era":"lead_years","democracy_angle":"Coded dissent: art gave a generation a shared language of hope and protest when open politics was banned.","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#1","slides/HIST1474_WEEK11_FALL2026.md#1","slides/HIST1474_WEEK11_FALL2026.md#10","slides/HIST1474_WEEK11_FALL2026.md#11","general"]},{"id":"rubens_paiva_disappearance","year":1971,"title":"Disappearance of Rubens Paiva","detail":"In January 1971 the military took former federal deputy Rubens Paiva from his Rio home; he was killed in custody and 'disappeared.' His wife Eunice and a daughter were also detained.","era":"lead_years","democracy_angle":"Shows state terror reaching a well-known middle-class family and the regime's denial of its own crimes.","importance":1,"sources":["readings/w11_film_ainda_estou_aqui.md","activities/Hist1475_Activity5_F26.md"]},{"id":"say_no_to_inflation","year":1973,"title":"'Say No to Inflation' campaign","detail":"The regime's ads told housewives to 'Be a woman, bargain,' using charm to push prices down, while the official 1973 inflation figure (12.6 percent) was later shown to be manipulated (unions calculated 22.5 percent).","era":"lead_years","democracy_angle":"Blamed consumers and retailers for inflation instead of policy, and the falsified numbers later destroyed trust in the regime.","importance":2,"sources":["readings/w11_teixeira_living_with_inflation.txt p.153","readings/w11_teixeira_living_with_inflation.txt p.163","readings/w11_teixeira_living_with_inflation.txt p.168","readings/w11_lula_may_day_speech.txt p.489"]},{"id":"cost_of_living_movement","year":1973,"title":"Cost of Living Movement (Movimento do Custo de Vida)","detail":"Founded in 1973 by mothers' clubs on S\u00e3o Paulo's periphery, it petitioned for price freezes and wage increases; its 1978 petition gathered over one million signatures, and over 50,000 protested at S\u00e3o Paulo Cathedral in August 1978.","era":"lead_years","democracy_angle":"Turned daily hardship into pro-democracy protest and a broad idea of economic citizenship (housing, schooling, health, rest).","importance":2,"sources":["readings/w11_teixeira_living_with_inflation.txt p.165","readings/w11_teixeira_living_with_inflation.txt p.166","readings/w11_teixeira_living_with_inflation.txt p.168","slides/HIST1474_WEEK10pt2_FALL2026.md#26"]},{"id":"oil_shock_1973","year":1973,"title":"First OPEC oil shock","detail":"The 1973 oil price shock began the unraveling of the miracle: inflation rose to 35 percent in 1974 and 80 percent by 1979, and debt mounted (a second oil shock followed in 1979).","era":"lead_years","democracy_angle":"Economic failure undercut the regime's main claim to legitimacy, prosperity in exchange for liberty.","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#27","slides/Hist1475_Lecture13_F26.md#2","readings/w11_teixeira_living_with_inflation.txt p.161"]},{"id":"elections_1974","year":1974,"title":"1974 congressional elections","detail":"In Geisel's controlled opening (distens\u00e3o), the opposition MDB won far more seats than the regime expected.","era":"abertura","democracy_angle":"Even limited elections let voters register protest, showing the regime had overestimated its support.","importance":2,"sources":["readings/w11_teixeira_living_with_inflation.txt p.166","slides/HIST1474_WEEK10pt2_FALL2026.md#24"]},{"id":"calice_1978","year":1978,"title":"Chico Buarque, 'C\u00e1lice'","detail":"'C\u00e1lice' (chalice) sounds like 'cala-se' (shut up). Lines like 'Father, move this chalice away from me... of red wine of blood' denounce censorship and violence. Written with Gilberto Gil in 1973 and blocked by censors, it was released in 1978.","era":"abertura","democracy_angle":"Wordplay turned silence itself into protest and showed censorship weakening as abertura advanced.","importance":1,"sources":["slides/HIST1474_WEEK11_FALL2026.md#12","slides/HIST1474_WEEK11_FALL2026.md#13","general"]},{"id":"abc_strikes","year":1979,"title":"ABC metalworkers' strikes (1978-80)","detail":"In 1978 metalworkers around S\u00e3o Paulo struck illegally for a 34.1 percent raise after learning inflation figures had been doctored; led by Lula, the strikes of 1979-80 spread nationally despite union interventions.","era":"abertura","democracy_angle":"Workers broke the regime's labor controls and became a mass force for democracy, leading to the Workers' Party.","importance":1,"sources":["slides/HIST1474_WEEK11_FALL2026.md#26","slides/Hist1475_Lecture13_F26.md#7","readings/w11_lula_may_day_speech.txt p.489","readings/w11_lula_may_day_speech.txt p.490","readings/w11_lula_may_day_speech.txt p.491"]},{"id":"amnesty_1979","year":1979,"title":"Amnesty Law","detail":"The 1979 amnesty allowed political exiles such as Leonel Brizola to return; it also shielded agents of the state who had committed abuses.","era":"abertura","democracy_angle":"A first step back toward pluralism, but its protection of torturers limited later accountability (one reason Eunice Paiva's fight took decades).","importance":1,"sources":["readings/w12_mccann_pavao_pavaozinho.txt p.192","readings/w12_mccann_pavao_pavaozinho.txt p.193","general"]},{"id":"pt_founded","year":1980,"title":"Founding of the Workers' Party (PT)","detail":"After the regime abolished the two-party system in 1979, Lula and strike leaders founded the Partido dos Trabalhadores, which later elected Lula and Dilma Rousseff president.","era":"abertura","democracy_angle":"Created a party rooted in grassroots labor and social movements rather than state patronage.","importance":2,"sources":["readings/w11_lula_may_day_speech.txt p.489","general"]},{"id":"elections_1982","year":1982,"title":"Open governor elections of 1982","detail":"Open, multiparty governor elections in every state, which McCann calls the first open slate of candidates since 1960 (some states had also voted in 1965, before AI-2). Leonel Brizola won Rio de Janeiro with strong favela support, despite TV Globo's attempt to publish false returns.","era":"abertura","democracy_angle":"Restored meaningful voting at the state level and gave the poor a way to demand recognition of their citizenship.","importance":2,"sources":["readings/w12_mccann_pavao_pavaozinho.txt p.193","readings/w12_mccann_pavao_pavaozinho.txt p.194","general"]},{"id":"debt_default_1983","year":1983,"title":"Debt crisis and default","detail":"Rising global interest rates after 1979 made Brazil's foreign debt (US$86 billion in 1982, the largest of any developing country) unpayable; Brazil defaulted in 1983 and turned to the IMF. Inflation passed 200 percent.","era":"abertura","democracy_angle":"The 'lost decade' turned even the conservative middle class against the regime.","importance":1,"sources":["slides/Hist1475_Lecture13_F26.md#2","slides/Hist1475_Lecture13_F26.md#5","readings/w11_teixeira_living_with_inflation.txt p.170","readings/w12_mccann_pavao_pavaozinho.txt p.211"]},{"id":"pavao_mudslide","year":1983,"title":"Pav\u00e3o-Pav\u00e3ozinho mudslide","detail":"On 24 December 1983 a collapsing water tank and mudslide killed 19 residents of this favela between Copacabana and Ipanema, prompting Governor Brizola's showcase upgrading project.","era":"abertura","democracy_angle":"Became a test of whether the new democracy would treat favela residents as rights-bearing citizens rather than remove them.","importance":2,"sources":["readings/w12_mccann_pavao_pavaozinho.txt p.191","readings/w12_mccann_pavao_pavaozinho.txt p.196"],"date":"1983-12-24"},{"id":"diretas_ja","year":1984,"title":"Diretas J\u00e1 (Direct Elections Now)","detail":"From June 1983, mass rallies demanded a direct presidential vote, culminating in April 1984 rallies of over one million people each in Rio and S\u00e3o Paulo. Congress did not pass the amendment, and the 1985 choice stayed with an electoral college.","era":"abertura","democracy_angle":"Failed in its immediate goal but showed the depth of popular demand and made the transition open and participatory.","importance":1,"sources":["slides/Hist1475_Lecture13_F26.md#8","readings/w12_mccann_pavao_pavaozinho.txt p.211","readings/w12_mccann_pavao_pavaozinho.txt p.212","readings/w11_teixeira_living_with_inflation.txt p.169"]},{"id":"tancredo_sarney_1985","year":1985,"title":"Tancredo Neves elected; Sarney takes office","detail":"In January 1985 the electoral college chose opposition leader Tancredo Neves (PMDB), the first civilian president-elect since 1960. He fell ill and died in April 1985, so his running mate Jos\u00e9 Sarney, a longtime regime ally, took office.","era":"new_republic","democracy_angle":"Civilian rule returned through an indirect, negotiated deal that left a former regime politician in charge.","importance":1,"sources":["slides/Hist1475_Lecture13_F26.md#9","readings/w12_mccann_pavao_pavaozinho.txt p.212","readings/w12_mccann_pavao_pavaozinho.txt p.213","readings/w11_teixeira_living_with_inflation.txt p.171"]},{"id":"health_conference_1986","year":1986,"title":"8th National Health Conference","detail":"Over 4,000 doctors, public health workers and activists approved the first blueprint for a free, universal health system (SUS) and defined health broadly (food, housing, income, land, environment).","era":"new_republic","democracy_angle":"Democracy built from below: civil society wrote social rights before the constitution adopted them.","importance":2,"sources":["readings/w12_teixeira_health_care_human_right.txt"]},{"id":"plano_cruzado","year":1986,"title":"Plano Cruzado","detail":"On 28 February 1986 Sarney froze prices, raised wages and replaced the cruzeiro with the cruzado ('We are declaring war on inflation'). Monthly inflation fell from 17.79 percent to 0.32 percent by May, then shortages and black markets returned.","era":"new_republic","democracy_angle":"Enlisted citizens as price monitors in a democratic spirit, but its failure eroded trust in the new democracy.","importance":1,"sources":["slides/Hist1475_Lecture13_F26.md#14","slides/Hist1475_Lecture13_F26.md#15","slides/Hist1475_Lecture13_F26.md#17","slides/Hist1475_Lecture13_F26.md#18","readings/w11_teixeira_living_with_inflation.txt p.171","readings/w11_teixeira_living_with_inflation.txt p.172","readings/w11_teixeira_living_with_inflation.txt p.174"],"date":"1986-02-28"},{"id":"constitution_1988","year":1988,"title":"1988 'Citizen Constitution'","detail":"Drafted by a 559-member National Constituent Assembly (convened 1987, only 26 women) amid mass petitions, it was promulgated on 5 October 1988. Its 250 articles guaranteed civil, political, social and Indigenous rights and made health a universal right (SUS).","era":"new_republic","democracy_angle":"Formally dismantled the dictatorship's legal order and ended stratified citizenship, though many promises remained unfulfilled.","importance":1,"sources":["slides/Hist1475_Lecture13_F26.md#10","slides/Hist1475_Lecture13_F26.md#12","slides/Hist1475_Lecture13_F26.md#13","readings/w12_teixeira_health_care_human_right.txt","readings/w11_teixeira_living_with_inflation.txt p.169","readings/w11_teixeira_living_with_inflation.txt p.175","readings/w11_teixeira_living_with_inflation.txt p.176"],"date":"1988-10-05"},{"id":"collor_impeachment","year":1992,"title":"Impeachment of Fernando Collor","detail":"Collor, elected in 1989 in the first direct presidential vote since 1960, was impeached in 1992 after corruption scandals; Itamar Franco replaced him.","era":"new_republic","democracy_angle":"The new institutions removed a president constitutionally, without military intervention.","importance":2,"sources":["slides/Hist1475_Lecture13_F26.md#2","general"]},{"id":"plano_real","year":1994,"title":"Plano Real","detail":"Finance Minister (later president) Fernando Henrique Cardoso's plan used a transitional unit tied to the US dollar (URV) before the new real currency, with austerity, higher taxes and privatization. It finally tamed inflation.","era":"new_republic","democracy_angle":"Price stability strengthened democratic governance, but critics say workers bore much of the cost.","importance":2,"sources":["slides/Hist1475_Lecture13_F26.md#2","slides/Hist1475_Lecture13_F26.md#21","slides/Hist1475_Lecture13_F26.md#23","readings/w11_teixeira_living_with_inflation.txt p.173","readings/w11_teixeira_living_with_inflation.txt p.177"]},{"id":"lula_elected","year":2003,"title":"Lula becomes president","detail":"The former ABC strike leader governed 2003-2010 with anti-poverty programs and growth driven partly by high commodity prices; he returned to office in 2023 after Bolsonaro.","era":"new_republic","democracy_angle":"A worker from the anti-dictatorship labor movement reaching the presidency symbolized democratic inclusion.","importance":2,"sources":["slides/Hist1475_Lecture13_F26.md#2","slides/Hist1475_Lecture13_F26.md#25","slides/Hist1475_Lecture13_F26.md#26","slides/Hist1475_Lecture13_F26.md#37","readings/w12_teixeira_health_care_human_right.txt"]}],"people":[{"id":"vargas","name":"Get\u00falio Vargas","years":"1882-1954","role":"President 1930-45 (dictator 1937-45) and 1951-54","detail":"Ga\u00facho politician who took power in 1930, ruled as dictator under the Estado Novo, built a centralized state, labor code and state industries, then returned by election in 1950. Called 'the Chameleon' for shifting alliances; died by suicide in 1954.","democracy_angle":"Embodies the course's central tension: he expanded social citizenship for urban workers while denying political freedom.","importance":1,"sources":["slides/HIST1474_Lecture9_F26.md#3","slides/HIST1474_Lecture9_F26.md#4","slides/HIST1474_Lecture9_F26.md#5","slides/HIST1474_Lecture9_F26.md#14","slides/HIST1474_Lecture9_F26.md#31","readings/w09_vargas_suicide_letter.txt p.380"]},{"id":"oliveira_vianna","name":"Oliveira Vianna","years":"1883-1951","role":"Jurist, sociologist, defender of the Estado Novo","detail":"Leading intellectual of authoritarian corporatism and a legal adviser to the Labor Ministry in the 1930s. He argued that imported liberal institutions did not fit Brazilian reality and that a strong central state had to organize the nation.","democracy_angle":"Provided an intellectual justification for trading liberal democracy for order and state-led social organization.","importance":2,"sources":["course_pack:w09_vianna_why_estado_novo","general"]},{"id":"loewenstein","name":"Karl Loewenstein","years":"1891-1973","role":"German-American political scientist, wrote Brazil Under Vargas","detail":"\u00c9migr\u00e9 scholar whose book Brazil Under Vargas (1942) observed: 'There is no conclusive evidence that authoritarian governments are better promotors of progress... they are more capable of advertising what they have accomplished.'","democracy_angle":"A contemporary outsider's skepticism of the claim that dictatorship delivers development.","importance":3,"sources":["slides/HIST1474_Lecture9_F26.md#20","general"]},{"id":"gudin_simonsen","name":"Eug\u00eanio Gudin vs. Roberto Simonsen","years":"Gudin 1886-1986; Simonsen 1889-1948","role":"Rival economists: liberalism vs. planning","detail":"In the 1940s planning debate, Gudin argued there is 'no third system' between free competition and socialism, while industrialist Simonsen called for state planning of the economy to overcome Brazil's lack of fuel, transport and basic industry.","democracy_angle":"Their debate framed whether development required giving the state, rather than markets or voters, the leading role.","importance":3,"sources":["slides/HIST1474_WEEK10_FALL2026.md#7","slides/HIST1474_WEEK10_FALL2026.md#8","general"]},{"id":"kubitschek","name":"Juscelino Kubitschek (JK)","years":"1902-1976","role":"President 1956-1961, 'Fifty Years in Five'","detail":"Former doctor, mayor of Belo Horizonte and governor of Minas Gerais who campaigned across Brazil in 1955, launched the Targets Plan, brought in foreign automakers, built Bras\u00edlia and created SUDENE (1959) under economist Celso Furtado. Critics said he delivered 'fifty years of inflation in five.'","democracy_angle":"Believed development was 'the key prerequisite for democracy' and governed as an elected president who completed his term, rare in this era.","importance":1,"sources":["slides/HIST1474_WEEK10_FALL2026.md#11","slides/HIST1474_WEEK10_FALL2026.md#12","slides/HIST1474_WEEK10_FALL2026.md#13","slides/HIST1474_WEEK10_FALL2026.md#28","readings/w10_wolfe_autos_progress_ch5.txt p.113","readings/w10_wolfe_autos_progress_ch5.txt p.114","readings/w10_wolfe_autos_progress_ch5.txt p.135","readings/w10_wolfe_autos_progress_ch5.txt p.141","readings/w11_teixeira_living_with_inflation.txt p.158","general"]},{"id":"niemeyer_costa","name":"Oscar Niemeyer and L\u00facio Costa","years":"Niemeyer 1907-2012; Costa 1902-1998","role":"Architect and planner of Bras\u00edlia","detail":"Costa drew the Plano Piloto (master plan) and Niemeyer designed its signature modernist buildings, drawing on Le Corbusier.","democracy_angle":"Their design tried to build equality into space (superquadras), but the city's poor majority lived outside the plan.","importance":2,"sources":["slides/HIST1474_WEEK10_FALL2026.md#18","slides/HIST1474_WEEK10_FALL2026.md#19","readings/w10_wolfe_autos_progress_ch5.txt p.135","general"]},{"id":"pele","name":"Pel\u00e9 (Edson Arantes do Nascimento)","years":"1940-2022","role":"Football star, 1958 World Cup hero","detail":"Made his World Cup debut in 1958 and scored in all three knockout games as Brazil won its first of five titles.","democracy_angle":"A Black national hero in a society that claimed racial democracy, a symbol of postwar optimism.","importance":2,"sources":["slides/HIST1474_WEEK10_FALL2026.md#29"]},{"id":"goulart","name":"Jo\u00e3o Goulart (Jango)","years":"1919-1976","role":"President 1961-1964, deposed in coup","detail":"Vargas's prot\u00e9g\u00e9 and former labor minister who became president after Quadros resigned; his push for 'basic reforms' such as land reform, amid near-100-percent inflation, alarmed the military, business and the middle class.","democracy_angle":"His overthrow marks the collapse of the 1946 democracy and the limits of reform under Cold War pressure.","importance":1,"sources":["slides/HIST1474_WEEK10_FALL2026.md#34","slides/HIST1474_WEEK10pt2_FALL2026.md#6","readings/w11_teixeira_living_with_inflation.txt p.158","general"]},{"id":"castelo_branco","name":"Humberto Castelo Branco","years":"1897-1967","role":"First military president 1964-1967, 'the Legalist'","detail":"Led the regime's first phase, issuing Institutional Acts, purging opponents and installing the two-party system while maintaining a fa\u00e7ade of legality.","democracy_angle":"Symbol of authoritarian legalism: dictatorship through decrees and rewritten rules.","importance":2,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#8","general"]},{"id":"costa_e_silva","name":"Artur da Costa e Silva","years":"1899-1969","role":"Military president 1967-1969, issued AI-5","detail":"Hardliner whose government answered the 1968 protests with Institutional Act No. 5 in December 1968.","democracy_angle":"AI-5 under his rule ended remaining legal opposition.","importance":2,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#8","general"]},{"id":"medici","name":"Em\u00edlio Garrastazu M\u00e9dici","years":"1905-1985","role":"Military president 1969-1974","detail":"Presided over both the economic miracle and the most violent repression, using the 1970 World Cup win and growth for propaganda.","democracy_angle":"Shows how growth was used to legitimize the harshest years of dictatorship.","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#8","readings/w11_teixeira_living_with_inflation.txt p.160","readings/w11_teixeira_living_with_inflation.txt p.161","general"]},{"id":"geisel","name":"Ernesto Geisel","years":"1907-1996","role":"Military president 1974-1979, began distens\u00e3o","detail":"A 'Castelista' legalist who began a slow, on-and-off political liberalization while facing economic turmoil after the oil shock.","democracy_angle":"Opening came from above and was meant to be controlled by the military.","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#24","slides/HIST1474_WEEK11_FALL2026.md#27","slides/Hist1475_Lecture13_F26.md#3","readings/w11_teixeira_living_with_inflation.txt p.166"]},{"id":"joao_figueiredo","name":"Jo\u00e3o Figueiredo","years":"1918-1999","role":"Last military president 1979-1985","detail":"Oversaw the amnesty (1979), the return of multiparty politics and the managed transition amid debt crisis, inflation and strikes.","democracy_angle":"Managed transition: the regime negotiated its own exit on terms that protected it.","importance":2,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#24","slides/HIST1474_WEEK11_FALL2026.md#27","slides/Hist1475_Lecture13_F26.md#3","general"]},{"id":"delfim_netto","name":"Ant\u00f4nio Delfim Netto","years":"1928-2024","role":"Finance minister 1967-1974, 'miracle' architect","detail":"Credited with the economic miracle; inflation figures were manipulated under him in 1973, which later fueled protests ('could not count beyond twelve').","democracy_angle":"Technocratic rule without accountability: when the falsified numbers came out, trust in the regime collapsed.","importance":2,"sources":["readings/w11_teixeira_living_with_inflation.txt p.160","readings/w11_teixeira_living_with_inflation.txt p.161","readings/w11_teixeira_living_with_inflation.txt p.168","readings/w11_lula_may_day_speech.txt p.489","general"]},{"id":"roberto_campos","name":"Roberto Campos","years":"1917-2001","role":"Planning minister 1964-1967 (PAEG)","detail":"Designed the PAEG stabilization program and later argued that 'too frequent electoral consultations' were incompatible with anti-inflation policy.","democracy_angle":"Openly argued that democracy endangered economic stability, a core justification for military rule.","importance":2,"sources":["readings/w11_teixeira_living_with_inflation.txt p.159","readings/w11_teixeira_living_with_inflation.txt p.161","readings/w11_teixeira_living_with_inflation.txt p.167","general"]},{"id":"chico_buarque","name":"Chico Buarque","years":"b. 1944","role":"Singer-songwriter of protest songs","detail":"Composer of 'Apesar de voc\u00ea' (1970) and 'C\u00e1lice' (1978), who used double meanings to evade censorship; he spent time in exile in Italy. Later won the Cam\u00f5es Prize.","democracy_angle":"Art as everyday dissent that kept a democratic imagination alive.","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#1","slides/HIST1474_WEEK11_FALL2026.md#10","slides/HIST1474_WEEK11_FALL2026.md#11","slides/HIST1474_WEEK11_FALL2026.md#12","slides/HIST1474_WEEK11_FALL2026.md#13","general"]},{"id":"caetano_veloso","name":"Caetano Veloso","years":"b. 1942","role":"Tropic\u00e1lia musician","detail":"Leader of Tropic\u00e1lia whose 1968 '\u00c9 proibido proibir' ('It is forbidden to forbid') mocked authority; also recorded 'Soy loco por ti, Am\u00e9rica' (1967). Arrested after AI-5 and exiled to London.","democracy_angle":"Countercultural dissent that challenged both the regime and conventional politics.","importance":1,"sources":["slides/HIST1474_WEEK11_FALL2026.md#9","slides/HIST1474_WEEK11_FALL2026.md#14","general"]},{"id":"nascimento","name":"Abdias do Nascimento","years":"1914-2011","role":"Black activist, artist, later congressman and senator","detail":"Founded the Black Experimental Theatre (1944) and wrote 'The Myth of Racial Democracy' (1968). He was abroad when AI-5 was issued and stayed in exile in the US for 13 years; later served as federal deputy and senator for Rio (1983-1999) with Brizola's PDT.","democracy_angle":"Argued democracy was hollow while racism persisted, broadening dissent beyond the regime itself.","importance":1,"sources":["slides/HIST1474_WEEK11_FALL2026.md#15","readings/w11_nascimento_myth_racial_democracy.txt p.445","readings/w11_nascimento_myth_racial_democracy.txt p.446"]},{"id":"lula","name":"Luiz In\u00e1cio Lula da Silva","years":"b. 1945","role":"Metalworkers' union leader, PT founder, president","detail":"Born in rural Pernambuco in 1945, he led the 1978-80 ABC metalworkers' strikes, helped found the PT, and was president 2003-2010 and again from 2023. Lecture 1 notes described the 2026 race as a close contest between Lula (seeking a fourth term) and Fl\u00e1vio Bolsonaro.","democracy_angle":"Personifies democratization from below, from illegal strikes to the presidency.","importance":1,"sources":["slides/HIST1474_WEEK11_FALL2026.md#26","slides/Hist1475_Lecture13_F26.md#2","slides/Hist1475_Lecture13_F26.md#7","slides/Hist1475_Lecture13_F26.md#25","slides/Hist1475_Lecture13_F26.md#37","readings/w11_lula_may_day_speech.txt p.489","readings/w10_wolfe_autos_progress_ch5.txt p.132","general"]},{"id":"rubens_paiva","name":"Rubens Paiva","years":"1929-1971","role":"Former federal deputy, disappeared by the regime","detail":"Engineer and congressman whose mandate was revoked after the 1964 coup; taken from his home in January 1971 and killed in custody.","democracy_angle":"His case symbolizes the regime's disappearances and the long fight for truth.","importance":1,"sources":["readings/w11_film_ainda_estou_aqui.md","general"]},{"id":"eunice_paiva","name":"Eunice Paiva","years":"1929-2018","role":"Protagonist of Ainda Estou Aqui","detail":"After her husband's disappearance and her own detention, she raised five children, became a lawyer and Indigenous rights advocate, and fought until the state issued his death certificate in 1996.","democracy_angle":"Her persistence shows dissent as long-term legal and moral resistance, effective over decades rather than in the moment.","importance":1,"sources":["readings/w11_film_ainda_estou_aqui.md","activities/Hist1475_Activity5_F26.md","general"]},{"id":"brizola","name":"Leonel Brizola","years":"1922-2004","role":"Populist-socialist governor of Rio Grande do Sul and Rio","detail":"Governor of Rio Grande do Sul (1959-63), exiled after 1964, returned under the 1979 amnesty, founded the PDT and won Rio's governorship in 1982 with vice-governor Darcy Ribeiro, promising 'brown socialism' for favela residents.","democracy_angle":"Shifted Vargas-style labor populism toward recognizing the citizenship of the informal, mostly non-white urban poor.","importance":1,"sources":["readings/w12_mccann_pavao_pavaozinho.txt p.191","readings/w12_mccann_pavao_pavaozinho.txt p.192","readings/w12_mccann_pavao_pavaozinho.txt p.193","readings/w12_mccann_pavao_pavaozinho.txt p.195"]},{"id":"tancredo_neves","name":"Tancredo Neves","years":"1910-1985","role":"President-elect 1985, died before taking office","detail":"Veteran of the Vargas machine and moderate opposition leader (PMDB), chosen by the electoral college in January 1985; he died in April 1985.","democracy_angle":"His negotiated, indirect victory ended military rule but left the transition to a regime ally.","importance":1,"sources":["slides/Hist1475_Lecture13_F26.md#9","readings/w12_mccann_pavao_pavaozinho.txt p.212"]},{"id":"sarney","name":"Jos\u00e9 Sarney","years":"b. 1930","role":"First civilian president after the dictatorship, 1985-1990","detail":"Longtime leader of the pro-regime party who became Tancredo's running mate as a compromise; oversaw the 1988 Constitution and the failed Plano Cruzado and later plans amid hyperinflation.","democracy_angle":"Continuity in the transition: a military ally led the new democracy.","importance":1,"sources":["slides/Hist1475_Lecture13_F26.md#9","slides/Hist1475_Lecture13_F26.md#15","slides/Hist1475_Lecture13_F26.md#19","readings/w12_mccann_pavao_pavaozinho.txt p.212","readings/w11_teixeira_living_with_inflation.txt p.171"]},{"id":"ulysses_guimaraes","name":"Ulysses Guimar\u00e3es","years":"1916-1992","role":"PMDB leader, president of the Constituent Assembly","detail":"Presided over the National Constituent Assembly and, at promulgation in October 1988, called it the 'Citizen Constitution' and declared hatred and disgust for dictatorship.","democracy_angle":"Voice of the democratic break with the dictatorship.","importance":2,"sources":["slides/Hist1475_Lecture13_F26.md#12","readings/w12_teixeira_health_care_human_right.txt"]},{"id":"fhc","name":"Fernando Henrique Cardoso (FHC)","years":"b. 1931","role":"President 1995-2002; Plano Real","detail":"Sociologist and dependency theorist (Dependency and Development in Latin America) who, as finance minister and then president, oversaw the Plano Real and privatization; in 1995 he announced the 'end of the Vargas era.'","democracy_angle":"Shifted Brazil from state-led development to market reforms within democracy.","importance":2,"sources":["slides/Hist1475_Lecture13_F26.md#23","slides/Hist1475_Lecture13_F26.md#24","slides/HIST1474_WEEK10_FALL2026.md#31","slides/HIST1474_Lecture9_F26.md#32","general"]},{"id":"collor","name":"Fernando Collor de Mello","years":"b. 1949","role":"President 1990-1992, impeached","detail":"First directly elected president since 1960 (1989). His 1990 plan froze 80 percent of personal bank accounts for 18 months (the confisco), and he was impeached in 1992.","democracy_angle":"Tested the new democracy, which removed him through constitutional means.","importance":2,"sources":["slides/Hist1475_Lecture13_F26.md#2","slides/Hist1475_Lecture13_F26.md#14","readings/w11_teixeira_living_with_inflation.txt p.177","general"]},{"id":"bolsonaro","name":"Jair Bolsonaro","years":"b. 1955","role":"President 2019-2022, far-right populist","detail":"Former army captain who praised the dictatorship and rode a global wave of right-wing populis
