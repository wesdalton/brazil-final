s for democracy: stratified citizenship that SUS replaced in 1988.","tags":["week9","term"],"ref":"iaps"},{"id":"fc_volta","front":"Volta Redonda","back":"State-owned steel mill (CSN, created 1941) celebrated as national self-sufficiency. Matters for democracy: state-led development under dictatorship.","tags":["week9","event"],"ref":"volta_redonda"},{"id":"fc_isi","front":"ISI","back":"Import-Substitution Industrialization: subsidies and tariffs to replace imports with domestic industry (Prebisch, Furtado, CEPAL). Matters for democracy: huge state economic role shaping who benefited from growth.","tags":["week10","term"],"ref":"isi"},{"id":"fc_fifty","front":"Fifty Years in Five","back":"JK's slogan for his Plano de Metas (30 targets plus Bras\u00edlia). Matters for democracy: promised modernization would stabilize democracy; critics saw 'fifty years of inflation.'","tags":["week10","term"],"ref":"fifty_years_in_five"},{"id":"fc_superquadra","front":"Superquadra","back":"Bras\u00edlia residential blocks with schools, shops and parks; apartments assigned by family size, not income. Matters for democracy: egalitarian design that excluded the city's builders.","tags":["week10","term"],"ref":"superquadra"},{"id":"fc_satellite","front":"Satellite cities","back":"Settlements outside Bras\u00edlia's Plano Piloto where many workers and poor migrants lived. Matters for democracy: exposed the gap between modernist equality and real segregation.","tags":["week10","term"],"ref":"satellite_cities"},{"id":"fc_bureau","front":"Bureaucratic authoritarianism","back":"Rule by the military as an institution with technocrats, neutralizing class conflict and claiming to be apolitical. Matters for democracy: replaced politics with technocracy.","tags":["week11","term"],"ref":"bureaucratic_authoritarianism"},{"id":"fc_legalism","front":"Authoritarian legalism","back":"Curbing rights through 'legal' tools: Institutional Acts, the 1967 Constitution, decree laws. Matters for democracy: a lawful fa\u00e7ade that made dictatorship durable.","tags":["week11","term"],"ref":"authoritarian_legalism"},{"id":"fc_ais","front":"Institutional Acts","back":"Military decrees that curtailed rights, suspended Congress and changed election rules (AI-1 1964, AI-2 1965, AI-5 1968). Matters for democracy: main legal tools of dictatorship.","tags":["week11","term"],"ref":"institutional_acts"},{"id":"fc_chumbo","front":"Anos de chumbo","back":"The 'years of lead,' 1968-74: censorship, torture, disappearances. Matters for democracy: the regime's harshest phase, coinciding with the miracle.","tags":["week11","term"],"ref":"anos_de_chumbo"},{"id":"fc_arena","front":"ARENA and MDB","back":"The only two parties allowed after 1965, mocked as 'yes' and 'yes, sir.' Matters for democracy: controlled opposition that voters turned into real protest.","tags":["week11","term"],"ref":"arena_mdb"},{"id":"fc_tropicalia","front":"Tropic\u00e1lia","back":"Late-1960s movement of Caetano Veloso and Gilberto Gil mixing Brazilian and global styles. Matters for democracy: cultural dissent punished with arrest and exile.","tags":["week11","term"],"ref":"tropicalia"},{"id":"fc_abertura","front":"Distens\u00e3o / abertura","back":"Slow, gradual, top-down liberalization under Geisel (from 1974) and Figueiredo (from 1979). Matters for democracy: planned from above, accelerated from below.","tags":["week12","term"],"ref":"distensao_abertura"},{"id":"fc_fiscais","front":"Fiscais do Sarney","back":"Citizens, mostly housewives, reporting violations of the 1986 price freeze. Matters for democracy: civic participation in economic policy, undermined when the plan failed.","tags":["week12","term"],"ref":"fiscais_do_sarney"},{"id":"fc_sus","front":"SUS","back":"Free, universal health system created by the 1988 Constitution (Article 196). Matters for democracy: universal social citizenship replacing Vargas-era stratified rights.","tags":["week12","term"],"ref":"sus"},{"id":"fc_brown","front":"Socialismo moreno","back":"Brizola and Darcy Ribeiro's 'brown socialism': schools (CIEPs), housing, services and civil rights for poor Brazilians of color. Matters for democracy: citizenship for the informal poor.","tags":["week12","term"],"ref":"socialismo_moreno"},{"id":"fc_racialdem","front":"Myth of racial democracy","back":"Belief that Brazil had no racial discrimination; Nascimento said it kept Black Brazilians 'tricked and docile.' Matters for democracy: political democracy without racial equality is incomplete.","tags":["week11","term"],"ref":"racial_democracy"},{"id":"fc_maracanazo","front":"Maracanazo","back":"16 July 1950: Brazil loses the World Cup final 2-1 to Uruguay at Maracan\u00e3. Matters for democracy: mass public culture and press blaming players and the mayor.","tags":["week10","event"],"ref":"maracanazo"},{"id":"fc_march","front":"March of the 100,000","back":"June 1968 protest in Rio by students and allies against state violence. Matters for democracy: peak of legal protest, answered by AI-5.","tags":["week11","event"],"ref":"march_100000"},{"id":"fc_figueiredo_rep","front":"Figueiredo Report (1967)","back":"Government report documenting massacres, enslaved labor and land grabs against Indigenous peoples. Matters for democracy: state atrocities against people denied full citizenship.","tags":["week11","event"],"ref":"figueiredo_report"},{"id":"fc_apesar","front":"'Apesar de voc\u00ea' (1970)","back":"Chico Buarque samba: 'in spite of you, tomorrow will be another day.' Matters for democracy: coded protest that gave a generation hope.","tags":["week11","event"],"ref":"apesar_de_voce_1970"},{"id":"fc_calice","front":"'C\u00e1lice' (1978)","back":"Chico Buarque song: 'c\u00e1lice' (chalice) sounds like 'cala-se' (shut up). Matters for democracy: turned censorship and silence into protest.","tags":["week11","event"],"ref":"calice_1978"},{"id":"fc_paiva","front":"Rubens Paiva (1971)","back":"Former deputy taken from his home in January 1971 and killed in custody. Matters for democracy: emblem of the regime's disappearances.","tags":["week11","event"],"ref":"rubens_paiva_disappearance"},{"id":"fc_saynno","front":"'Say No to Inflation' (1973)","back":"Regime ads telling women 'Be a woman, bargain'; official inflation (12.6 percent) was manipulated. Matters for democracy: blamed citizens and lied with statistics.","tags":["week11","event"],"ref":"say_no_to_inflation"},{"id":"fc_custo","front":"Cost of Living Movement","back":"Founded 1973 by S\u00e3o Paulo mothers' clubs; 1978 petition of over one million signatures. Matters for democracy: daily hardship became pro-democracy protest.","tags":["week11","event"],"ref":"cost_of_living_movement"},{"id":"fc_abc","front":"ABC strikes (1978-80)","back":"Metalworkers near S\u00e3o Paulo strike illegally over doctored inflation figures, led by Lula. Matters for democracy: workers break regime labor controls and build the PT.","tags":["week11","event"],"ref":"abc_strikes"},{"id":"fc_pavao","front":"Pav\u00e3o-Pav\u00e3ozinho (1983)","back":"Christmas Eve mudslide kills 19 in a Rio favela; Brizola launches a showcase upgrading project. Matters for democracy: favela residents treated as rights-bearing citizens.","tags":["week12","event"],"ref":"pavao_mudslide"},{"id":"fc_healthconf","front":"8th National Health Conference (1986)","back":"Over 4,000 health workers draft the SUS blueprint and a broad definition of health. Matters for democracy: social rights written from below.","tags":["week12","event"],"ref":"health_conference_1986"},{"id":"fc_real","front":"Plano Real (1994)","back":"FHC's stabilization: URV unit tied to the dollar, austerity, privatization; finally ends hyperinflation. Matters for democracy: stability within democracy, with costs for workers.","tags":["week12","event"],"ref":"plano_real"},{"id":"fc_r_letter","front":"Vargas, Suicide Letter (1954)","back":"Vargas casts himself as the people's martyr against foreign and elite enemies: 'I leave life to enter history.' Matters for democracy: shows populism's emotional bond and coup pressure on civilian rule.","tags":["week9","reading"],"ref":"w09_vargas_suicide_letter"},{"id":"fc_r_worldcup","front":"'A City's Crushing Defeat' (1950)","back":"Rio newspapers on the Maracanazo: euphoria, then 'daybreak on Ash Wednesday' and blame. Matters for democracy: mass public culture of the democratic era.","tags":["week10","reading"],"ref":"w10_rio_reader_world_cup_defeat"},{"id":"fc_r_wolfe","front":"Wolfe, Autos and Progress ch. 5","back":"JK used autos, roads and Bras\u00edlia to democratize through development rather than immediate inclusion. Matters for democracy: 'In some significant ways, the experiment succeeded. In many ways, it failed.'","tags":["week10","reading"],"ref":"w10_wolfe_autos_progress_ch5"},{"id":"fc_r_nascimento","front":"Nascimento, 'Myth of Racial Democracy' (1968)","back":"Abolition was 'a fa\u00e7ade'; the myth keeps Black Brazilians docile; calls for pressure groups. Matters for democracy: democracy requires racial equality.","tags":["week11","reading"],"ref":"w11_nascimento_myth_racial_democracy"},{"id":"fc_r_lula","front":"Lula, May Day Speech (1979)","back":"Rejects blaming wages for inflation; 'a union is not a building'; stop the machines. Matters for democracy: workers take rights rather than receive them.","tags":["week11","reading"],"ref":"w11_lula_may_day_speech"},{"id":"fc_r_inflation","front":"Teixeira, 'Living with Inflation'","back":"The regime lived with inflation through indexation and wage repression; it became its greatest liability. Matters for democracy: prices became a question of government accountability.","tags":["week11","reading"],"ref":"w11_teixeira_living_with_inflation"},{"id":"fc_r_film","front":"Ainda Estou Aqui (2024)","back":"Walter Salles film: Eunice Paiva's family after Rubens Paiva's 1971 disappearance; Oscar 2025. Matters for democracy: everyday dissent and the long fight for truth.","tags":["week11","reading"],"ref":"w11_film_ainda_estou_aqui"},{"id":"fc_r_mccann","front":"McCann, 'Pav\u00e3o-Pav\u00e3ozinho' (2025)","back":"Brizola's 1980s favela upgrading: transformative but never complete. Matters for democracy: declared favela residents rights-bearing citizens.","tags":["week12","reading"],"ref":"w12_mccann_pavao_pavaozinho"},{"id":"fc_r_health","front":"Teixeira, 'Health Care as a Human Right'","back":"The 1988 Constitution made health universal through civil-society pressure: 'the generative power of crises.' Matters for democracy: ended stratified citizenship.","tags":["week12","reading"],"ref":"w12_teixeira_health_care_human_right"}]};

<script>
/* Brazil 1930-1988 study site. Vanilla JS, no dependencies. Data comes from content.js (window.CONTENT). */
(function () {
  'use strict';

  // ---------- utilities ----------
  const $ = (s, r) => (r || document).querySelector(s);

  const esc = v => str(v).replace(/[&<>"']/g, c => ESC[c]);

  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const sample = (a, n) => shuffle(a).slice(0, n);
  const pad = n => String(n).padStart(2, '0');
  const dateStr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => dateStr(new Date());
  const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dateStr(d); };
  const truncate = (s, n) => { s = str(s); return s.length > n ? s.slice(0, n - 1).trimEnd() + '\u2026' : s; };
  const fold = s => str(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const num = v => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : null; };
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

  const EXAM = new Date(2026, 10, 19);
  const EXAM_LABEL = 'Thu Nov 19, 2026';
  // ---------- data ----------
  const RAW = window.CONTENT && typeof window.CONTENT === 'object' ? window.CONTENT : {};
  const DATA_SOURCE = str(window.CONTENT_SOURCE);
  const TYPE_OF_LIST = { eras: 'era', events: 'event', people: 'person', terms: 'term', readings: 'reading', themes: 'theme', prompts: 'prompt', flashcards: 'flashcard' };
  const C = { meta: RAW.meta && typeof RAW.meta === 'object' ? RAW.meta : {} };
  ['eras', 'events', 'people', 'terms', 'readings', 'themes', 'prompts', 'connections', 'flashcards'].forEach(k => {
    C[k] = arr(RAW[k]).filter(x => x && typeof x === 'object');
  });
  const INDEX = {};

    C[k].forEach((it, i) => {
      it.id = str(it.id) || TYPE_OF_LIST[k] + '_' + i;

    r.quotes = arr(r.quotes).filter(q => q && q.text);

  });

    p.theses = arr(p.theses).filter(t => t && t.text);

  C.connections = C.connections.filter(c => c.from || c.to);

  const imp = it => { const i = Number(it && it.importance); return i === 1 || i === 2 || i === 3 ? i : 2; };

  const REGIMES = ['oligarchic', 'democracy', 'populist_democracy', 'dictatorship', 'transition'];

  const regimeKey = r => (REGIMES.includes(r) ? r : 'other');

  function nameOf(id) {
    const r = INDEX[id];
    if (!r) return str(id);
    const it = r.item;
    const n = { era: it.label, event: it.title, person: it.name, term: it.term, reading: it.short || it.title, theme: it.title, prompt: it.prompt, flashcard: it.front }[r.type];
    return str(n) || str(id);
  }
  const CARDS_BY_REF = {};
  C.flashcards.forEach(f => { if (f.ref) (CARDS_BY_REF[f.ref] = CARDS_BY_REF[f.ref] || []).push(f.id); });
  // ---------- state ----------
  const KEY = 'hist1475_study_v1';
  function defaultState() {
    return { xp: 0, streak: { count: 0, last: null }, cards: {}, items: {}, best: {}, essays: {}, plan: {}, theme: null, fc: { week: 'all', tag: 'all', imp: 'all' }, tlZoom: 22 };
  }
  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || '{}');
      const d = defaultState();
      const out = Object.assign(d, s && typeof s === 'object' ? s : {});
      ['streak', 'cards', 'items', 'best', 'essays', 'plan', 'fc'].forEach(k => { if (!out[k] || typeof out[k] !== 'object') out[k] = defaultState()[k]; });
      return out;
    } catch (e) { return defaultState(); }
  }
  let S = loadState();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }

  function touchStreak() {
    const t = today();
    if (S.streak.last === t) return;
    S.streak.count = S.streak.last === yesterday() ? (S.streak.count || 0) + 1 : 1;
    S.streak.last = t;
  }
  function currentStreak() {
    return S.streak.last === today() || S.streak.last === yesterday() ? S.streak.count || 0 : 0;
  }
  function addXP(n, anchor) {
    S.xp = (S.xp || 0) + n;
    touchStreak();
    save();
    updateHud(true);
    if (n > 0) floatXP(n, anchor);
  }
  function recordItem(id, ok) {
    if (!id) return;
    const it = S.items[id] || { s: 0, c: 0, w: 0 };
    if (ok) { it.c++; it.s = Math.min(5, it.s + 1); } else { it.w++; it.s = Math.max(0, it.s - 2); }
    S.items[id] = it;
    save();
  }
  let planHook = null;
  function markPlan(key) {
    const t = today();
    S.plan[t] = S.plan[t] || {};
    S.plan[t][key] = true;
    // keep only the last two weeks of plan history
    Object.keys(S.plan).sort().slice(0, -14).forEach(k => delete S.plan[k]);
    save();
    if (planHook) planHook(key);
  }
  function strength(id) {
    let s = (S.items[id] && S.items[id].s) || 0;
    arr(CARDS_BY_REF[id]).forEach(cid => { const c = S.cards[cid]; if (c) s = Math.max(s, c.box || 0); });
    return Math.min(5, s);
  }
  function masteryOf(list) {
    if (!list.length) return 0;
    return list.reduce((a, it) => a + strength(it.id), 0) / (list.length * 5);
  }
  function overallMastery() {
    const units = [...C.events, ...C.people, ...C.terms, ...C.readings];
    const loose = C.flashcards.filter(f => !f.ref || !INDEX[f.ref]);
    const total = units.length + loose.length;
    if (!total) return 0;
    const sum = units.reduce((a, it) => a + strength(it.id), 0) + loose.reduce((a, f) => a + Math.min(5, (S.cards[f.id] && S.cards[f.id].box) || 0), 0);
    return sum / (total * 5);
  }
  // ---------- icons ----------
  const svg = (p, s) => `<svg width="${s || 20}" height="${s || 20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const ICON = {
    flame: svg('<path d="M12 2c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5.5 1-8.5z"/>', 16),
    star: svg('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>', 16),
    cards: svg('<rect x="3" y="7" width="13" height="14" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12"/>'),
    timeline: svg('<path d="M3 12h18"/><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 5v5M12 14v5M18 5v5"/>'),
    order: svg('<path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 5v3M3 18h2.5L3 21h2.5"/>'),
    calendar: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
    quiz: svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5h.01"/>'),
    match: svg('<rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/><path d="M10 7h2a2 2 0 0 1 2 2v5"/>'),
    quote: svg('<path d="M7 7h4v4c0 3-1.5 5-4 6M15 7h4v4c0 3-1.5 5-4 6"/>'),
    book: svg('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>'),
    link: svg('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'),
    pen: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>'),
    print: svg('<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>'),
    sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', 18),
    moon: svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>', 18),
    grip: svg('<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>', 18),
    up: svg('<path d="M6 15l6-6 6 6"/>', 14),
    down: svg('<path d="M6 9l6 6 6-6"/>', 14),
    search: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),
    layers: svg('<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>'),
    shuffle: svg('<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>', 16),

  };
  // ---------- small renderers ----------
  function fmtSource(s) {
    s = str(s).trim();
    let m;
    if (s === 'general') return 'outside class materials';
    if ((m = s.match(/^slides\/(.+?)(?:#(\d+))?$/))) {
      const w = m[1].match(/WEEK[_ -]?(\d+)(pt\s*\d+)?/i), l = m[1].match(/Lecture[_ -]?(\d+)/i);
      const name = w ? 'W' + parseInt(w[1], 10) + (w[2] ? ' ' + w[2].toLowerCase() : '') : l ? 'lecture ' + parseInt(l[1], 10) : m[1].replace(/\.md$/, '');
      return 'slides ' + name + (m[2] ? ' #' + m[2] : '');
    }
    if ((m = s.match(/^readings\/(\S+?)(?:\.(?:txt|md))?(?:\s+p{1,2}\.?\s*(.+))?$/))) return shortAuthor(m[1]) + (m[2] ? ' p.' + m[2] : '');
    if ((m = s.match(/^activities\/(.+?)(?:\.md)?$/))) {
      const a = m[1].match(/Activity[_ -]?(\d+)/i);
      return a ? 'class activity ' + a[1] : 'activity: ' + m[1].replace(/[_-]+/g, ' ');
    }
    if ((m = s.match(/^course_pack:(.+)$/))) return 'course pack: ' + shortAuthor(m[1].trim());
    return s;
  }
  function shortAuthor(id) {

  // ---------- timeline ----------

  }
  function renderMap(body) {
    const allEvents = C.events.filter(e => e.year !== null && e.year >= Y0 - 1 && e.year <= Y1 + 1);
    if (!allEvents.length && !C.eras.length) { body.innerHTML = emptyHTML('No dated events or eras in the study data yet.'); return; }
    let mustOnly = false, selId = null, evs = [];
    body.innerHTML = `
      <div class="tl-controls">
        <div class="seg"><button type="button" id="zout" aria-label="Zoom out">\u2212</button><button type="button" id="zin" aria-label="Zoom in">+</button></div>
        <label class="small toggle"><input type="checkbox" id="must"> Must-know only</label>
        <span class="grow"></span>
        <div class="legend">${REGIMES.filter(r => C.eras.some(e => regimeKey(e.regime) === r)).map(r => `<span><i style="background:var(--r-${r})"></i>${esc(REGIME_LABEL[r])}</span>`).join('')}</div>
      </div>
      <div class="tl-scroll" id="tl-scroll"><div class="tl-inner" id="tl-inner"></div></div>
      <div class="tl-detail" id="tl-detail"><div class="card flat muted small">Pick an event or an era band to see what happened and why it matters for democracy.</div></div>`;
    const inner = $('#tl-inner', body), scroller = $('#tl-scroll', body), detail = $('#tl-detail', body);
    function draw() {
      const ppy = clamp(S.tlZoom || 22, 8, 64);
      evs = allEvents.filter(e => !mustOnly || imp(e) === 1).sort((a, b) => a.year - b.year || imp(a) - imp(b));
      const padL = 16, x = y => padL + (y - Y0) * ppy;
      const laneEnds = [];
      const placed = evs.map(e => {
        const x0 = x(e.year) - 6;
        const w = Math.min(214, 30 + str(e.title).length * 6.7);
        let lane = laneEnds.findIndex(end => end < x0);
        if (lane < 0) { lane = laneEnds.length; laneEnds.push(0); }
        laneEnds[lane] = x0 + w + 6;
        return { e, lane };
      });
      const top0 = 78, laneH = 30;
      const H = top0 + Math.max(1, laneEnds.length) * laneH + 14;
      const W = x(Y1) + 230;
      let h = '';
      const step = ppy < 14 ? 10 : 5;
      for (let y = 1890; y <= Y1; y += step) h += `<div class="tl-tick ${y % 10 === 0 ? 'major' : ''}" style="left:${x(y)}px">${y % 10 === 0 || ppy >= 30 ? `<span>${y}</span>` : ''}</div>`;
      C.eras.filter(e => e.start !== null && e.end !== null).forEach(e => {
        const a = Math.max(e.start, Y0), b = Math.min(e.end, Y1);

      });
      placed.forEach(({ e, lane }) => {
        h += `<button type="button" class="tl-ev imp${imp(e)} ${selId === e.id ? 'sel' : ''}" data-ev="${esc(e.id)}" style="left:${x(e.year)}px;top:${top0 + lane * laneH}px" title="${esc(e.year)}: ${esc(e.title)}"><span class="dot"></span><span class="lab">${esc(e.title)}</span></button>`;

    function select(id, scroll) {

      if (scroll) {
        const el = $(`[data-ev="${CSS.escape(id)}"]`, inner);

  }

  // ---------- put it in order ----------
  function renderOrder(body) {
    const pool = C.events.filter(e => e.year !== null);
    let items = [], sel = -1, checked = false, dragFrom = -1, round = 0;
    function newRound() {
      const byYear = {};
      shuffle(pool).forEach(e => { if (!byYear[e.year]) byYear[e.year] = e; });
      const cands = Object.values(byYear);
      if (cands.length < 3) { body.innerHTML = emptyHTML('Need at least three events with different years to play.'); items = []; return; }
      items = sample(cands, Math.min(5, cands.length));
      let guard = 0;
      while (items.every((e, i) => i === 0 || items[i - 1].year < e.year) && guard++ < 20) items = shuffle(items);
      sel = -1; checked = false; round++;
      draw();
    }
    function draw() {
      const sorted = [...items].sort((a, b) => a.year - b.year);
      const right = items.filter((e, i) => sorted[i].id === e.id).length;
      body.innerHTML = `<div class="game"><div class="play">
        <div class="play-q"><div class="game-hud"><span>Round ${round}</span><span class="grow"></span><span class="small">Earliest at the top</span></div>
        <ol class="order-list" id="olist">${items.map((e, i) => {
          const ok = checked && sorted[i].id === e.id;
          return `<li draggable="${checked ? 'false' : 'true'}" data-i="${i}" class="${sel === i ? 'sel' : ''} ${checked ? (ok ? 'ok' : 'no') : ''}">
            <span class="pos">${i + 1}</span>${checked ? '' : `<span class="grip">${ICON.grip}</span>`}
            <span class="tt">${esc(checked ? e.title : maskYears(e.title))}</span>
            ${checked ? `<span class="yr">${e.year}</span>` : `<span class="mv"><button type="button" data-mv="-1" data-i="${i}" aria-label="Move up">${ICON.up}</button><button type="button" data-mv="1" data-i="${i}" aria-label="Move down">${ICON.down}</button></span>`}
          </li>`;
        }).join('')}</ol></div>
        <div class="play-a">
          ${checked ? `<div class="card" style="margin-bottom:12px"><div class="verdict ${right === items.length ? 'good' : 'bad'}">${right === items.length ? 'Perfect order!' : `${right} of ${items.length} in the right spot`}</div>
            <div class="small muted">Correct order: ${sorted.map(e => `${e.year} ${esc(e.title)}`).join(' \u2192 ')}</div><div class="small muted" style="margin-top:6px">Tap any event above for its details.</div></div>` : `<p class="hint touch-only">${sel >= 0 ? 'Now tap the event to swap with.' : 'Tap an event, then tap another to swap them.'}</p>`}
          <div class="row end sticky-next">${checked ? '<button class="btn primary wide-m" id="o-next" type="button">Next round <kbd>Enter</kbd></button>' : '<button class="btn primary wide-m" id="o-check" type="button">Check order <kbd>Enter</kbd></button>'}</div>
          <p class="hint kbd-only">Click an event, then use <kbd>\u2191</kbd> <kbd>\u2193</kbd> to move it, or drag it. <kbd>Enter</kbd> checks.</p>
        </div></div></div>`;
      wire();
    }
    function move(from, to) {
      if (to < 0 || to >= items.length || from === to) return;
      const [it] = items.splice(from, 1);
      items.splice(to, 0, it);
      sel = to;
      draw();
    }
    function wire() {
      const list = $('#olist', body);
      const c = $('#o-check', body), n = $('#o-next', body);
      if (c) c.addEventListener('click', check);
      if (n) n.addEventListener('click', newRound);
      if (checked) {
        list.addEventListener('click', e => { const li = e.target.closest('li'); if (li) openItem(items[+li.dataset.i].id); });
        return;
      }

        const mv = e.target.closest('[data-mv]');

    page.onKey = e => {

  // ---------- guess the year ----------
  function renderYear(body) {
    const pool = C.events.filter(e => e.year !== null && e.year >= Y0 && e.year <= 1990);
    if (!pool.length) { body.innerHTML = emptyHTML('No dated events in the study data yet.'); return; }
    const YMAX = 1990;
    const ROUNDS = Math.min(5, pool.length);
    let picks = [], idx = 0, total = 0, guessed = false, val = 1950, results = [];
    function newGame() {
      const weighted = shuffle(pool).sort((a, b) => strength(a.id) - strength(b.id) + (Math.random() - 0.5) * 3);
      picks = weighted.slice(0, ROUNDS); idx = 0; total = 0; results = []; drawQ();
    }
    function drawQ() {
      guessed = false; val = 1950;
      const e = picks[idx];
      body.innerHTML = `<div class="game"><div class="play">
        <div class="play-q">
          <div class="game-hud"><div class="progress"><div style="width:${(idx / ROUNDS) * 100}%"></div></div><span>${idx + 1}/${ROUNDS}</span><span>${total} pts</span></div>
          <div class="card q-card"><div class="kicker">When did this happen?</div><div class="q-prompt"><b>${esc(maskYears(e.title))}</b>${e.detail ? `<div class="muted q-detail">${esc(maskYears(e.detail))}</div>` : ''}</div></div>
        </div>
        <div class="play-a">
          <div class="card">

            <div class="range-labels"><span>${Y0}</span><span>1930</span><span>1964</span><span>${YMAX}</span></div>
            <div class="nudges"><button class="btn" data-n="-10" type="button" aria-label="Minus ten years">\u221210</button><button class="btn" data-n="-1" type="button" aria-label="Minus one year">\u22121</button><button class="btn" data-n="1" type="button" aria-label="Plus one year">+1</button><button class="btn" data-n="10" type="button" aria-label="Plus ten years">+10</button></div>
            <div id="y-out"></div>
          </div>
          <div class="row end sticky-next"><button class="btn primary wide-m" id="y-go" type="button">Lock it in <kbd>Enter</kbd></button></div>
          <p class="hint kbd-only"><kbd>\u2190</kbd> <kbd>\u2192</kbd> one year \u00b7 <kbd>Shift</kbd> + arrows ten years \u00b7 <kbd>Enter</kbd> submit</p>

      range.addEventListener('input', () => setVal(+range.value));

    }
    function submit() {
      if (guessed) return;

      const e = picks[idx], diff = Math.abs(val - e.year);
      const pts = Math.max(0, 100 - diff * 12);
      total += pts;
      results.push({ e, diff, pts });
      recordItem(e.id, diff <= 2);
      const verdict = diff === 0 ? 'Exactly right!' : diff <= 2 ? 'So close!' : diff <= 5 ? 'Close' : `Off by ${diff} years`;
      $('#y-val', body).innerHTML = `${val} <span style="font-size:.45em;color:var(--muted)">vs</span> <span style="color:var(--accent)">${e.year}</span>`;
      $('#y-range', body).disabled = true;
      $$('[data-n]', body).forEach(b => { b.disabled = true; });
      $('#y-out', body).innerHTML = `<div class="explain"><div class="verdict ${diff <= 2 ? 'good' : 'bad'}">${verdict} \u00b7 +${pts} pts</div>
        <p style="margin:0"><b>${esc(e.title)}</b> (${esc(e.date || e.year)})</p>${angleHTML(e.democracy_angle)}<div class="row" style="margin-top:8px">${chip(e.id)}${INDEX[e.era] ? chip(e.era) : ''}</div></div>`;

    function next() { idx++; if (idx >= ROUNDS) finish(); else drawQ(); }
    function finish() {
      const max = ROUNDS * 100;

      body.innerHTML = `<div class="game"><div class="card result"><div class="kicker">Final score</div><div class="score">${total}<small> / ${max}</small></div>
        ${great ? '<div class="perfect">Time traveler</div>' : ''}
        <div style="text-align:left;margin:16px auto;max-width:520px">${results.map(r => `<div class="conn-row small"><b>${r.e.year}</b> ${esc(r.e.title)} <span class="muted">\u00b7 ${r.diff === 0 ? 'exact' : 'off by ' + r.diff} \u00b7 ${r.pts} pts</span></div>`).join('')}</div>
        <button class="btn primary" id="y-again" type="button">Play again <kbd>Enter</kbd></button></div></div>`;
      $('#y-again', body).addEventListener('click', newGame);
      idx = -1;
      markPlan('year');
    }
    page.onKey = e => {
      if (idx === -1) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); newGame(); } return; }
      if (e.key === 'Enter') { e.preventDefault(); guessed ? next() : submit(); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        if (document.activeElement && document.activeElement.id === 'y-range') return;
        e.preventDefault();
        setVal(val + (e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -1 : 1) * (e.shiftKey ? 10 : 1));
      }
    };
    DEBUG.yearAnswer = () => (picks[idx] ? picks[idx].year : null);
    DEBUG.yearVal = () => val;
    DEBUG.yearSet = v => setVal(v);
    newGame();
  }

  // ---------- multiple-choice engine ----------
  function runMC(stage, cfg) {
    let queue = cfg.questions.map(q => Object.assign({ tries: 0 }, q));
    const total = queue.length;
    let done = 0, firstTry = 0, wrongs = 0, combo = 0, bestCombo = 0, answered = false, cur = null, finished = false;
    const missed = [];
    function next() {
      if (!queue.length) return finish();
      cur = queue.shift();
      cur.opts = shuffle(cur.options);
      answered = false;
      draw();
    }
    function draw() {
      stage.innerHTML = `<div class="play">
        <div class="play-q">
          <div class="game-hud"><div class="progress"><div style="width:${(done / total) * 100}%"></div></div><span>${done}/${total}</span><span class="combo ${combo >= 3 ? 'hot' : ''}" title="Correct in a row">${ICON.flame} ${combo}</span></div>
          <div class="card q-card">${cur.tries ? '<div class="kicker warn">Back again: you missed this one</div>' : ''}<div class="kicker">${esc(cur.kicker || '')}</div><div class="q-prompt">${cur.prompt}</div></div>
        </div>
        <div class="play-a">
          <div class="options">${cur.opts.map((o, i) => `<button class="opt" type="button" data-i="${i}"><kbd>${i + 1}</kbd><span>${esc(o.label)}</span></button>`).join('')}</div>
          <div class="explain" id="mc-explain" hidden></div>
          <div class="row end sticky-next"><button class="btn primary wide-m" id="mc-next" type="button" hidden>Next <kbd>Enter</kbd></button></div>
          <p class="hint kbd-only"><kbd>1</kbd>-<kbd>${cur.opts.length}</kbd> answer \u00b7 <kbd>Enter</kbd> next</p>
        </div></div>`;
      $$('.opt', stage).forEach(b => b.addEventListener('click', () => answer(+b.dataset.i)));
      $('#mc-next', stage).addEventListener('click', next);
    }
    function answer(i) {
      if (answered || !cur || !cur.opts[i]) return;
      answered = true;
      const btns = $$('.opt', stage), ok = !!cur.opts[i].correct;
      btns.forEach((b, j) => { b.disabled = true; if (cur.opts[j].correct) b.classList.add('correct'); else if (j !== i) b.classList.add('dim'); });
      if (cur.itemId) recordItem(cur.itemId, ok);
      const right = cur.opts.find(o => o.correct);
      if (ok) {
        combo++; bestCombo = Math.max(bestCombo, combo); done++;
        if (!cur.tries) firstTry++;
        buzz('good');
        addXP(cur.tries ? 5 : 10 + (combo >= 3 ? 2 : 0), btns[i]);
      } else {
        btns[i].classList.add('wrong'); shake(btns[i]); buzz('bad');
        combo = 0; wrongs++;
        if (!missed.includes(cur.key)) missed.push(cur.key);
        cur.tries++;
        if (cfg.requeue !== false && cur.tries < 3) queue.splice(Math.min(queue.length, 2 + Math.floor(Math.random() * 2)), 0, cur);
        else done++;
      }
      const ex = $('#mc-explain', stage);
      ex.hidden = false;
      ex.innerHTML = `<div class="card"><div class="verdict ${ok ? 'good' : 'bad'}">${ok ? pick(['Correct!', 'Nice!', 'Yes!', 'Exactly.']) : 'Not quite. Answer: ' + esc(right ? right.label : '')}</div>${cur.explain || ''}${!ok && cfg.requeue !== false && cur.tries < 3 ? '<p class="small muted" style="margin:8px 0 0">This one will come back later in the round.</p>' : ''}</div>`;
      const nb = $('#mc-next', stage);
      nb.hidden = false;
      if (!isTouch()) nb.focus({ preventScroll: true });
      ex.scrollIntoView({ block: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' });
    }
    function finish() {
      finished = true;
      const perfect = wrongs === 0 && total > 0;
      DEBUG.lastMC = { firstTry, total, wrongs, perfect };
      stage.innerHTML = `<div class="card result"><div class="kicker">Round complete</div>
        <div class="score">${firstTry}<small> / ${total} first try</small></div>
        ${perfect ? '<div class="perfect">Perfect round</div>' : ''}
        <p class="muted">Best streak: ${bestCombo} in a row${wrongs ? ` \u00b7 ${wrongs} ${wrongs === 1 ? 'miss' : 'misses'}` : ''}</p>
        ${missed.length ? `<div style="margin:12px 0"><div class="kicker">Review these</div><div class="chips" style="justify-content:center">${missed.map(id => chip(id)).join('')}</div></div>` : ''}
        <div class="row" style="justify-content:center"><button class="btn primary" id="mc-again" type="button">Play again <kbd>Enter</kbd></button><a class="btn" href="#/">Back to plan</a></div></div>`;
      $('#mc-again', stage).addEventListener('click', cfg.restart);
      if (perfect) { celebrate(); addXP(20, $('#mc-again', stage)); }
      if (cfg.planKey) markPlan(cfg.planKey);
    }
    page.onKey = e => {
      if (finished) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cfg.restart(); } return; }
      if (/^[1-9]$/.test(e.key) && !answered) { e.preventDefault(); answer(+e.key - 1); }
      else if ((e.key === 'Enter' || e.key === ' ') && answered) { e.preventDefault(); next(); }
    };
    DEBUG.mcCorrectIndex = () => (cur && cur.opts ? cur.opts.findIndex(o => o.correct) : -1);
    DEBUG.mcRemaining = () => queue.length + (answered || finished ? 0 : 1);
    DEBUG.mcFinished = () => finished;
    next();
  }
  function optionsFrom(answerLabel, poolLabels) {
    const others = shuffle([...new Set(poolLabels.filter(l => l && l !== answerLabel))]).slice(0, 3);
    return [{ label: answerLabel, correct: true }].concat(others.map(l => ({ label: l, correct: false })));
  }
  // ---------- who/what quiz ----------
  function renderQuiz(root, rest) {
    const people = C.people.filter(p => p.name && (p.role || p.detail));
    const terms = C.terms.filter(t => t.term && t.definition);
    const events = C.events.filter(e => e.title && e.detail);
    const avail = { people: people.length >= 4, terms: terms.length >= 4, events: events.length >= 4 };
    let mode = ['people', 'terms', 'events'].includes(rest[0]) ? rest[0] : 'mixed';
    if (mode !== 'mixed' && !avail[mode]) mode = 'mixed';
    root.innerHTML = `<div class="game"><h1>Who/What is it?</h1><p class="sub">Read the clue and pick the answer. Misses come back later in the round, so you finish knowing all of them.</p>
      ${seg([['#/quiz', 'Mixed', 'mixed'], ...(avail.people ? [['#/quiz/people', 'People', 'people']] : []), ...(avail.terms ? [['#/quiz/terms', 'Terms', 'terms']] : []), ...(avail.events ? [['#/quiz/events', 'Events', 'events']] : [])], mode)}
      <div id="quiz-stage" style="margin-top:14px"></div></div>`;
    const stage = $('#quiz-stage', root);
    const sourceOf = item => `${angleHTML(item.democracy_angle)}${sourcesHTML(item.sources)}<div style="margin-top:8px">${chip(item.id)}</div>`;
    function build() {
      const pool = [];
      if ((mode === 'mixed' || mode === 'people') && avail.people) people.forEach(p => pool.push({ t: 'person', it: p }));
      if ((mode === 'mixed' || mode === 'terms') && avail.terms) terms.forEach(t => pool.push({ t: 'term', it: t }));
      if ((mode === 'mixed' || mode === 'events') && avail.events) events.forEach(e => pool.push({ t: 'event', it: e }));
      if (!pool.length) { stage.innerHTML = emptyHTML('Need at least four people, terms, or events in the study data to make a quiz.'); return; }
      const chosen = pool.map(p => ({ p, w: strength(p.it.id) + imp(p.it) * 0.6 + Math.random() * 2.5 })).sort((a, b) => a.w - b.w).slice(0, 10).map(x => x.p);
      const qs = chosen.map(({ t, it }) => {
        if (t === 'person') return {
          key: it.id, itemId: it.id, kicker: 'Who is this?',
          prompt: `${it.role ? `<span class="role">${esc(maskAnswer(it.role, it.name, true))}${it.years ? ' \u00b7 ' + esc(it.years) : ''}</span>` : ''}${esc(maskAnswer(it.detail, it.name, true))}`,
          options: optionsFrom(it.name, people.map(p => p.name)),
          explain: `<p style="margin:0"><b>${esc(it.name)}</b>${it.role ? ' \u00b7 ' + esc(it.role) : ''}</p>${sourceOf(it)}`
        };
        if (t === 'term') return {
          key: it.id, itemId: it.id, kicker: 'Which term matches?',
          prompt: esc(maskAnswer(it.definition, it.term)),
          options: optionsFrom(it.term, terms.map(x => x.term)),
          explain: `<p style="margin:0"><b>${esc(it.term)}</b></p>${sourceOf(it)}`
        };
        return {
          key: it.id, itemId: it.id, kicker: 'Which event is this?',
          prompt: esc(maskAnswer(it.detail, it.title)),
          options: optionsFrom(it.title, events.map(x => x.title)),
          explain: `<p style="margin:0"><b>${esc(it.title)}</b> (${esc(it.date || it.year || '')})</p>${sourceOf(it)}`
        };
      });
      runMC(stage, { questions: qs, planKey: 'quiz', restart: build });
    }
    build();
  }

  // ---------- quote detective ----------
  function renderQuotes(root) {
    root.innerHTML = `<div class="game"><h1>Quote detective</h1><p class="sub">Who wrote or said this? After you answer, you'll see the page and what argument the quote is good for. Quotes are your best evidence in the essay.</p><div id="q-stage"></div></div>`;
    const stage = $('#q-stage', root);
    const all = C.readings.flatMap(r => r.quotes.map(q => ({ r, q })));
    const labels = C.readings.map(r => r.short || r.title || r.id);
    if (!all.length || new Set(labels).size < 2) { stage.innerHTML = emptyHTML('Need quotes from at least two sources in the study data to play.'); return; }
    function build() {
      const picks = sample(all, Math.min(5, all.length));
      const withQuotes = [...new Set(C.readings.filter(r => r.quotes.length).map(r => r.short || r.title || r.id))];
      const qs = picks.map(({ r, q }, n) => {
        const label = r.short || r.title || r.id;
        let distract = withQuotes.filter(l => l !== label);
        if (distract.length < 3) distract = distract.concat(shuffle(labels.filter(l => l !== label && !distract.includes(l))));
        const options = [{ label, correct: true }].concat(shuffle(distract).slice(0, 3).map(l => ({ label: l, correct: false })));
        return {
          key: r.id, itemId: r.id, kicker: 'Who wrote or said this?',
          prompt: `<div class="quote-big">${esc(q.text)}</div>`,
          options,
          explain: `<p style="margin:0 0 6px"><b>${esc(label)}</b>${q.page ? ' \u00b7 p. ' + esc(q.page) : ''}</p>${q.use_for ? `<p style="margin:0 0 6px"><b>Use it for:</b> ${esc(q.use_for)}</p>` : ''}${r.argument ? `<p class="small muted" style="margin:0">${esc(r.argument)}</p>` : ''}<div style="margin-top:8px">${chip(r.id)}</div>`
        };
      });
      runMC(stage, { questions: qs, planKey: 'quotes', requeue: false, restart: build });
    }
    build();
  }

  // ---------- matching ----------
  function renderMatch(root, rest) {
    const MODES_M = {
      people: { label: 'People \u2194 roles', pairs: () => C.people.filter(p => p.name && p.role).map(p => ({ id: p.id, l: p.name, r: p.role })) },
      terms: { label: 'Terms \u2194 definitions', pairs: () => C.terms.filter(t => t.term && t.definition).map(t => ({ id: t.id, l: t.term, r: truncate(maskAnswer(t.definition, t.term), 150) })) },
      events: { label: 'Events \u2194 years', pairs: () => C.events.filter(e => e.title && e.year !== null).map(e => ({ id: e.id, l: maskYears(e.title), r: String(e.year) })) }
    };
    const mode = MODES_M[rest[0]] ? rest[0] : 'people';
    root.innerHTML = `<div class="game" style="max-width:900px"><h1>Matching race</h1><p class="sub">Pick an item on the left, then its match on the right. Wrong matches add five seconds.</p>
      ${seg(Object.keys(MODES_M).map(k => ['#/match/' + k, MODES_M[k].label, k]), mode)}<div id="m-stage" style="margin-top:14px"></div></div>`;
    const stage = $('#m-stage', root);
    let timer = null;
    page.cleanup = () => clearInterval(timer);
    function build() {
      clearInterval(timer);
      const seen = new Set();
      const pool = shuffle(MODES_M[mode].pairs()).filter(p => { if (seen.has(p.r)) return false; seen.add(p.r); return true; });
      if (pool.length < 3) { stage.innerHTML = emptyHTML('Not enough items with distinct answers for this matching mode.'); return; }
      const pairs = pool.slice(0, 6);
      const L = shuffle(pairs), R = shuffle(pairs);
      let selL = null, selR = null, start = 0, penalty = 0, mistakes = 0, finished = false;
      const matched = new Set();
      const best = S.best['match_' + mode];
      stage.innerHTML = `<div class="game-hud"><span class="timer" id="m-time">0.0s</span><span class="grow"></span><span id="m-left">${pairs.length} left</span>${best ? `<span>best ${(best / 1000).toFixed(1)}s</span>` : ''}</div>
        <div class="match-grid"><div class="match-col">${L.map((p, i) => `<button class="m-item left" type="button" data-side="l" data-id="${esc(p.id)}"><kbd>${i + 1}</kbd><span>${esc(p.l)}</span></button>`).join('')}</div>
        <div class="match-col">${R.map((p, i) => `<button class="m-item" type="button" data-side="r" data-id="${esc(p.id)}"><kbd>${'ABCDEF'[i]}</kbd><span>${esc(p.r)}</span></button>`).join('')}</div></div>
        <div id="m-result"></div><p class="hint kbd-only"><kbd>1</kbd>-<kbd>${pairs.length}</kbd> pick left \u00b7 <kbd>A</kbd>-<kbd>${'ABCDEF'[pairs.length - 1]}</kbd> pick right</p>`;
      const el = (side, id) => $(`.m-item[data-side="${side}"][data-id="${CSS.escape(id)}"]`, stage);
      function tick() { if (!start) return; $('#m-time', stage).textContent = ((Date.now() - start + penalty) / 1000).toFixed(1) + 's'; }
      function choose(side, id) {
        if (finished || matched.has(id)) return;
        if (!start) { start = Date.now(); timer = setInterval(tick, 100); }
        if (side === 'l') selL = selL === id ? null : id; else selR = selR === id ? null : id;
        $$('.m-item', stage).forEach(b => b.classList.toggle('sel', (b.dataset.side === 'l' && b.dataset.id === selL) || (b.dataset.side === 'r' && b.dataset.id === selR)));
        if (selL && selR) {
          const a = el('l', selL), b = el('r', selR);
          if (selL === selR) {
            matched.add(selL); recordItem(selL, true);
            [a, b].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); x.disabled = true; });
            addXP(3, b);
          } else {
            mistakes++; penalty += 5000; recordItem(selL, false);
            [a, b].forEach(x => { x.classList.remove('sel'); x.classList.add('bad'); shake(x); setTimeout(() => x.classList.remove('bad'), 450); });
            tick();
          }
          selL = selR = null;
          $('#m-left', stage).textContent = (pairs.length - matched.size) + ' left';
          if (matched.size === pairs.length) done();
        }
      }
      function done() {
        finished = true; clearInterval(timer);
        const t = Date.now() - start + penalty;
        const isBest = !best || t < best;
        if (isBest) S.best['match_' + mode] = t;
        save();
        markPlan('match');
        tick();
        DEBUG.lastMatch = { mistakes, time: t };
        $('#m-result', stage).innerHTML = `<div class="card result" style="margin-top:14px"><div class="kicker">All matched</div><div class="score">${(t / 1000).toFixed(1)}<small>s</small></div>
          ${mistakes === 0 ? '<div class="perfect">Flawless</div>' : `<p class="muted">${plural(mistakes, 'wrong match')} (+${mistakes * 5}s)</p>`}${isBest && best ? '<p><b>New best time!</b></p>' : ''}
          <button class="btn primary" id="m-again" type="button">Play again <kbd>Enter</kbd></button></div>`;
        $('#m-again', stage).addEventListener('click', build);
        if (mistakes === 0) { celebrate(); addXP(15, $('#m-again', stage)); }
      }
      stage.querySelectorAll('.m-item').forEach(b => b.addEventListener('click', () => choose(b.dataset.side, b.dataset.id)));
      page.onKey = e => {
        if (finished) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); build(); } return; }
        const k = e.key.toLowerCase();
        if (/^[1-6]$/.test(k) && L[+k - 1]) choose('l', L[+k - 1].id);
        else if ('abcdef'.includes(k) && k.length === 1 && R['abcdef'.indexOf(k)]) choose('r', R['abcdef'.indexOf(k)].id);
      };
      DEBUG.matchPairs = () => pairs.map(p => p.id);
      DEBUG.matchChoose = (side, id) => choose(side, id);
    }
    build();
  }

  // ---------- essay gym ----------
  const WEAK_THESES = [
    'Brazil had a lot of changes from 1930 to 1988.',
    'There were good and bad things about democracy in Brazil during this time.',

  function autosize(t) { if (!t) return; t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }
  function renderEssay(root, rest, params) {
    const sub = rest[0] === 'remix' ? 'remix' : 'outline';

  function renderOutline(body, pid) {
    let p = C.prompts.find(x => x.id === pid) || C.prompts[0];
    let timeLeft = 300, timer = null, revealed = false;
    const evItems = [...C.events, ...C.people, ...C.terms, ...C.readings];
    const typeOrder = { event: 0, person: 1, term: 2, reading: 3 };
    const pickList = evItems.slice().sort((a, b) => imp(a) - imp(b) || typeOrder[INDEX[a.id].type] - typeOrder[INDEX[b.id].type] || nameOf(a.id).localeCompare(nameOf(b.id)));
    const hay = {};
    evItems.forEach(it => { hay[it.id] = fold([nameOf(it.id), it.year, it.years, it.role, it.author, it.term].filter(Boolean).join(' ')); });
    const openPickers = new Set();

  function renderRemix(body) {
    const usable = C.prompts.filter(p => p.theses.length);
    if (!usable.length) { body.innerHTML = emptyHTML('No sample theses in the study data yet.'); return; }
    const ROUNDS = Math.min(5, usable.reduce((a, p) => a + p.theses.length, 0));
    let n = 0, score = 0, answered = false, strongSide = 0, cur = null;
    function newRound() {
      if (n >= ROUNDS) return finish();
      const p = pick(usable), t = pick(p.theses);
      cur = { p, t, weak: pick(WEAK_THESES) };
      strongSide = Math.random() < 0.5 ? 0 : 1;
      answered = false;
      const opts = strongSide === 0 ? [cur.t.text, cur.weak] : [cur.weak, cur.t.text];
      body.innerHTML = `<div class="game"><div class="play">
        <div class="play-q"><div class="game-hud"><div class="progress"><div style="width:${(n / ROUNDS) * 100}%"></div></div><span>${n + 1}/${ROUNDS}</span><span>${score} right</span></div>
          <div class="card q-card"><div class="kicker">Prompt</div><div class="q-prompt">${esc(cur.p.prompt)}</div></div></div>
        <div class="play-a"><p class="muted small" style="margin:0 0 8px">Which thesis is stronger?</p>
          <div class="remix">${opts.map((o, i) => `<button class="opt" type="button" data-i="${i}"><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`).join('')}</div>
          <div id="r-explain"></div><div class="row end sticky-next"><button class="btn primary wide-m" id="r-next" type="button" hidden>Next <kbd>Enter</kbd></button></div>
          <p class="hint kbd-only"><kbd>1</kbd> or <kbd>2</kbd> to choose \u00b7 <kbd>Enter</kbd> next</p></div></div></div>`;
      $$('.opt', body).forEach(b => b.addEventListener('click', () => answer(+b.dataset.i)));
      $('#r-next', body).addEventListener('click', () => { n++; newRound(); });
    }
    function answer(i) {
      if (answered) return;
      answered = true;
      const ok = i === strongSide;
      const btns = $$('.opt', body);
      btns.forEach((b, j) => { b.disabled = true; b.classList.add(j === strongSide ? 'correct' : 'dim'); });
      if (!ok) { btns[i].classList.remove('dim'); btns[i].classList.add('wrong'); shake(btns[i]); buzz('bad'); }
      if (ok) { score++; buzz('good'); addXP(5, btns[i]); }
      $('#r-explain', body).innerHTML = `<div class="card explain"><div class="verdict ${ok ? 'good' : 'bad'}">${ok ? 'Right.' : 'Not this time.'}</div>
        <p style="margin:0 0 6px">The stronger thesis takes a clear position that someone could disagree with, and it gives specific reasons that can each become a body paragraph. The weaker one only describes or restates the topic, so there is nothing to prove.</p>
        ${cur.t.points.length ? `<div class="kicker" style="margin-top:8px">Its reasons become these claims</div><ul class="small" style="margin:0">${cur.t.points.map(pt => `<li>${esc(pt.claim)}</li>`).join('')}</ul>` : ''}</div>`;
      $('#r-next', body).hidden = false;
    }
    function finish() {
      if (score === ROUNDS) celebrate();
      DEBUG.lastRemix = { score, total: ROUNDS };
      body.innerHTML = `<div class="game"><div class="card result"><div class="kicker">Thesis remix</div><div class="score">${score}<small> / ${ROUNDS}</small></div>${score === ROUNDS ? '<div class="perfect">Sharp eye</div>' : ''}

        <div class="row" style="justify-content:center"><button class="btn primary" id="r-again" type="button">Play again <kbd>Enter</kbd></button><a class="btn" href="#/essay">Five-minute outline</a></div></div></div>`;

  // ---------- search ----------
  function searchAll(q) {
    const terms = fold(q).trim().split(/\s+/).filter(Boolean);
    if (!terms.length || fold(q).trim().length < 2) return [];
    const out = [];
    Object.keys(INDEX).forEach(id => {
      const { type, item: it } = INDEX[id];
      const name = nameOf(id);
      const fields = [name, it.role, it.detail, it.definition, it.democracy_angle, it.summary, it.context, it.argument, it.claim, it.complication, it.why_likely, it.back, it.author, it.title, it.years,
        arr(it.key_points).join(' '), arr(it.quotes).map(x => x.text).join(' '), arr(it.tags).join(' '), it.year ? String(it.year) : ''].filter(Boolean).map(str);
      const hay = fold(fields.join(' \u2022 '));
      if (!terms.every(t => hay.includes(t))) return;
      const fn = fold(name);
      let score = 0;
      terms.forEach(t => { if (fn.includes(t)) score += 10; if (fn.startsWith(t)) score += 5; });
      score += (4 - imp(it)) + (type === 'flashcard' ? -3 : 0);
      const field = fields.slice(1).find(f => fold(f).includes(terms[0])) || fields[1] || '';
      out.push({ id, type, name, score, snip: field });
    });
    return out.sort((a, b) => b.score - a.score).slice(0, 80);
  }
  function highlight(text, q) {

    fold(q).trim().split(/\s+/).filter(x => x.length >= 2).forEach(term => {
      t = t.replace(new RegExp('(' + reEsc(esc(term)) + ')', 'gi'), '<mark>$1</mark>');
    });
    return t;
  }

      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'manifest.webmanifest';
      document.head.appendChild(link);

    if (!('serviceWorker' in navigator)) return;
    const reg = () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker not registered:', err && err.message));

    });
    onMQ(mqDark, () => { if (S.theme !== 'light' && S.theme !== 'dark') applyTheme(); });
    onMQ(mqNarrow, () => { if (page.responsive) route(); });
    $('#search-btn').addEventListener('click', () => { location.hash = '#/search'; });
    document.addEventListener('click', e => {
      const o = e.target.closest('[data-open]');
      if (o) { e.preventDefault(); openItem(o.getAttribute('data-open')); return; }
      if (e.target.closest('[data-close]')) { closeModal(true); return; }
      const r = e.target.closest('[data-run]');
      if (r) onRunnerClick(r.dataset.run);
    });
    $('#modal-back').addEventListener('click', () => { const prev = modalStack.pop(); if (prev) openItem(prev, true); });
    initSheetDrag();
    const q = $('#q');
    q.addEventListener('input', () => {
      if (parseHash().name === 'search') { setSearchHash(q.value); drawResults(q.value); }
      else location.hash = '#/search?q=' + encodeURIComponent(q.value);
    });
    q.addEventListener('keydown', e => {
      if (e.key === 'Escape') q.blur();
      if (e.key === 'Enter') { const first = $('#search-results [data-open]'); if (first) openItem(first.dataset.open); }
    });
    document.addEventListener('keydown', e => {
      const modal = $('#modal');
      if (e.key === 'Escape' && !modal.hidden) { closeModal(); return; }
      const t = e.target, tag = (t.tagName || '').toLowerCase();
      const typing = (tag === 'input' && t.type !== 'range' && t.type !== 'checkbox') || tag === 'textarea' || tag === 'select' || t.isContentEditable;
      if (e.key === '/' && !typing) { e.preventDefault(); if (isNarrow()) location.hash = '#/search'; else { q.focus(); q.select(); } return; }
      if (typing || e.metaKey || e.ctrlKey || e.altKey || !modal.hidden) return;
      if (page.onKey) page.onKey(e);
    });
    window.addEventListener('hashchange', route);
    window.addEventListener('storage', e => { if (e.key === KEY) { S = loadState(); updateHud(); } });
    registerOffline();
    route();
  }
  init();
})();

</script>
</body>
</html>
