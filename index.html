m; Lula defeated him in 2022.","democracy_angle":"His rise showed that nostalgia for military rule persisted decades after 1985.","importance":2,"sources":["slides/Hist1475_Lecture13_F26.md#36","slides/Hist1475_Lecture13_F26.md#37","general"]}],"terms":[{"id":"cafe_com_leite","term":"Caf\u00e9 com leite politics","definition":"The First Republic's arrangement in which S\u00e3o Paulo (coffee) and Minas Gerais (dairy) elites alternated control of the presidency, backed by coffee valorization.","democracy_angle":"Oligarchic democracy in form only; its collapse in 1930 is the starting point for the Vargas era.","importance":1,"sources":["slides/HIST1474_Lecture9_F26.md#4","slides/HIST1474_Lecture9_F26.md#7","slides/HIST1474_Lecture9_F26.md#10"]},{"id":"populism","term":"Populism","definition":"A politics of 'the people' versus 'the elite,' with urban crowds, emotional oratory and anti-imperialist nationalism, which the slides tie to the Great Depression and the exhaustion of 19th-century politics.","democracy_angle":"Incorporated previously marginalized classes into politics, but through loyalty to a leader and the state rather than independent organization.","importance":1,"sources":["slides/HIST1474_Lecture9_F26.md#4","slides/HIST1474_Lecture9_F26.md#33"]},{"id":"corporatism","term":"Corporatism","definition":"State-directed relations between labor and business, with the state as arbiter and unions recognized by the state; promoted as a 'third path' between laissez-faire capitalism and communism.","democracy_angle":"Delivered rights and order by subordinating workers' organizations to the state rather than to their members.","importance":1,"sources":["slides/HIST1474_Lecture9_F26.md#18","slides/HIST1474_WEEK10_FALL2026.md#4"]},{"id":"third_path","term":"Third path","definition":"The idea that Brazil could chart an economic and political model between US capitalism and Soviet communism, from Vargas's corporatism to postwar developmentalism.","democracy_angle":"Often justified strong executive power over liberal institutions.","importance":2,"sources":["slides/HIST1474_Lecture9_F26.md#18","slides/HIST1474_WEEK10_FALL2026.md#2","slides/HIST1474_WEEK10_FALL2026.md#4","slides/HIST1474_WEEK10_FALL2026.md#8"]},{"id":"economic_nationalism","term":"Economic nationalism","definition":"Policy of nationalizing strategic natural resources and building state industries (steel at Volta Redonda, oil at Petrobras) under slogans like 'O petr\u00f3leo \u00e9 nosso!'","democracy_angle":"Mobilized mass public support and linked national sovereignty to popular welfare.","importance":1,"sources":["slides/HIST1474_Lecture9_F26.md#4","slides/HIST1474_Lecture9_F26.md#19","slides/HIST1474_Lecture9_F26.md#29","slides/HIST1474_WEEK10_FALL2026.md#5","slides/HIST1474_WEEK10_FALL2026.md#6"]},{"id":"social_question","term":"The social question","definition":"The problem of how to incorporate workers and the poor into the nation; Vargas answered with labor codes and welfare measures, which remained incomplete.","democracy_angle":"Brought new classes into politics while creating unequal, partial social protections.","importance":2,"sources":["slides/HIST1474_Lecture9_F26.md#4","readings/w10_wolfe_autos_progress_ch5.txt p.114"]},{"id":"iaps","term":"IAPs (Institutos de Aposentadoria e Pens\u00f5es)","definition":"Vargas-era social security and health funds organized by profession in a corporatist framework; rural, domestic and informal workers were excluded and labeled indigentes, dependent on charity.","democracy_angle":"Created a stratified citizenship in which rights depended on formal employment, which the 1988 SUS replaced.","importance":1,"sources":["readings/w12_teixeira_health_care_human_right.txt"]},{"id":"red_scare","term":"Vargas's Red Scare","definition":"After a 1935 communist uprising the regime used censorship, police interrogations and special military tribunals against liberals, leftists and communists, and later against fascist Integralists too.","democracy_angle":"Anticommunism became a tool for closing down democracy, as again in 1964.","importance":2,"sources":["slides/HIST1474_Lecture9_F26.md#15","general"]},{"id":"queremismo","term":"Queremismo ('We Want Get\u00falio')","definition":"The 1945 protest campaigns calling for Vargas to stay in power as the Estado Novo ended.","democracy_angle":"Shows genuine popular attachment to a dictator who had delivered social rights.","importance":3,"sources":["slides/HIST1474_Lecture9_F26.md#23","general"]},{"id":"developmentalism","term":"Developmentalism","definition":"The belief that the state should plan and drive rapid industrialization and infrastructure, as in JK's Targets Plan; continued in different forms by the military.","democracy_angle":"JK presented it as the path to democracy; the military used it as a substitute for democracy.","importance":1,"sources":["slides/HIST1474_WEEK10_FALL2026.md#2","slides/HIST1474_WEEK10_FALL2026.md#13","readings/w10_wolfe_autos_progress_ch5.txt p.114","readings/w10_wolfe_autos_progress_ch5.txt p.143"]},{"id":"isi","term":"Import-Substitution Industrialization (ISI)","definition":"Policy of replacing imports with domestic manufacturing through subsidies, protective tariffs and licensing, theorized by Prebisch and Furtado at CEPAL; 'fact before it was policy, and policy before it was theory.' Abandoned in the 1980s neoliberal turn.","democracy_angle":"Gave the state a huge economic role, which shaped who benefited from growth under both democracy and dictatorship.","importance":1,"sources":["slides/HIST1474_WEEK10_FALL2026.md#14","slides/HIST1474_WEEK10_FALL2026.md#16"]},{"id":"fifty_years_in_five","term":"Fifty Years in Five","definition":"Kubitschek's slogan promising fifty years of progress during his five-year term through the Plano de Metas.","democracy_angle":"Promised rapid modernization would make Brazil a stable democracy; critics answered with 'fifty years of inflation in five.'","importance":1,"sources":["slides/HIST1474_WEEK10_FALL2026.md#1","slides/HIST1474_WEEK10_FALL2026.md#13","readings/w10_wolfe_autos_progress_ch5.txt p.113","readings/w11_teixeira_living_with_inflation.txt p.158"]},{"id":"dependency_theory","term":"Dependency theory","definition":"The argument (Prebisch, Furtado, Cardoso and Faletto) that Latin America's role exporting commodities to industrial countries kept it underdeveloped, an alternative to US modernization theory (Rostow).","democracy_angle":"Raised the question of whether economic dependency limited national self-government.","importance":2,"sources":["slides/HIST1474_WEEK10_FALL2026.md#14","slides/HIST1474_WEEK10_FALL2026.md#30","slides/HIST1474_WEEK10_FALL2026.md#31","general"]},{"id":"plano_piloto","term":"Plano Piloto and Monumental Axis","definition":"L\u00facio Costa's original plan for Bras\u00edlia: a Monumental Axis for federal government buildings crossed by a Residential Axis of superquadras, with the city divided into sectors by function (banking, hotels, embassies).","democracy_angle":"A capital designed from above by planners, with each function assigned its own sector.","importance":2,"sources":["slides/HIST1474_WEEK10_FALL2026.md#18","slides/HIST1474_WEEK10_FALL2026.md#19","slides/HIST1474_WEEK10_FALL2026.md#21"]},{"id":"superquadra","term":"Superquadra","definition":"Self-sufficient residential blocks in Bras\u00edlia with parks, schools and shops, where apartments were assigned by family size rather than income, meant to reshape social interaction.","democracy_angle":"Utopian egalitarianism in architecture, which did not reach the workers housed outside the plan.","importance":2,"sources":["slides/HIST1474_WEEK10_FALL2026.md#24","readings/w10_wolfe_autos_progress_ch5.txt p.135"]},{"id":"satellite_cities","term":"Satellite cities","definition":"Settlements that grew outside Bras\u00edlia's Plano Piloto, where many of the construction workers and poor migrants lived.","democracy_angle":"Exposed the gap between the modernist promise of equality and the real segregation of the capital.","importance":2,"sources":["slides/HIST1474_WEEK10_FALL2026.md#25","general"]},{"id":"automobility","term":"Automobility","definition":"Wolfe's term for the spread of cars, trucks and roads as a tool of national unity and modernity; under JK, car ownership became linked to freedom and democracy.","democracy_angle":"Tied citizenship to consumption, favoring the middle class and the autoworker 'labor elite.'","importance":2,"sources":["readings/w10_wolfe_autos_progress_ch5.txt p.113","readings/w10_wolfe_autos_progress_ch5.txt p.124","readings/w10_wolfe_autos_progress_ch5.txt p.135"]},{"id":"bureaucratic_authoritarianism","term":"Bureaucratic authoritarianism","definition":"Military rule by the armed forces as an institution (not one strongman), using technocrats to neutralize class conflict and claiming to be apolitical; some sectors welcomed it as an antidote to populism and polarization.","democracy_angle":"Replaced politics with technocracy and treated popular demands as threats to order.","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#3","slides/HIST1474_WEEK10pt2_FALL2026.md#9","slides/HIST1474_WEEK11_FALL2026.md#3"]},{"id":"authoritarian_legalism","term":"Authoritarian legalism","definition":"The regime's practice of curbing rights through public, 'legal' instruments (Institutional Acts, the 1967 Constitution, decree laws) rather than ruling openly outside the law.","democracy_angle":"Kept the fa\u00e7ade of Congress, courts and elections, which made the dictatorship more durable and later gave the opposition legal ground to fight on.","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#3","slides/HIST1474_WEEK10pt2_FALL2026.md#10","slides/HIST1474_WEEK10pt2_FALL2026.md#11","slides/HIST1474_WEEK10pt2_FALL2026.md#12","slides/HIST1474_WEEK11_FALL2026.md#3","readings/w12_teixeira_health_care_human_right.txt"]},{"id":"institutional_acts","term":"Institutional Acts (AIs)","definition":"Decrees issued by the military presidents to curtail individual rights, suspend Congress, purge politicians and change election rules; AI-1 (1964), AI-2 (1965) and AI-5 (1968) were the most important.","democracy_angle":"The main legal tools of the dictatorship, which the 1988 Constitution set out to dismantle.","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#3","slides/HIST1474_WEEK10pt2_FALL2026.md#10","slides/HIST1474_WEEK10pt2_FALL2026.md#12","readings/w12_teixeira_health_care_human_right.txt"]},{"id":"cold_war_anticommunism","term":"Cold War anticommunism","definition":"After the Cuban Revolution, Brazil's military and its allies labeled all leftist reform agendas 'communist' and treated them as security threats; Brazil was one of several Latin American military dictatorships from the 1960s to the 1980s.","democracy_angle":"Justified suspending democracy to 'save' it.","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#3","slides/HIST1474_WEEK10pt2_FALL2026.md#4","slides/HIST1474_WEEK10pt2_FALL2026.md#5"]},{"id":"anos_de_chumbo","term":"Anos de chumbo (Years of Lead)","definition":"The most repressive phase of the dictatorship, 1968-1974, marked by censorship, arbitrary detention, torture and disappearances.","democracy_angle":"The point at which the regime abandoned any pretense of tolerating legal opposition.","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#14","slides/HIST1474_WEEK11_FALL2026.md#6","readings/w11_teixeira_living_with_inflation.txt p.153","readings/w11_teixeira_living_with_inflation.txt p.160"]},{"id":"economic_miracle","term":"Economic miracle","definition":"1968-1973 boom with average growth near 10 percent a year and inflation around 20 percent, driven by state-led ISI, infrastructure, soy and cattle expansion, credit-fueled consumerism, foreign borrowing and severe wage repression; it unraveled after the 1973 oil shock.","democracy_angle":"Bought middle-class acceptance of dictatorship while workers paid the cost; Teixeira calls it more 'mirage than miracle.'","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#17","slides/HIST1474_WEEK10pt2_FALL2026.md#27","slides/HIST1474_WEEK11_FALL2026.md#16","slides/HIST1474_WEEK11_FALL2026.md#17","readings/w11_teixeira_living_with_inflation.txt p.153","readings/w11_teixeira_living_with_inflation.txt p.154","readings/w11_teixeira_living_with_inflation.txt p.160"]},{"id":"indexation","term":"Indexation and 'living with inflation'","definition":"Automatic adjustment of wages, bonds and contracts to inflation (begun with the PAEG's ORTN bond), which turned yesterday's inflation into today's ('inertial inflation').","democracy_angle":"Protected banks and asset holders more than workers, showing who the regime's economic policy served.","importance":2,"sources":["readings/w11_teixeira_living_with_inflation.txt p.155","readings/w11_teixeira_living_with_inflation.txt p.159","readings/w11_teixeira_living_with_inflation.txt p.161","readings/w11_teixeira_living_with_inflation.txt p.162"]},{"id":"camde","term":"CAMDE (Women's Campaign for Democracy)","definition":"Rio-based conservative housewives' movement that supported the 1964 coup on anticommunist and anti-inflation grounds and later reported price-control violators to SUNAB.","democracy_angle":"Claimed to defend 'democracy' while backing a dictatorship, showing how the word could be contested.","importance":2,"sources":["readings/w11_teixeira_living_with_inflation.txt p.158","readings/w11_teixeira_living_with_inflation.txt p.159"]},{"id":"carestia","term":"Carestia and the 'popular economy'","definition":"Carestia is the rising cost of living; laws defending the 'popular economy' (from the 1930s) made fair prices for essentials an economic right.","democracy_angle":"Turned prices into a question of government accountability and, by the 1970s, a pro-democracy cause.","importance":2,"sources":["readings/w11_teixeira_living_with_inflation.txt p.157","readings/w11_teixeira_living_with_inflation.txt p.164","readings/w11_teixeira_living_with_inflation.txt p.166"]},{"id":"sunab","term":"SUNAB","definition":"Federal agency created in 1962 to set price controls on essential goods; it relied on consumer denunciations but was widely seen as ineffective.","democracy_angle":"Invited citizen participation in regulation while delivering little enforcement, eroding trust.","importance":3,"sources":["readings/w11_teixeira_living_with_inflation.txt p.158","readings/w11_teixeira_living_with_inflation.txt p.159","readings/w11_teixeira_living_with_inflation.txt p.164","readings/w11_teixeira_living_with_inflation.txt p.165"]},{"id":"tropicalia","term":"Tropic\u00e1lia","definition":"Late-1960s cultural movement led by Caetano Veloso and Gilberto Gil that mixed Brazilian and international pop and avant-garde styles, provoking both the regime and the traditional left.","democracy_angle":"Dissent through cultural freedom and irony, which led to arrests and exile after AI-5.","importance":2,"sources":["slides/HIST1474_WEEK11_FALL2026.md#9","slides/HIST1474_WEEK11_FALL2026.md#14","general"]},{"id":"armed_struggle","term":"Armed struggle (guerrilla movements)","definition":"Underground leftist groups that turned to guerrilla actions (including kidnapping foreign diplomats) after legal protest was banned; the regime crushed them by the early 1970s.","democracy_angle":"A response to the closing of legal dissent that the regime used to justify more repression.","importance":2,"sources":["slides/HIST1474_WEEK11_FALL2026.md#4","slides/HIST1474_WEEK11_FALL2026.md#5","general"]},{"id":"arena_mdb","term":"ARENA and MDB","definition":"The two parties allowed after 1965: ARENA (pro-regime) and MDB (tolerated opposition). The MDB's 1974 gains made elections a channel of protest; the system was abolished in 1979.","democracy_angle":"A controlled opposition that voters gradually turned into a real one.","importance":2,"sources":["readings/w12_mccann_pavao_pavaozinho.txt p.192","readings/w12_mccann_pavao_pavaozinho.txt p.193","readings/w11_teixeira_living_with_inflation.txt p.166","readings/w11_lula_may_day_speech.txt p.489"]},{"id":"distensao_abertura","term":"Distens\u00e3o and abertura","definition":"Distens\u00e3o (loosening) under Geisel from 1974 and abertura (opening) under Figueiredo from 1979: a slow, gradual, top-down liberalization.","democracy_angle":"The regime meant to control the transition; popular movements accelerated it.","importance":1,"sources":["slides/HIST1474_WEEK10pt2_FALL2026.md#24","slides/Hist1475_Lecture13_F26.md#3","readings/w11_teixeira_living_with_inflation.txt p.166","readings/w11_teixeira_living_with_inflation.txt p.169"]},{"id":"fiscais_do_sarney","term":"Fiscais do Sarney (Sarney's inspectors)","definition":"Citizens, mostly housewives, who volunteered under the 1986 Plano Cruzado to report businesses violating the price freeze.","democracy_angle":"Turned economic enforcement into civic participation in the new democracy, but compliance was uneven and trust fell when the plan failed.","importance":2,"sources":["slides/Hist1475_Lecture13_F26.md#17","readings/w11_teixeira_living_with_inflation.txt p.174"]},{"id":"hyperinflation","term":"Hyperinflation and the lost decade","definition":"Inflation rose from 228 percent (1984) to 1,118 percent (1988) and 2,851 percent (1993) amid debt crisis and recession; several stabilization plans (Cruzado, Bresser, Ver\u00e3o, Collor) failed before the Plano Real (1994).","democracy_angle":"Economic chaos threatened public faith in the young democracy just as it was being built.","importance":1,"sources":["slides/Hist1475_Lecture13_F26.md#5","slides/Hist1475_Lecture13_F26.md#14","slides/Hist1475_Lecture13_F26.md#20","readings/w11_teixeira_living_with_inflation.txt p.169","readings/w11_teixeira_living_with_inflation.txt p.171","readings/w11_teixeira_living_with_inflation.txt p.173"]},{"id":"sus","term":"SUS (Sistema \u00danico de Sa\u00fade)","definition":"Brazil's free, universal public health system created by the 1988 Constitution (Article 196) and Law 8.080 (1990); about 70 percent of Brazilians rely only on it. A 2016 amendment capped health and education spending for 20 years.","democracy_angle":"The clearest case of universal social citizenship replacing Vargas-era stratified rights, though underfunded.","importance":1,"sources":["slides/Hist1475_Lecture13_F26.md#13","readings/w12_teixeira_health_care_human_right.txt"]},{"id":"favela_removal","term":"Favela removal vs. upgrading","definition":"The 1960s-70s campaign (escalated under the military) to demolish favelas and relocate residents, versus Brizola's 1980s upgrading that brought services, titles and infrastructure to favelas in place.","democracy_angle":"Removal treated the poor as problems; upgrading treated them as rights-bearing citizens.","importance":2,"sources":["readings/w12_mccann_pavao_pavaozinho.txt p.191","readings/w12_mccann_pavao_pavaozinho.txt p.196","readings/w12_mccann_pavao_pavaozinho.txt p.217"]},{"id":"socialismo_moreno","term":"Socialismo moreno (brown socialism)","definition":"Brizola and Darcy Ribeiro's program for Rio (1983-87) promising rights and welfare for working and poor Brazilians of color: CIEP schools, housing, infrastructure and civil rights, including community policing.","democracy_angle":"An explicit attempt to extend citizenship to the non-white informal poor during redemocratization.","importance":2,"sources":["readings/w12_mccann_pavao_pavaozinho.txt p.195","readings/w12_mccann_pavao_pavaozinho.txt p.198","readings/w12_mccann_pavao_pavaozinho.txt p.213"]},{"id":"racial_democracy","term":"Myth of racial democracy","definition":"The idea that Brazil was free of racial discrimination; Nascimento argued it presented Brazil abroad as a model while keeping Black Brazilians 'tricked and docile' at home.","democracy_angle":"Political democracy without racial equality was incomplete, a critique that persisted after 1988.","importance":1,"sources":["slides/HIST1474_WEEK11_FALL2026.md#15","slides/Hist1475_Lecture13_F26.md#40","readings/w11_nascimento_myth_racial_democracy.txt p.446"]},{"id":"golden_law","term":"Golden Law (Lei \u00c1urea, 13 May 1888)","definition":"The law that abolished slavery in Brazil without land, support or compensation for the freed; Nascimento called abolition 'a fa\u00e7ade.'","democracy_angle":"The pre-midterm root of exclusion that Nascimento linked to the 1968 condition of Black Brazilians.","importance":2,"sources":["readings/w11_nascimento_myth_racial_democracy.txt p.446","readings/w11_nascimento_myth_racial_democracy.txt p.447","general"]},{"id":"fordlandia","term":"Fordl\u00e2ndia","definition":"Henry Ford's failed Amazon rubber plantation town (founded 1928), studied before the midterm; Wolfe compares Bras\u00edlia's goal of joining coast and interior to it.","democracy_angle":"A bridge from foreign-led extraction to JK's state-led, multinational industrialization.","importance":3,"sources":["readings/w10_wolfe_autos_progress_ch5.txt p.134","general"]}],"readings":[{"id":"w09_vianna_why_estado_novo","short":"Oliveira Vianna, 'Why the Estado Novo?'","author":"Oliveira Vianna","title":"Why the Estado Novo?","week":9,"kind":"primary","pages":"184-85 (course pack, Brazil Reader 1st ed.)","status":"course_pack_only","context":"A defense of Vargas's 1937 dictatorship by its best-known intellectual supporter, a jurist who advised the Labor Ministry. Text is not on disk; this summary uses only general knowledge of Vianna's views.","argument":"In general terms, Vianna held that liberal, imported institutions (like the 1891 Constitution) did not fit Brazilian social reality, so a strong, centralized, corporatist state was needed to organize the nation.","key_points":["Leading intellectual of authoritarian corporatism (general knowledge, not from the text).","Saw liberal democracy as a foreign model unsuited to Brazil's dispersed, clan-based society.","Defended state organization of labor and business as the basis of national order.","Check your course pack for his exact wording before quoting; no quotes are given here."],"democracy_angle":"Represents the argument that Brazil needed authority rather than liberal democracy; pair it against testimonies or Vargas's own populist language (Activity 4).","quotes":[],"pairs_well_with":["w09_vargas_suicide_letter","w09_ordinary_people_five_lives","corporatism","estado_novo_coup"],"sources":["course_pack:w09_vianna_why_estado_novo","general","activities/Hist1475_Activity4_F26.md"]},{"id":"w09_ordinary_people_five_lives","short":"'Ordinary People: Five Lives Affected by Vargas-Era Reforms'","author":"Various (testimonies)","title":"Ordinary People: Five Lives Affected by Vargas-Era Reforms","week":9,"kind":"primary","pages":"206-21 (course pack, Brazil Reader 1st ed.)","status":"course_pack_only","context":"Five first-person testimonies from Brazilians of different classes, regions and occupations about how Vargas-era reforms shaped their lives, recorded decades after the events. Text is not on disk.","argument":"Taken together, the testimonies show Vargas's reforms as experienced from below, with mixed and uneven effects; Activity 4 asked whether each speaker viewed Vargas positively, negatively or in a mixed way.","key_points":["Use your own notes from Activity 4 Part 1 for the speaker you analyzed (class, region, occupation, which reform, tone).","Recorded decades later, so memory and hindsight shape what they say (Activity 4 asks you to weigh this).","Useful as a counterweight to elite or official sources (Vianna, Vargas's letter).","No details or quotes are given here because the text is only in the course pack."],"democracy_angle":"Shows how social citizenship under Vargas was felt by ordinary people, and lets you test top-down claims against lived experience.","quotes":[],"pairs_well_with":["w09_vianna_why_estado_novo","w09_vargas_suicide_letter","clt_1943","iaps"],"sources":["course_pack:w09_ordinary_people_five_lives","general","activities/Hist1475_Activity4_F26.md"]},{"id":"w09_vargas_suicide_letter","short":"Vargas, Suicide Letter (1954)","author":"Get\u00falio Vargas","title":"Vargas's Suicide Letter (Carta testamento), 1954","week":9,"kind":"primary","pages":"222-24 (course pack); text from 2nd ed. 380-82","status":"verified_text","context":"Found by his bedside after Vargas shot himself on 24 August 1954 amid a campaign by Carlos Lacerda and military pressure to resign. The typed version released to the press, likely edited by aide Jos\u00e9 Soares Maciel Filho, was read on radio and fueled mass grief.","argument":"Vargas presents himself as the sacrificed defender of the people and the 'humble' against foreign economic groups and domestic enemies who blocked Petrobras, Eletrobr\u00e1s and minimum-wage increases.","key_points":["Frames politics as 'the people' versus foreign and elite 'birds of prey' (classic populism).","Lists his nationalist achievements: Petrobras, Eletrobr\u00e1s, minimum wage, excess-profits law.","Mentions an 'inflationary spiral' destroying the rewards of work, showing inflation was already political.","Turns death into a political weapon: 'my name will be your battle standard.'","Source caution: the typed version differs from the handwritten draft; quotes here are from the 2nd-ed. translation (check against course-pack wording)."],"democracy_angle":"Shows populism's emotional bond with workers and how Vargas framed social rights as a gift from a leader; also shows civilian democracy under threat from coup pressure.","quotes":[{"text":"I returned to govern in the arms of the people.","page":380,"use_for":"Vargas's claim to democratic, popular legitimacy after the 1950 election"},{"text":"They do not want workers to be free. They do not want the people to be independent.","page":381,"use_for":"Populist framing of enemies of workers; nationalism and labor rights"},{"text":"I was a slave of the people and today I am freeing myself for eternal life.","page":382,"use_for":"Self-sacrifice and the martyr image that kept his legacy alive"},{"text":"Serenely, I take my first step on the road to eternity, and I leave life to enter history.","page":382,"use_for":"How Vargas shaped his own memory; legacy beyond 1954"}],"pairs_well_with":["vargas","petrobras_1953","vargas_suicide","w09_vianna_why_estado_novo","w09_ordinary_people_five_lives"],"sources":["readings/w09_vargas_suicide_letter.txt p.380","readings/w09_vargas_suicide_letter.txt p.381","readings/w09_vargas_suicide_letter.txt p.382","slides/HIST1474_Lecture9_F26.md#31"]},{"id":"w10_rio_reader_world_cup_defeat","short":"'A City's Crushing Defeat at the World Cup' (1950)","author":"Jornal do Brasil and Correio da Manh\u00e3","title":"A City's Crushing Defeat at the World Cup","week":10,"kind":"primary","pages":"218-21","status":"verified_text","context":"Newspaper coverage from Rio of the eve and aftermath of Brazil's 2-1 loss to Uruguay in the 1950 World Cup final at the new Maracan\u00e3 stadium (16 July 1950), with an editors' introduction.","argument":"The press portrayed the city's huge excitement and then its collective mourning, blaming the players' lack of 'grit' and Mayor Mendes de Morais.","key_points":["Maracan\u00e3 was built as the world's largest stadium, a symbol of Rio's postwar ambition.","Over 199,000 attended; people from every state and abroad flooded Rio.","After the loss: 'sad silence,' a cancelled Carnaval, 'daybreak on Ash Wednesday.'","Blame fell on players' moral failings and on the mayor; known as the Maracanazo."],"democracy_angle":"Shows the mass urban public of the democratic era and how sport, national pride and politics mixed; contrast with the 1958 victory and JK-era optimism.","quotes":[{"text":"And precisely because they lacked grit. Exclusively because of it.","page":220,"use_for":"How the press moralized national failure"},{"text":"The Carnaval that was planned would not take place.","page":220,"use_for":"Collective mourning; sport as national ritual"},{"text":"It seemed like daybreak on Ash Wednesday.","page":220,"use_for":"Mood of national deflation"},{"text":"Mendes de Morais had the worst luck. He\u2019s the one who got blamed for it all.","page":221,"use_for":"Popular blame directed at politicians; sport as politics"}],"pairs_well_with":["maracanazo","world_cup_1958","pele"],"sources":["readings/w10_rio_reader_world_cup_defeat.txt p.218","readings/w10_rio_reader_world_cup_defeat.txt p.219","readings/w10_rio_reader_world_cup_defeat.txt p.220","readings/w10_rio_reader_world_cup_defeat.txt p.221"]},{"id":"w10_wolfe_autos_progress_ch5","short":"Wolfe, Autos and Progress, ch. 5 (2010)","author":"Joel Wolfe","title":"Autos and Progress: The Brazilian Search for Modernity, ch. 5 'The Multinational Solution: Juscelino Kubitschek and the National Auto Industry'","week":10,"kind":"secondary","pages":"113-43","status":"verified_text","context":"A historian's chapter on how JK (1956-61) built a domestic auto industry with foreign companies, highways and Bras\u00edlia, using polls, ads and company records.","argument":"JK tried to democratize Brazil through development rather than immediate political incorporation: cars, roads, Bras\u00edlia and a well-paid autoworker class were meant to create a middle class and peaceful modern citizenship. 'In some significant ways, the experiment succeeded. In many ways, it failed.'","key_points":["Targets Plan: 30 targets; Target 27 called for 170,000 Brazilian vehicles by 1960; Bras\u00edlia was the 'synthesis goal.'","GEIA incentives and tariffs pushed foreign firms (Willys, VW, Ford, GM) to produce locally; 90-95 percent domestic content by 1960.","Brazilians broadly welcomed foreign automakers (88.5 percent in 1959), unlike the nationalist 'The Oil Is Ours' campaign.","Autoworkers became a 'labor elite' with high wages and benefits; Lula recalled they 'were the elite.'","Bras\u00edlia (opened 21 April 1960) aimed at egalitarian modern citizens but was built by unskilled laborers by hand; SUDENE (1959) had mixed results."],"democracy_angle":"Development was meant to be a path to democracy, but it favored consumers and a labor elite, and left deep divisions that destabilized the 1946 republic.","quotes":[{"text":"He used developmentalist projects in lieu of immediate political incorporation","page":114,"use_for":"JK substituted development for broader political inclusion"},{"text":"Brazilians, in general, are divided into two classes: those who have a car and those who want to have a car.","page":116,"use_for":"Consumer aspirations as the language of modern citizenship (Cruzeiro, 1953)"},{"text":"In some significant ways, the experiment succeeded. In many ways, it failed.","page":135,"use_for":"Balanced evaluation of JK's attempt to democratize through development"},{"text":"The economic situation of Latin America must improve if democracy is going to survive.","page":136,"use_for":"JK's own claim (1958) that development is the precondition of democracy"}],"pairs_well_with":["kubitschek","targets_plan_1956","auto_industry","brasilia_inauguration","abc_strikes"],"sources":["readings/w10_wolfe_autos_progress_ch5.txt p.113","readings/w10_wolfe_autos_progress_ch5.txt p.114","readings/w10_wolfe_autos_progress_ch5.txt p.116","readings/w10_wolfe_autos_progress_ch5.txt p.117","readings/w10_wolfe_autos_progress_ch5.txt p.131","readings/w10_wolfe_autos_progress_ch5.txt p.132","readings/w10_wolfe_autos_progress_ch5.txt p.133","readings/w10_wolfe_autos_progress_ch5.txt p.135","readings/w10_wolfe_autos_progress_ch5.txt p.136","readings/w10_wolfe_autos_progress_ch5.txt p.141","readings/w10_wolfe_autos_progress_ch5.txt p.143"]},{"id":"w11_nascimento_myth_racial_democracy","short":"Nascimento, 'The Myth of Racial Democracy' (1968)","author":"Abdias do Nascimento","title":"The Myth of Racial Democracy","week":11,"kind":"primary","pages":"445-48","status":"verified_text","context":"Published in the left-wing journal Cadernos Brasileiros in 1968, on the 80th anniversary of abolition, shortly before Nascimento left for the US, where AI-5 kept him in exile for 13 years.","argument":"Abolition was 'a fa\u00e7ade'; the slogan of racial democracy soothes the national conscience and presents Brazil as a model abroad while keeping Black Brazilians excluded and docile at home. Black people must organize and pressure to make racial democracy real.","key_points":["Eighty years after 1888, nothing had changed in how Black people lived; freedpeople got starvation and misery.","Racial democracy is a 'pathology of normality'; 'whitening' advocates hoped Black people would disappear.","Indigenous peoples were treated the same way: a federal study found practices to 'liquidate' them in the 1960s (the Figueiredo Report).","Calls for pressure groups and direct action, 'antiracist racism,' and not fearing the label 'black racist.'"],"democracy_angle":"Argues that democracy is not only about elections: a society with racial hierarchy is not a democracy, a critique aimed at the whole society, not just the regime.","quotes":[{"text":"Abolition was a fa\u00e7ade: juridical, theoretical, abstract.","page":446,"use_for":"Legal freedom without real equality; link to 1888"},{"text":"Abroad, it presents our country as a model of racial coexistence; internally, the myth is used to keep black people tricked and docile.","page":446,"use_for":"The myth of racial democracy as a tool of control"},{"text":"to transform the concept of racial democracy into reality.","page":447,"use_for":"Democracy as an unfinished goal requiring struggle"},{"text":"Black people should create pressure groups, instruments for direct action.","page":447,"use_for":"Organized dissent and mobilization as strategy"}],"pairs_well_with":["nascimento","racial_democracy","golden_law","figueiredo_report","w11_lula_may_day_speech"],"sources":["readings/w11_nascimento_myth_racial_democracy.txt p.445","readings/w11_nascimento_myth_racial_democracy.txt p.446","readings/w11_nascimento_myth_racial_democracy.txt p.447","readings/w11_nascimento_myth_racial_democracy.txt p.448","slides/HIST1474_WEEK11_FALL2026.md#15"]},{"id":"w11_lula_may_day_speech","short":"Lula, May Day Speech (1979)","author":"Luiz In\u00e1cio Lula da Silva","title":"Lula's May Day Speech to Brazilian Workers","week":11,"kind":"primary","pages":"489-91","status":"verified_text","context":"Speech at a 1 May 1979 rally during the metalworkers' strikes in greater S\u00e3o Paulo, after union leaders learned Delfim Netto had doctored 1973-74 inflation figures used for wage adjustments, and after the regime intervened in the unions.","argument":"Workers, not wages, were not to blame for inflation; after fifteen years of wage repression, workers must take back the right to strike and union autonomy, and their movement now leads Brazilian society.","key_points":["Rejects the regime's claim that wages cause inflation: wages held down for 15 years, yet inflation stayed high.","Attacks the end of job stability (replaced by a severance fund) and real-wage losses.","Calls for taking rights, not asking: the right to strike and free, autonomous unions.","'A union is not a building': the movement survives state intervention; the weapon is to 'stop the machines.'","Claims all of society is on the workers' side; the strikes led to the founding of the PT."],"democracy_angle":"Democratization from below: workers defied the regime's labor controls and redefined democracy to include economic rights and independent organization.","quotes":[{"text":"They say that inflation has been caused by the wages of working people.","page":489,"use_for":"Workers rejecting the regime's economic justification for wage repression"},{"text":"Not just to ask for the freedom and autonomy of trade unions but to force the freedom and autonomy of trade unions?","page":490,"use_for":"Taking rights rather than receiving them from the state (contrast Vargas)"},{"text":"a union is not a building; a union is the worker inside the factory and the laborer in the public square.","page":491,"use_for":"Union independence from the corporatist state"},{"text":"the only weapon you use is to stop the machines.","page":491,"use_for":"The strike as the decisive form of dissent"}],"pairs_well_with":["lula","abc_strikes","pt_founded","w11_teixeira_living_with_inflation","auto_industry"],"sources":["readings/w11_lula_may_day_speech.txt p.489","readings/w11_lula_may_day_speech.txt p.490","readings/w11_lula_may_day_speech.txt p.491","slides/HIST1474_WEEK11_FALL2026.md#26"]},{"id":"w11_teixeira_living_with_inflation","short":"Teixeira, 'Living with Inflation' (2025)","author":"Melissa Teixeira","title":"Living with Inflation: Policymaking and Popular Practices in Search of Price Stability after Brazil's Economic Miracle","week":11,"kind":"secondary","pages":"153-87","status":"verified_text","context":"Article by the course professor (Radical History Review, 2025) tracing inflation policy and everyday coping from the 1964 coup through the Plano Cruzado and the 1988 Constitution.","argument":"Inflation was central to both making and dismantling the economic miracle. The regime chose to 'live with' inflation through indexation and wage repression, which bought middle-class support but became its greatest liability; inflation turned prices into a question of government accountability and a cornerstone of democracy itself.","key_points":["The regime blamed past inflation on democracy and workers' wage demands; Campos argued frequent elections undermined anti-inflation policy.","PAEG wage formula and falsified inflation numbers cut real wages (Rio minimum wage -38 percent, 1964-70); the miracle coincided with the most violent years.","'Say No to Inflation' (1973) put the burden on housewives; the Cost of Living Movement turned carestia into pro-democracy protest (1978 petition, over 1 million signatures).","Debt crisis, recession and hyperinflation (1,118 percent in 1988) shaped the transition; the Plano Cruzado's price freeze and 'fiscais do Sarney' briefly worked, then failed.","The 1988 Constitution affirmed economic rights but did not include protections against inflation."],"democracy_angle":"Shows that economic legitimacy propped up the dictatorship and that democracy's meaning in the 1980s included fair prices and economic justice, not just elections.","quotes":[{"text":"weaving a narrative that democracy was bad for economic stability","page":153,"use_for":"How the regime justified dictatorship with economic performance"},{"text":"As inflation accelerated throughout the century, it transformed price from a standard-of-living issue into a question of government accountability","page":156,"use_for":"Inflation as a democratic issue"},{"text":"support from a growing middle class that accepted this authoritarian system in exchange for an improved standard of living","page":160,"use_for":"Why the dictatorship lasted: civilian support bought by growth"},{"text":"The military dictatorship used inflation to sustain its economic miracle, and this strategy became its greatest liability.","page":163,"use_for":"Why the regime lost legitimacy in the 1970s"}],"pairs_well_with":["economic_miracle","paeg_wage_formula","say_no_to_inflation","cost_of_living_movement","plano_cruzado","w11_lula_may_day_speech"],"sources":["readings/w11_teixeira_living_with_inflation.txt p.153","readings/w11_teixeira_living_with_inflation.txt p.156","readings/w11_teixeira_living_with_inflation.txt p.158","readings/w11_teixeira_living_with_inflation.txt p.160","readings/w11_teixeira_living_with_inflation.txt p.163","readings/w11_teixeira_living_with_inflation.txt p.166","readings/w11_teixeira_living_with_inflation.txt p.168","readings/w11_teixeira_living_with_inflation.txt p.171","readings/w11_teixeira_living_with_inflation.txt p.174","readings/w11_teixeira_living_with_inflation.txt p.176","readings/w11_teixeira_living_with_inflation.txt p.177"]},{"id":"w11_film_ainda_estou_aqui","short":"Ainda Estou Aqui (I'm Still Here), film (2024)","author":"Walter Salles (dir.)","title":"Ainda Estou Aqui (I'm Still Here)","week":11,"kind":"film","pages":"film, 137 min","status":"film","context":"Feature film based on Marcelo Rubens Paiva's 2015 memoir about his family. Set in Rio in 1970-71, with Fernanda Torres as Eunice Paiva and Selton Mello as Rubens Paiva. It won the 2025 Oscar for Best International Feature, Brazil's first.","argument":"Through one family, the film shows how state terror entered everyday middle-class life and how Eunice's quiet, persistent refusal to accept official silence became a lifelong form of dissent.","key_points":["Opening: the Paiva family's lively, open home in Rio, where the dictatorship at first seems distant.","January 1971: plainclothes agents take Rubens from the house; Eunice and a daughter are later detained and interrogated.","Eunice searches for answers while the regime denies holding him; she keeps the family together and refuses to look like a victim (the family smiles for a press photo).","Later she becomes a lawyer and Indigenous rights advocate and wins his death certificate in 1996, 25 years later.","Activity 5: evaluate how effective her dissent was and what it shows about everyday dissent."],"democracy_angle":"Shows the limits of dissent under dictatorship (no immediate result) and its long-term power: memory and legal persistence forced the democratic state to acknowledge the crime.","quotes":[],"pairs_well_with":["rubens_paiva_disappearance","eunice_paiva","rubens_paiva","amnesty_1979","chico_buarque"],"sources":["readings/w11_film_ainda_estou_aqui.md","activities/Hist1475_Activity5_F26.md","general"]},{"id":"w12_mccann_pavao_pavaozinho","short":"McCann, 'Pav\u00e3o-Pav\u00e3ozinho, Leonel Brizola and Favela Upgrading, 1983' (2025)","author":"Bryan McCann","title":"Pav\u00e3o-Pav\u00e3ozinho, Leonel Brizola and Favela Upgrading, 1983 (Rio de Janeiro: Ten Moments, ch. 8)","week":12,"kind":"secondary","pages":"191-218","status":"verified_text","context":"Historian's chapter on Governor Leonel Brizola's response to the 24 December 1983 mudslide in a Rio favela, set against redemocratization, Diretas J\u00e1 and hyperinflation, using oral histories of the planners.","argument":"The upgrading of Pav\u00e3o-Pav\u00e3ozinho was possible only in the window of redemocratization and embodied its aspirations: it declared favela residents rights-bearing citizens, but it remained partial and fragile because of hyperinflation, Sarney's hostility, drug trafficking and Moreira Franco's reversal in 1986.","key_points":["Brizola won in 1982 thanks to favela voters, informal workers unlike Vargas's unionized base; 'brown socialism' targeted Brazilians of color.","Linked projects: funicular cable car, CIEP school in an abandoned hotel, road, water, sewage, electricity, and 'Every Family One Plot' titling.","Titling mostly stopped at a 'Term of Commitment,' legally weak but socially vital as protection from removal.","Community policing under Colonel Nazareth Cerqueira (first Black secretary in Rio) faced police resistance and rising drug trafficking.","Moreira Franco (1986) dismantled programs, but much endured and ended the era of favela removal (until the 2016 Olympics)."],"democracy_angle":"Shows democracy expanding citizenship to the urban poor at the local level, and how economic crisis and political rivalry limited it.","quotes":[{"text":"Favelas did not need to be removed. They could be transformed into thriving neighborhoods.","page":196,"use_for":"The democratic alternative to the military's favela removal"},{"text":"The movement for urban reform became a vanguard in the struggle for redemocratization.","page":195,"use_for":"Grassroots movements driving the transition"},{"text":"These projects were transformative without ever being complete.","page":209,"use_for":"Achievements and limits of democratic reform"},{"text":"It made a statement that favela residents were rights-bearing citizens, eligible for the same public benefits, programs and investments as residents of formal neighborhoods.","page":218,"use_for":"Citizenship for the urban poor as the goal of the new democracy"}],"pairs_well_with":["brizola","pavao_mudslide","elections_1982","diretas_ja","favela_removal","w12_teixeira_health_care_human_right"],"sources":["readings/w12_mccann_pavao_pavaozinho.txt p.191","readings/w12_mccann_pavao_pavaozinho.txt p.194","readings/w12_mccann_pavao_pavaozinho.txt p.195","readings/w12_mccann_pavao_pavaozinho.txt p.196","readings/w12_mccann_pavao_pavaozinho.txt p.202","readings/w12_mccann_pavao_pavaozinho.txt p.209","readings/w12_mccann_pavao_pavaozinho.txt p.211","readings/w12_mccann_pavao_pavaozinho.txt p.212","readings/w12_mccann_pavao_pavaozinho.txt p.216","readings/w12_mccann_pavao_pavaozinho.txt p.217","readings/w12_mccann_pavao_pavaozinho.txt p.218"]},{"id":"w12_teixeira_health_care_human_right","short":"Teixeira, 'Health Care as a Human Right' (c. 2020)","author":"Melissa Teixeira","title":"Health Care as a Human Right: Reflections on Brazil's 1988 Constitution during a Pandemic","week":12,"kind":"secondary","pages":"web essay (no page numbers)","status":"verified_text","context":"Web essay by the course professor (Harvard Center for History and Economics, c. 2020) written during COVID-19, on the origins of the SUS in the transition to democracy.","argument":"The 1988 Constitution is not a lesson that a constitution can fix social problems, but a reminder of 'the generative power of crises': amid dictatorship's end, inflation and debt, civil society made universal health care a cornerstone of democracy.","key_points":["Article 196: health is a right of all and a duty of the State; the Constitution created the SUS (Law 8.080, 1990).","The dictatorship was legalistic (Institutional Acts, 1967 Constitution); Ulysses Guimar\u00e3es at promulgation: 'We hate dictatorship. Hate and disgust.'","559 delegates (26 women), but much work happened outside: the 8th National Health Conference (1986), a women's health conference, letters to delegates.","Ended Vargas-era stratified citizenship (IAPs by profession, excluding rural, domestic and informal workers labeled indigentes).","Limits: underfunding, a 2016 spending cap, weak federal COVID coordination; favela mutual aid filled gaps."],"democracy_angle":"Democracy built from below produced universal social rights, a sharp contrast with Vargas's top-down, stratified citizenship, though promise and practice still diverge.","quotes":[{"text":"Health is a right to be enjoyed by all and a duty of the State","page":null,"use_for":"Article 196: universal social citizenship in 1988"},{"text":"We hate dictatorship. Hate and disgust.","page":null,"use_for":"Ulysses Guimar\u00e3es on the democratic break (slide translation: 'We have hatred for dictatorships. Hatred and disgust.')"},{"text":"The 1988 Constitution thus did away with the ways in which citizenship had previously been stratified in Brazil","page":null,"use_for":"Contrast with Vargas-era IAPs; change over time in citizenship"},{"text":"Rather, it is a reminder of the generative power of crises.","page":null,"use_for":"Teixeira's thesis: crisis opened space for new democratic practices"}],"pairs_well_with":["constitution_1988","sus","iaps","health_conference_1986","ulysses_guimaraes","w12_mccann_pavao_pavaozinho"],"sources":["readings/w12_teixeira_health_care_human_right.txt","slides/Hist1475_Lecture13_F26.md#12","slides/Hist1475_Lecture13_F26.md#13"]}],"themes":[{"id":"development_vs_democracy","title":"Development versus democracy","claim":"From Vargas to the generals, Brazilian rulers repeatedly justified limiting democracy as the price of rapid development, while JK briefly argued development would itself produce democracy.","evidence":["estado_novo_coup","volta_redonda","loewenstein","targets_plan_1956","w10_wolfe_autos_progress_ch5","economic_miracle","roberto_campos","w11_teixeira_living_with_inflation"],"complication":"Development under democracy (JK) was as fast as under dictatorship, and the miracle's collapse shows authoritarian growth was not more stable."},{"id":"citizenship_above_below","title":"Citizenship from above versus from below","claim":"Vargas granted social rights from above to formal urban workers through a corporatist state, while the 1980s transition won universal rights from below through strikes, social movements and petitions.","evidence":["clt_1943","corporatism","iaps","w09_vargas_suicide_letter","w11_lula_may_day_speech","abc_strikes","health_conference_1986","constitution_1988","w12_teixeira_health_care_human_right"],"complication":"Vargas's reforms were also shaped by popular pressure (queremismo, his 1950 election), and the 1988 Constitution was still negotiated by elites in an assembly."},{"id":"authoritarian_legalism_theme","title":"Law as a tool of dictatorship","claim":"Both the Estado Novo and the military regime ruled through constitutions and decrees, so legality itself became a weapon against democracy, and dismantling those laws was central to 1988.","evidence":["estado_novo_coup","ai1_1964","ai5","constitution_1967","authoritarian_legalism","institutional_acts","constitution_1988"],"complication":"Keeping a fa\u00e7ade of legality (Congress, elections, courts) also gave the opposition openings, such as the MDB's 1974 gains and Eunice Paiva's legal fight."},{"id":"inflation_legitimacy","title":"Inflation and political legitimacy","claim":"Inflation repeatedly made and unmade governments: it helped topple the populist republic in 1964, the miracle's low inflation legitimized the dictatorship, and inflation's return discredited both the generals and Sarney.","evidence":["vargas_elected_1950","goulart_presidency","coup_1964","economic_miracle","say_no_to_inflation","cost_of_living_movement","plano_cruzado","hyperinflation","w11_teixeira_living_with_inflation"],"complication":"Inflation alone did not cause regime change; Teixeira warns it is an oversimplification to say inflation triggered the 1964 coup."},{"id":"dissent_limits","title":"The effectiveness and limits of dissent","claim":"Dissent under the dictatorship rarely changed policy in the moment, but music, student protest, Black activism, family persistence and strikes eroded the regime's legitimacy and built the networks that drove the transition.","evidence":["march_100000","apesar_de_voce_1970","calice_1978","w11_nascimento_myth_racial_democracy","w11_film_ainda_estou_aqui","abc_strikes","diretas_ja","eunice_paiva"],"complication":"The regime survived 21 years and set the terms of its exit (amnesty, indirect election), so economic collapse may explain the transition better than resistance."},{"id":"exclusion_persists","title":"Who was left out: race, region, favela and Indigenous peoples","claim":"Each democratic opening left groups outside full citizenship: informal and rural workers under Vargas, satellite-city workers in Bras\u00edlia, Black Brazilians under the racial democracy myth, Indigenous peoples and favela residents.","evidence":["iaps","satellite_cities","racial_democracy","w11_nascimento_myth_racial_democracy","figueiredo_report","favela_removal","w12_mccann_pavao_pavaozinho","w12_teixeira_health_care_human_right"],"complication":"The 1988 Constitution was the first to name racial, socioeconomic and regional inequality and commit to reducing it, and Brizola's programs show real (if partial) inclusion."}],"prompts":[{"id":"p1","prompt":"To what extent did ordinary Brazilians gain meaningful citizenship between 1930 and 1988? Compare the Vargas era with the transition to democracy.","why_likely":"It matches the course title and the professor's own essay contrasting Vargas-era IAPs with the 1988 SUS.","theses":[{"text":"Citizenship expanded from a narrow, state-granted set of rights for formal urban workers under Vargas to universal rights won from below in 1988, because workers and social movements organized independently of the state.","points":[{"claim":"Vargas's labor code and IAPs gave real rights but tied them to profession and state-controlled unions.","evidence":["clt_1943","iaps","corporatism"]},{"claim":"Under dictatorship, workers and movements created independent organization (ABC strikes, Cost of Living Movement).","evidence":["abc_strikes","w11_lula_may_day_speech","cost_of_living_movement"]},{"claim":"The 1988 Constitution and SUS ended stratified citizenship, shaped by petitions and the 1986 health conference.","evidence":["constitution_1988","sus","health_conference_1986","w12_teixeira_health_care_human_right"]}]},{"text":"Social citizenship expanded but political citizenship lagged until the 1980s, and both remained limited by race and class, so gains were real but partial.","points":[{"claim":"Vargas traded political freedom for social rights (Estado Novo).","evidence":["estado_novo_coup","vargas","w09_vargas_suicide_letter"]},{"claim":"The 1946 democracy and the dictatorship excluded many from rights and voice (two-party system, AI-5).","evidence":["ai2_two_parties","ai5"]},{"claim":"Even after 1988, racial and favela exclusion persisted.","evidence":["w11_nascimento_myth_racial_democracy","w12_mccann_pavao_pavaozinho","racial_democracy"]}]}],"pitfalls":["Do not treat the Vargas era as purely negative: his reforms built real popular loyalty.","Define citizenship (civil, political, social) early and use it consistently."]},{"id":"p2","prompt":"Did economic development strengthen or undermine democracy in Brazil between 1930 and 1985?","why_likely":"Week 10's key points open with 'Development & Democracy,' and both Wolfe and Teixeira make development-democracy arguments.","theses":[{"text":"Rapid state-led development undermined democracy because every major push (Estado Novo, the miracle) was paired with authoritarian rule and its costs fell on workers.","points":[{"claim":"Vargas's industrialization (Volta Redonda) came under dictatorship.","evidence":["volta_redonda","estado_novo_coup","loewenstein"]},{"claim":"The miracle depended on wage repression during the years of lead.","evidence":["economic_miracle","paeg_wage_formula","w11_teixeira_living_with_inflation"]},{"claim":"Technocrats like Campos argued elections endangered stability.","evidence":["roberto_campos","bureaucratic_authoritarianism"]}]},{"text":"Development had contradictory effects: it built the middle class and labor elite that first supported authoritarianism and later demanded democracy when growth failed.","points":[{"claim":"JK's autos and Bras\u00edlia sought democracy through development but created a consumer middle class and labor elite.","evidence":["w10_wolfe_autos_progress_ch5","auto_industry","brasilia_inauguration"]},{"claim":"Middle-class support for the regime was bought with growth.","evidence":["w11_teixeira_living_with_inflation","coup_1964","camde"]},{"claim":"When the miracle unraveled, autoworkers and the middle class turned against the regime.","evidence":["oil_shock_1973","abc_strikes","debt_default_1983","diretas_ja"]}]}],"pitfalls":["Avoid treating 'development' as only GDP; include who benefited (inequality charts, wage data).","Do not claim dictatorship was simply better at growth; use Loewenstein and the miracle's collapse."]},{"id":"p3","prompt":"How effective were strategies of dissent in undermining the legitimacy of the military dictatorship (1964-85), given how durable the regime proved to be?","why_likely":"This is almost word-for-word the Activity 5 Part 2 question.","theses":[{"text":"Dissent was limited in the short term but effective over time because it exposed the regime's lies and built the networks that turned economic crisis into a democratic movement.","points":[{"claim":"Artists kept a democratic imagination alive despite censorship and exile.","evidence":["apesar_de_voce_1970","calice_1978","caetano_veloso"]},{"claim":"Eunice Paiva's legal persistence forced eventual state acknowledgment.","evidence":["w11_film_ainda_estou_aqui","eunice_paiva","rubens_paiva_disappearance"]},{"claim":"Workers and movements used the regime's economic failure to mobilize millions.","evidence":["w11_lula_may_day_speech","abc_strikes","cost_of_living_movement","diretas_ja"]}]},{"text":"Dissent mattered less than the regime's own economic collapse and choices: repression crushed open protest after 1968, and the military controlled the pace and terms of transition.","points":[{"claim":"AI-5 ended student protest and legal opposition; armed struggle was crushed.","evidence":["march_100000","ai5","armed_struggle"]},{"claim":"The regime began opening on its own terms (distens\u00e3o, amnesty protecting agents).","evidence":["geisel","distensao_abertura","amnesty_1979"]},{"claim":"Diretas J\u00e1 failed in its goal; the electoral college chose the president.","evidence":["diretas_ja","tancredo_sarney_1985"]}]}],"pitfalls":["Define 'effective' (changing policy, eroding legitimacy, building future movements).","Use Nascimento carefully: he targets racism in society as a whole, not only the regime."]},{"id":"p4","prompt":"Why did the military dictatorship last twenty-one years?","why_likely":"Week 11 key points ask 'Why civilian support for dictatorship?' and stress bureaucratic authoritarianism and authoritarian legalism.","theses":[{"text":"The regime lasted because it combined legal fa\u00e7ades, economic success and civilian support with targeted repression, rather than relying on force alone.","points":[{"claim":"Authoritarian legalism (Institutional Acts, 1967 Constitution, two parties) gave it a lawful appearance.","evidence":["authoritarian_legalism","ai1_1964","ai2_two_parties","constitution_1967"]},{"claim":"The miracle won industrialists and the middle class.","evidence":["economic_miracle","w11_teixeira_living_with_inflation","camde"]},{"claim":"Repression after AI-5 removed the most dangerous opposition.","evidence":["ai5","anos_de_chumbo","rubens_paiva_disappearance"]}]},{"text":"It lasted because it ruled as an institution rather than a strongman, rotating generals and managing its own exit.","points":[{"claim":"Bureaucratic authoritarianism and technocracy depersonalized rule.","evidence":["bureaucratic_authoritarianism","castelo_branco","delfim_netto"]},{"claim":"Generals rotated in office, avoiding a single target for opposition.","evidence":["medici","geisel","joao_figueiredo"]},{"claim":"Abertura and amnesty let the regime negotiate rather than collapse.","evidence":["distensao_abertura","amnesty_1979","tancredo_sarney_1985"]}]}],"pitfalls":["Do not ignore civilian complicity (CAMDE, industrialists, the US).","Remember the regime claimed to defend democracy (AI-1/AI-5 preamble)."]},{"id":"p5","prompt":"Was Brazil's transition to democracy (1974-1988) driven more from above or from below?","why_likely":"Week 12 centers on the transition, and both McCann and Teixeira stress popular participation.","theses":[{"text":"The transition began from above but was pushed further by pressure from below, which shaped its timing and especially the content of the 1988 Constitution.","points":[{"claim":"Geisel's distens\u00e3o and Figueiredo's abertura were planned as slow and controlled.","evidence":["geisel","distensao_abertura","joao_figueiredo"]},{"claim":"Strikes, cost-of-living protests and urban movements forced the pace.","evidence":["abc_strikes","cost_of_living_movement","w12_mccann_pavao_pavaozinho"]},{"claim":"Popular petitions and conferences shaped the 1988 rights (SUS).","evidence":["health_conference_1986","constitution_1988","w12_teixeira_health_care_human_right"]}]},{"text":"The transition was largely controlled from above: elites negotiated an indirect election that installed a regime ally, and amnesty shielded the military.","points":[{"claim":"Diretas J\u00e1 failed; the electoral college chose Tancredo.","evidence":["diretas_ja","tancredo_neves"]},{"claim":"Sarney, a regime ally, became the first civilian president.","evidence":["sarney","tancredo_sarney_1985"]},{"claim":"Amnesty protected agents of repression.","evidence":["amnesty_1979","w11_film_ainda_estou_aqui"]}]}],"pitfalls":["Avoid a false either/or; argue a weighted answer.","Use dates precisely: 1974, 1979, 1982, 1984, 1985, 1988."]},{"id":"p6","prompt":"Was Get\u00falio Vargas a dictator or a champion of the people? Use conflicting sources to build your argument.","why_likely":"Activity 4 asked students to build questions from conflicting Vargas-era sources (Vianna, testimonies, the suicide letter).","theses":[{"text":"Vargas was both: he expanded social rights for workers while destroying political freedom, and the conflict between his sources shows how he fused paternalism and authoritarianism.","points":[{"claim":"The suicide letter presents him as the people's martyr.","evidence":["w09_vargas_suicide_letter","vargas_suicide"]},{"claim":"The Estado Novo and its Red Scare suppressed opponents; Vianna defended authority over liberal democracy.","evidence":["estado_novo_coup","red_scare","w09_vianna_why_estado_novo"]},{"claim":"Labor laws helped urban workers but excluded rural and informal workers.","evidence":["clt_1943","iaps","w09_ordinary_people_five_lives"]}]},{"text":"Vargas's popularity rested on real material gains, which is why he could return by election in 1950, making him a populist democrat after 1945 as much as a dictator before it.","points":[{"claim":"Queremismo and the 1950 election show genuine support.","evidence":["queremismo","vargas_elected_1950"]},{"claim":"Petrobras and economic nationalism mobilized mass campaigns.","evidence":["petrobras_1953","economic_nationalism"]},{"claim":"Songs show popular hopes and frustrations over prices (Minist\u00e9rio da Economia, Ai Geg\u00ea).","evidence":["vargas","carestia"]}]}],"pitfalls":["Note source limits: the typed suicide letter was likely edited; testimonies were recorded decades later.","Do not quote Vianna or the testimonies unless you have the course-pack text."]},{"id":"p7","prompt":"How did inflation shape Brazilian politics and the meaning of democracy from the 1950s to 1988?","why_likely":"Inflation appears in every post-midterm deck and is the subject of the professor's own article.","theses":[{"text":"Inflation turned prices into a question of government accountability, legitimizing the dictatorship when it fell and discrediting both military and civilian governments when it rose.","points":[{"claim":"Rising prices fed opposition to Vargas and Goulart and support for the 1964 coup.","evidence":["vargas_elected_1950","goulart_presidency","coup_1964","camde"]},{"claim":"The miracle's low inflation rested on falsified numbers and wage repression; exposure fueled protest.","evidence":["say_no_to_inflation","paeg_wage_formula","cost_of_living_movement","w11_lula_may_day_speech"]},{"claim":"Hyperinflation and the failed Plano Cruzado eroded trust in the young democracy.","evidence":["plano_cruzado","hyperinflation","fiscais_do_sarney"]}]},{"text":"Inflation broadened the meaning of democracy to include economic justice, as movements demanded fair prices, wages and services as citizens' rights.","points":[{"claim":"The Cost of Living Movement defined carestia to include housing, schooling, health and rest.","evidence":["cost_of_living_movement","carestia"]},{"claim":"Lula's strikers rejected the claim that wages caused inflation.","evidence":["w11_lula_may_day_speech","abc_strikes"]},{"claim":"The Constitution affirmed economic rights though not inflation protections.","evidence":["constitution_1988","w11_teixeira_living_with_inflation"]}]}],"pitfalls":["Avoid monocausal claims (Teixeira says inflation did not simply cause the 1964 coup).","Use a few exact numbers only: about 100 percent (1964), 16 percent official (1973), 1,118 percent (1988)."]},{"id":"p8","prompt":"How complete was Brazil's democracy after 1985? Assess its achievements and limits.","why_likely":"The last lecture ends with Lula, Bolsonaro and 'Brazil a racial democracy?', and the readings stress promise versus practice.","theses":[{"text":"The New Republic achieved formal democracy and universal social rights, but racial, regional and class inequalities kept citizenship incomplete in practice.","points":[{"claim":"1988 Constitution and SUS: universal rights and dismantling of the dictatorship's legal order.","evidence":["constitution_1988","sus","w12_teixeira_health_care_human_right"]},{"claim":"Favela upgrading showed inclusion but was fragile and reversed.","evidence":["w12_mccann_pavao_pavaozinho","favela_removal","brizola"]},{"claim":"Racial democracy remained a myth; underfunding and austerity limited SUS.","evidence":["racial_democracy","w11_nascimento_myth_racial_democracy","sus"]}]},{"text":"Brazil's democracy proved resilient by surviving hyperinflation, an impeachment and far-right populism through constitutional means.","points":[{"claim":"It survived hyperinflation and stabilized with the Plano Real.","evidence":["hyperinflation","plano_real"]},{"claim":"It removed Collor constitutionally in 1992.","evidence":["collor_impeachment","collor"]},{"claim":"It brought a former strike leader to power and returned him after Bolsonaro.","evidence":["lula_elected","lula","bolsonaro"]}]}],"pitfalls":["Keep most evidence in 1985-1988 (the exam covers the transition); use later events briefly.","Tie back to the course theme of the long struggle for democracy."]}],"connections":[{"from":"cafe_com_leite","to":"revolution_1930","link":"The Depression ended the caf\u00e9 com leite oligarchy, and Vargas replaced it with a centralized state: oligarchic republic to strong-state politics."},{"from":"iaps","to":"sus","link":"Vargas's profession-based IAPs excluded rural, domestic and informal workers; the 1988 SUS made health universal (Teixeira)."},{"from":"constitution_1934","to":"constitution_1988","link":"Social rights first appeared in 1934 without universal suffrage; 1988 joined universal social rights with full political rights."},{"from":"volta_redonda","to":"targets_plan_1956","link":"JK built on the Vargas framework (Volta Redonda, Petrobras) but opened the economy to multinational automakers (Wolfe)."},{"from":"petrobras_1953","to":"auto_industry","link":"Vargas's 'The Oil Is Ours' nationalism contrasts with broad public support for foreign auto companies under JK (Wolfe)."},{"from":"fordlandia","to":"automobility","link":"Ford's failed Amazon rubber town (1928) versus Brazil producing its own cars by 1960: from foreign extraction to domestic industry."},{"from":"auto_industry","to":"abc_strikes","link":"The foreign auto plants JK brought to S\u00e3o Bernardo created the labor elite whose strikes in 1978-80 challenged the dictatorship."},{"from":"corporatism","to":"paeg_wage_formula","link":"The military used the Vargas-era state labor structure to discipline workers and set wages by formula (Wolfe, Teixeira)."},{"from":"vargas","to":"brizola","link":"Brizola left Brazil as a Vargas-style labor populist and returned to court the informal, non-white urban poor (McCann)."},{"from":"golden_law","to":"racial_democracy","link":"Nascimento wrote in 1968, 80 years after the Golden Law, that abolition had been a fa\u00e7ade and racial democracy a myth."},{"from":"figueiredo_report","to":"w11_nascimento_myth_racial_democracy","link":"Nascimento's reference to a federal study on 'liquidating' Indigenous peoples matches the 1967 Figueiredo Report."},{"from":"say_no_to_inflation","to":"fiscais_do_sarney","link":"Both the regime (1973) and Sarney (1986) enlisted housewives to police prices, an older tactic reused in democracy (Teixeira)."},{"from":"cost_of_living_movement","to":"plano_cruzado","link":"Price freezes demanded by the Cost of Living Movement in the 1970s became official policy in the 1986 Plano Cruzado."},{"from":"cost_of_living_movement","to":"health_conference_1986","link":"Both defined well-being broadly (housing, schooling, health care), linking 1970s protest to 1980s social rights."},{"from":"ai5","to":"constitution_1988","link":"The 1988 Constitution set out to dismantle the Institutional Acts; Ulysses Guimar\u00e3es: 'We hate dictatorship.'"},{"from":"favela_removal","to":"pavao_mudslide","link":"Military-era removal gave way to Brizola's upgrading after the 1983 mudslide."},{"from":"economic_miracle","to":"diretas_ja","link":"The miracle's collapse into debt and inflation turned the middle class toward democracy (McCann, Teixeira)."},{"from":"maracanazo","to":"world_cup_1958","link":"National defeat in 1950 turned into triumph in 1958, matching JK-era optimism."},{"from":"vargas_suicide","to":"fhc","link":"Vargas left life to 'enter history'; in 1995 FHC announced the 'end of the Vargas era,' and a newspaper replied that it was 'the end that does not end.'"}],"flashcards":[{"id":"fc_1930","front":"1930","back":"Revolution of 1930: Vargas takes power by revolt after the Depression, ending caf\u00e9 com leite rule. Matters for democracy: oligarchy ended, but by force rather than votes.","tags":["week9","date"],"ref":"revolution_1930"},{"id":"fc_1937","front":"10 November 1937","back":"Vargas's Estado Novo self-coup and new constitution; the 1938 election is cancelled. Matters for democracy: eight years of dictatorship with social rights but no elections.","tags":["week9","date"],"ref":"estado_novo_coup"},{"id":"fc_1943","front":"1943","back":"CLT labor code gathers minimum wage, labor courts and state unions. Matters for democracy: social rights for urban formal workers, delivered through state control.","tags":["week9","date"],"ref":"clt_1943"},{"id":"fc_1945","front":"1945","back":"Military removes Vargas despite queremismo protests; 1946 democracy begins. Matters for democracy: the army becomes the arbiter of politics.","tags":["week9","date"],"ref":"vargas_ousted_1945"},{"id":"fc_1953","front":"1953","back":"Petrobras created after the 'O petr\u00f3leo \u00e9 nosso' campaign. Matters for democracy: economic nationalism as mass mobilization.","tags":["week9","date"],"ref":"petrobras_1953"},{"id":"fc_1954","front":"24 August 1954","back":"Vargas dies by suicide; his testament letter sparks mass grief. Matters for democracy: martyrdom bound workers to his legacy and showed how fragile civilian rule was.","tags":["week9","date"],"ref":"vargas_suicide"},{"id":"fc_1956","front":"1956-1961","back":"Kubitschek's presidency: Targets Plan, auto industry, Bras\u00edlia. Matters for democracy: he argued development was the precondition for democracy.","tags":["week10","date"],"ref":"targets_plan_1956"},{"id":"fc_1960","front":"21 April 1960","back":"Bras\u00edlia inaugurated. Matters for democracy: a modernist capital meant to make equal citizens, while its builders lived in satellite cities.","tags":["week10","date"],"ref":"brasilia_inauguration"},{"id":"fc_1964","front":"31 March-1 April 1964","back":"Military coup deposes Goulart. Matters for democracy: ends the 1946 republic and begins 21 years of military rule with civilian support.","tags":["week11","date"],"ref":"coup_1964"},{"id":"fc_1968","front":"13 December 1968","back":"AI-5: Congress recessed, habeas corpus suspended for political crimes, censorship expanded. Matters for democracy: ends legal opposition and opens the years of lead.","tags":["week11","date"],"ref":"ai5"},{"id":"fc_1968_73","front":"1968-1973","back":"The economic miracle: about 10 percent annual growth. Matters for democracy: growth bought middle-class support during the most violent repression.","tags":["week11","date"],"ref":"economic_miracle"},{"id":"fc_1974","front":"1974","back":"Geisel begins distens\u00e3o; the MDB wins far more seats than expected. Matters for democracy: even controlled elections became protest votes.","tags":["week11","date"],"ref":"elections_1974"},{"id":"fc_1979","front":"1979","back":"Amnesty, return of exiles, end of the two-party system, ABC strikes and second oil shock. Matters for democracy: opening widens, but amnesty shields torturers.","tags":["week11","date"],"ref":"amnesty_1979"},{"id":"fc_1983","front":"1983","back":"Brazil defaults on its foreign debt; inflation tops 200 percent. Matters for democracy: economic collapse turns even the middle class against the regime.","tags":["week12","date"],"ref":"debt_default_1983"},{"id":"fc_1984","front":"1984","back":"Diretas J\u00e1 rallies of over a million demand direct presidential elections. Matters for democracy: failed immediately but made the transition participatory.","tags":["week12","date"],"ref":"diretas_ja"},{"id":"fc_1985","front":"1985","back":"Electoral college picks Tancredo Neves; he dies, so Jos\u00e9 Sarney becomes president. Matters for democracy: civilian rule returns through an indirect elite deal.","tags":["week12","date"],"ref":"tancredo_sarney_1985"},{"id":"fc_1986","front":"28 February 1986","back":"Plano Cruzado: price freeze, new currency, fiscais do Sarney. Matters for democracy: citizen participation at first, then failure eroded trust in the new democracy.","tags":["week12","date"],"ref":"plano_cruzado"},{"id":"fc_1988","front":"5 October 1988","back":"1988 Citizen Constitution promulgated, guaranteeing universal rights including health (SUS). Matters for democracy: dismantles the dictatorship's legal order and ends stratified citizenship.","tags":["week12","date"],"ref":"constitution_1988"},{"id":"fc_vargas","front":"Get\u00falio Vargas","back":"President 1930-45 (dictator from 1937) and 1951-54. Built labor laws, Volta Redonda and Petrobras; died by suicide. Matters for democracy: social citizenship from above without political freedom.","tags":["week9","person"],"ref":"vargas"},{"id":"fc_vianna","front":"Oliveira Vianna","back":"Jurist and leading defender of authoritarian corporatism; argued imported liberal institutions did not fit Brazil. Matters for democracy: intellectual case for authority over liberal democracy.","tags":["week9","person"],"ref":"oliveira_vianna"},{"id":"fc_loewenstein","front":"Karl Loewenstein","back":"Author of Brazil Under Vargas (1942): authoritarian regimes are better at advertising progress than proving it. Matters for democracy: undercuts the claim that dictatorship delivers development.","tags":["week9","person"],"ref":"loewenstein"},{"id":"fc_jk","front":"Juscelino Kubitschek (JK)","back":"President 1956-61: Fifty Years in Five, auto industry, Bras\u00edlia. Matters for democracy: elected developmentalist who believed growth would make democracy stable.","tags":["week10","person"],"ref":"kubitschek"},{"id":"fc_pele","front":"Pel\u00e9","back":"Scored in all three knockout games as Brazil won the 1958 World Cup. Matters for democracy: symbol of postwar national optimism and a Black national hero.","tags":["week10","person"],"ref":"pele"},{"id":"fc_goulart","front":"Jo\u00e3o Goulart","back":"President 1961-64, Vargas's heir; pushed basic reforms amid near-100-percent inflation; overthrown in 1964. Matters for democracy: his fall ended the 1946 republic.","tags":["week10","person"],"ref":"goulart"},{"id":"fc_castelo","front":"Castelo Branco","back":"First military president, 1964-67, 'the Legalist': Institutional Acts and two-party system. Matters for democracy: dictatorship disguised as legality.","tags":["week11","person"],"ref":"castelo_branco"},{"id":"fc_medici","front":"M\u00e9dici","back":"Military president 1969-74: economic miracle and the most violent repression. Matters for democracy: growth used to legitimize terror.","tags":["week11","person"],"ref":"medici"},{"id":"fc_geisel","front":"Geisel","back":"Military president 1974-79; began slow, on-and-off distens\u00e3o. Matters for democracy: opening from above, meant to stay under military control.","tags":["week11","person"],"ref":"geisel"},{"id":"fc_delfim","front":"Delfim Netto","back":"Finance minister 1967-74, architect of the miracle; 1973 inflation figures were manipulated under him. Matters for democracy: unaccountable technocracy, whose exposure fueled protest.","tags":["week11","person"],"ref":"delfim_netto"},{"id":"fc_chico","front":"Chico Buarque","back":"Wrote 'Apesar de voc\u00ea' (1970) and 'C\u00e1lice' (1978) using double meanings against censorship. Matters for democracy: art kept dissent and hope alive.","tags":["week11","person"],"ref":"chico_buarque"},{"id":"fc_caetano","front":"Caetano Veloso","back":"Tropic\u00e1lia leader; '\u00c9 proibido proibir' (1968); arrested after AI-5 and exiled. Matters for democracy: countercultural dissent against authority.","tags":["week11","person"],"ref":"caetano_veloso"},{"id":"fc_nascimento","front":"Abdias do Nascimento","back":"Black activist; Black Experimental Theatre (1944); 'The Myth of Racial Democracy' (1968); exiled 13 years. Matters for democracy: no real democracy without racial equality.","tags":["week11","person"],"ref":"nascimento"},{"id":"fc_lula","front":"Lula","back":"Led the 1978-80 ABC metalworkers' strikes, founded the PT, president 2003-10 and from 2023. Matters for democracy: democratization from below, from strikes to presidency.","tags":["week11","person"],"ref":"lula"},{"id":"fc_eunice","front":"Eunice Paiva","back":"Wife of disappeared deputy Rubens Paiva; became a lawyer and won his death certificate in 1996. Matters for democracy: persistent legal dissent, slow but effective.","tags":["week11","person"],"ref":"eunice_paiva"},{"id":"fc_brizola","front":"Leonel Brizola","back":"Exiled after 1964, returned 1979, won Rio governor 1982 with favela votes; 'brown socialism.' Matters for democracy: extended citizenship to the informal urban poor.","tags":["week12","person"],"ref":"brizola"},{"id":"fc_tancredo","front":"Tancredo Neves","back":"Opposition leader chosen by the electoral college in January 1985; died before taking office. Matters for democracy: negotiated, indirect end of military rule.","tags":["week12","person"],"ref":"tancredo_neves"},{"id":"fc_sarney","front":"Jos\u00e9 Sarney","back":"Longtime regime ally, first civilian president 1985-90; Plano Cruzado and the 1988 Constitution. Matters for democracy: continuity with the old regime inside the new democracy.","tags":["week12","person"],"ref":"sarney"},{"id":"fc_ulysses","front":"Ulysses Guimar\u00e3es","back":"Presided over the Constituent Assembly; called 1988 the 'Citizen Constitution': 'We hate dictatorship. Hate and disgust.' Matters for democracy: voice of the democratic break.","tags":["week12","person"],"ref":"ulysses_guimaraes"},{"id":"fc_fhc","front":"Fernando Henrique Cardoso","back":"Dependency theorist; Plano Real (1994); president 1995-2002; announced the 'end of the Vargas era.' Matters for democracy: market reform pursued within democracy.","tags":["week12","person"],"ref":"fhc"},{"id":"fc_cafe","front":"Caf\u00e9 com leite","back":"S\u00e3o Paulo and Minas Gerais elites alternating the First Republic's presidency. Matters for democracy: oligarchic rule whose 1930 collapse began the Vargas era.","tags":["week9","term"],"ref":"cafe_com_leite"},{"id":"fc_populism","front":"Populism","back":"'People versus elite' politics of urban crowds, emotional oratory and nationalism, rising after the Depression. Matters for democracy: brought new classes in through loyalty to a leader.","tags":["week9","term"],"ref":"populism"},{"id":"fc_corporatism","front":"Corporatism","back":"State-directed relations between labor and business; a 'third path' between capitalism and communism. Matters for democracy: rights in exchange for state control of unions.","tags":["week9","term"],"ref":"corporatism"},{"id":"fc_econnat","front":"Economic nationalism","back":"Nationalizing strategic resources and building state industries (Volta Redonda, Petrobras). Matters for democracy: mass campaigns tied sovereignty to popular welfare.","tags":["week9","term"],"ref":"economic_nationalism"},{"id":"fc_iaps","front":"IAPs","back":"Vargas-era pension and health funds by profession; rural, domestic and informal workers excluded as indigentes. Matter
